<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="1150" height="720">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="titleGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1150" height="720" rx="24" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1126" height="696" rx="20" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Title -->
  <g filter="url(#shadow4)">
    <rect x="40" y="24" width="1070" height="76" rx="16" fill="#030712" stroke="#c084fc" stroke-width="3"/>
    <text x="575" y="73" fill="url(#titleGrad4)" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="30" font-weight="900" text-anchor="middle">🤝 सामाजिक विविधताओं में सामंजस्य की 2 अनिवार्य शर्तें</text>
  </g>

  <!-- Left Card: शर्त 1 -->
  <g transform="translate(40, 125)" filter="url(#shadow4)">
    <rect width="520" height="555" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="520" height="54" rx="18" fill="#0284c7"/>
    <text x="260" y="37" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">शर्त 1: बहुमत केवल बहुसंख्यकों का शासन न बने</text>
    
    <text x="25" y="105" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• अल्पसंख्यकों के साथ मिलकर काम करना:</text>
    <text x="25" y="140" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">बहुमत की प्रत्येक राय और निर्णय में अल्पसंख्यकों</tspan>
      <tspan x="25" dy="28">के विचारों और हितों को भी समुचित स्थान मिलना चाहिए।</tspan>
    </text>

    <text x="25" y="225" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• कोई समूह स्थायी बहुसंख्यक नहीं होता:</text>
    <text x="25" y="260" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">अलग-अलग विषयों व चुनावों में अलग-अलग नागरिक</tspan>
      <tspan x="25" dy="28">और सामाजिक समूह बहुमत का हिस्सा बन सकते हैं।</tspan>
    </text>

    <rect x="25" y="370" width="470" height="150" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="260" y="410" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">🎯 लोकतंत्र का मूल नियम:</text>
    <text x="260" y="450" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
      <tspan x="260" dy="0">बहुमत और अल्पमत को हमेशा मिलकर कार्य करना</tspan>
      <tspan x="260" dy="28">चाहिए ताकि सरकार पूरे समाज का प्रतिनिधित्व</tspan>
      <tspan x="260" dy="28">कर सके, न कि केवल एक विशेष वर्ग का।</tspan>
    </text>
  </g>

  <!-- Right Card: शर्त 2 -->
  <g transform="translate(590, 125)" filter="url(#shadow4)">
    <rect width="520" height="555" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="3"/>
    <rect x="0" y="0" width="520" height="54" rx="18" fill="#9333ea"/>
    <text x="260" y="37" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">शर्त 2: शासन धर्म या जाति आधारित न हो</text>
    
    <text x="25" y="105" fill="#c084fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• बहुसंख्यक समुदाय का वर्चस्व निषेध:</text>
    <text x="25" y="140" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">बहुमत का अर्थ किसी एक विशेष धर्म, जाति या भाषाई</tspan>
      <tspan x="25" dy="28">समुदाय का शासन कदापि नहीं होना चाहिए।</tspan>
    </text>

    <text x="25" y="225" fill="#c084fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• प्रत्येक नागरिक को बहुमत में आने का अवसर:</text>
    <text x="25" y="260" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">यदि किसी नागरिक को जन्म, धर्म या जाति के आधार पर</tspan>
      <tspan x="25" dy="28">बहुमत से बाहर रखा जाए, तो लोकतंत्र अर्थहीन हो जाता है।</tspan>
    </text>

    <rect x="25" y="370" width="470" height="150" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <text x="260" y="410" fill="#e9d5ff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">🎯 ऐतिहासिक सबक:</text>
    <text x="260" y="450" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
      <tspan x="260" dy="0">श्रीलंका में बहुसंख्यकवाद ने गृहयुद्ध को जन्म दिया;</tspan>
      <tspan x="260" dy="28">जबकि बेल्जियम में परस्पर सम्मान व सामंजस्य</tspan>
      <tspan x="260" dy="28">ने देश की एकता को अटूट और मजबूत बनाया।</tspan>
    </text>
  </g>
</svg>