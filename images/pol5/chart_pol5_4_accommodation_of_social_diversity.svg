<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="titleGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow4)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#c084fc" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad4)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">🤝 सामाजिक विविधताओं में सामंजस्य (Accommodation of Social Diversity)</text>
  </g>

  <!-- 2 Conditions Grid -->
  <g transform="translate(35, 125)" filter="url(#shadow4)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#0284c7"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">शर्त 1: बहुमत केवल बहुसंख्यकों का शासन न बने</text>
    
    <text x="25" y="100" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• अल्पसंख्यकों के साथ मिलकर काम करना:</text>
    <text x="25" y="135" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">बहुमत की राय में अल्पसंख्यकों के हितों की भी अभिव्यक्ति होनी चाहिए।</text>

    <text x="25" y="200" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• कोई एक समूह स्थायी बहुसंख्यक नहीं:</text>
    <text x="25" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">अलग-अलग विषयों व चुनावों में अलग-अलग लोग बहुमत का हिस्सा बन सकते हैं।</text>
  </g>

  <g transform="translate(565, 125)" filter="url(#shadow4)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#9333ea"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">शर्त 2: धर्म व जाति के आधार पर शासन न हो</text>
    
    <text x="25" y="100" fill="#e9d5ff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• बहुसंख्यक समुदाय का वर्चस्व नहीं:</text>
    <text x="25" y="135" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">बहुमत का मतलब केवल किसी एक धर्म या जाति के समुदाय का शासन नहीं है।</text>

    <text x="25" y="200" fill="#e9d5ff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• हर नागरिक को अवसर:</text>
    <text x="25" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">यदि किसी नागरिक को जन्म के आधार पर बहुमत से रोका गया, तो लोकतंत्र निष्प्रभावी हो जाता है।</text>
  </g>
</svg>