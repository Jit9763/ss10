<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="1150" height="720">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1150" height="720" rx="24" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1126" height="696" rx="20" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Title -->
  <g filter="url(#shadow2)">
    <rect x="40" y="24" width="1070" height="76" rx="16" fill="#030712" stroke="#34d399" stroke-width="3"/>
    <text x="575" y="73" fill="url(#titleGrad2)" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="30" font-weight="900" text-anchor="middle">🏛️ उत्तरदायी, जिम्मेदार एवं वैध सरकार (3 Core Pillars of Democracy)</text>
  </g>

  <!-- 3 Columns -->
  <!-- Column 1: उत्तरदायी -->
  <g transform="translate(40, 125)" filter="url(#shadow2)">
    <rect width="340" height="555" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="340" height="52" rx="18" fill="#0284c7"/>
    <text x="170" y="36" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">1. उत्तरदायी (Accountable)</text>

    <text x="20" y="95" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• जनता के प्रति जवाबदेह:</text>
    <text x="20" y="125" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="20" dy="0">सरकार को अपने प्रत्येक फैसले</tspan>
      <tspan x="20" dy="28">और नीति की जानकारी संसद और</tspan>
      <tspan x="20" dy="28">नागरिकों को देनी होती है।</tspan>
    </text>

    <text x="20" y="235" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• पारदर्शिता (Transparency):</text>
    <text x="20" y="265" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="20" dy="0">सूचना का अधिकार (RTI) से</tspan>
      <tspan x="20" dy="28">नागरिक निर्णय प्रक्रिया के नियमों</tspan>
      <tspan x="20" dy="28">की निष्पक्ष जांच कर सकते हैं।</tspan>
    </text>

    <rect x="18" y="440" width="304" height="95" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="475" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900" text-anchor="middle">🎯 मुख्य पहचान:</text>
    <text x="170" y="510" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">शासक जनता के प्रति जवाबदेह</text>
  </g>

  <!-- Column 2: जिम्मेदार -->
  <g transform="translate(405, 125)" filter="url(#shadow2)">
    <rect width="340" height="555" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <rect x="0" y="0" width="340" height="52" rx="18" fill="#059669"/>
    <text x="170" y="36" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">2. जिम्मेदार (Responsive)</text>

    <text x="20" y="95" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• जन-मांगों के प्रति संवेदनशील:</text>
    <text x="20" y="125" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="20" dy="0">जनता की बुनियादी जरूरतों,</tspan>
      <tspan x="20" dy="28">स्वास्थ्य, शिक्षा और रोजगार की</tspan>
      <tspan x="20" dy="28">मांगों पर त्वरित ध्यान देना।</tspan>
    </text>

    <text x="20" y="235" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• समस्याओं का त्वरित निवारण:</text>
    <text x="20" y="265" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="20" dy="0">भ्रष्टाचार से मुक्त प्रशासन</tspan>
      <tspan x="20" dy="28">और नागरिक शिकायतों की समय पर</tspan>
      <tspan x="20" dy="28">निष्पक्ष व पारदर्शी सुनवाई।</tspan>
    </text>

    <rect x="18" y="440" width="304" height="95" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="170" y="475" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900" text-anchor="middle">🎯 मुख्य पहचान:</text>
    <text x="170" y="510" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">जन-समस्याओं के प्रति संवेदनशीलता</text>
  </g>

  <!-- Column 3: वैध सरकार -->
  <g transform="translate(770, 125)" filter="url(#shadow2)">
    <rect width="340" height="555" rx="18" fill="#1e293b" stroke="#facc15" stroke-width="3"/>
    <rect x="0" y="0" width="340" height="52" rx="18" fill="#d97706"/>
    <text x="170" y="36" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">3. वैध सरकार (Legitimate)</text>

    <text x="20" y="95" fill="#facc15" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• जनता की अपनी चुनी सरकार:</text>
    <text x="20" y="125" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="20" dy="0">स्वतंत्र व निष्पक्ष चुनावों द्वारा</tspan>
      <tspan x="20" dy="28">नियमित रूप से जनता के मत से</tspan>
      <tspan x="20" dy="28">स्थापित होने वाली वैध व्यवस्था।</tspan>
    </text>

    <text x="20" y="235" fill="#facc15" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• संवैधानिक नियमों का पालन:</text>
    <text x="20" y="265" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="20" dy="0">संविधान और कानून के दायरे में</tspan>
      <tspan x="20" dy="28">रहकर काम करना; जनता का</tspan>
      <tspan x="20" dy="28">इस पर अटूट भरोसा होता है।</tspan>
    </text>

    <rect x="18" y="440" width="304" height="95" rx="12" fill="#78350f" stroke="#facc15" stroke-width="1.5"/>
    <text x="170" y="475" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900" text-anchor="middle">🎯 मुख्य पहचान:</text>
    <text x="170" y="510" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">लोकतांत्रिक जनादेश का नैतिक बल</text>
  </g>
</svg>