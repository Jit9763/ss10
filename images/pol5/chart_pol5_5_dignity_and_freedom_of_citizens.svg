<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="1150" height="720">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="titleGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1150" height="720" rx="24" fill="url(#bgGrad5)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1126" height="696" rx="20" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Title -->
  <g filter="url(#shadow5)">
    <rect x="40" y="24" width="1070" height="76" rx="16" fill="#030712" stroke="#34d399" stroke-width="3"/>
    <text x="575" y="73" fill="url(#titleGrad5)" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="30" font-weight="900" text-anchor="middle">👑 नागरिकों की गरिमा और आजादी (Dignity &amp; Freedom of Citizens)</text>
  </g>

  <!-- Left Card: महिलाओं की गरिमा -->
  <g transform="translate(40, 125)" filter="url(#shadow5)">
    <rect width="520" height="555" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
    <rect x="0" y="0" width="520" height="54" rx="18" fill="#db2777"/>
    <text x="260" y="37" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="23" font-weight="900" text-anchor="middle">1. महिलाओं की गरिमा एवं समान अवसर</text>
    
    <text x="25" y="105" fill="#f472b6" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• ऐतिहासिक पुरुष-वर्चस्व के विरुद्ध संघर्ष:</text>
    <text x="25" y="140" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">लंबे संघर्षों के बाद आज यह स्वीकार किया गया कि</tspan>
      <tspan x="25" dy="28">महिलाओं से सम्मान और बराबरी का व्यवहार किसी भी</tspan>
      <tspan x="25" dy="28">लोकतांत्रिक समाज की बुनियादी और अनिवार्य शर्त है।</tspan>
    </text>

    <text x="25" y="245" fill="#f472b6" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• कानूनी एवं नैतिक आधार की प्राप्ति:</text>
    <text x="25" y="280" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">तानाशाही शासनों में महिलाओं को अधिकार नहीं थे;</tspan>
      <tspan x="25" dy="28">लोकतंत्र ने उन्हें भेदभाव और घरेलू हिंसा के खिलाफ</tspan>
      <tspan x="25" dy="28">अदालत में कानूनी लड़ाई लड़ने का नैतिक बल दिया।</tspan>
    </text>

    <rect x="25" y="390" width="470" height="135" rx="14" fill="#500724" stroke="#f472b6" stroke-width="2"/>
    <text x="260" y="430" fill="#fbcfe8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">🎯 महिला सशक्तीकरण:</text>
    <text x="260" y="470" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
      <tspan x="260" dy="0">कानूनी मान्यता होने से समाज में बराबरी के</tspan>
      <tspan x="260" dy="28">दावों को नैतिक स्वीकार्यता प्राप्त हुई है।</tspan>
    </text>
  </g>

  <!-- Right Card: वंचित जातियों की गरिमा -->
  <g transform="translate(590, 125)" filter="url(#shadow5)">
    <rect width="520" height="555" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <rect x="0" y="0" width="520" height="54" rx="18" fill="#059669"/>
    <text x="260" y="37" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="23" font-weight="900" text-anchor="middle">2. वंचित जातियों की गरिमा व दावों को बल</text>
    
    <text x="25" y="105" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• भेदभाव के विरुद्ध संवैधानिक अधिकार:</text>
    <text x="25" y="140" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">सदियों से शोषित व वंचित जातियों को लोकतंत्र ने</tspan>
      <tspan x="25" dy="28">समान दर्जे और अवसरों की मांग करने का वैध</tspan>
      <tspan x="25" dy="28">अधिकार और आत्मसम्मान से जीने का हौसला दिया।</tspan>
    </text>

    <text x="25" y="245" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">• जनता की शिकायतें - सफलता का प्रमाण:</text>
    <text x="25" y="280" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">
      <tspan x="25" dy="0">नागरिकों की निरंतर शिकायतें यह सिद्ध करती हैं</tspan>
      <tspan x="25" dy="28">कि वे मूक प्रजा नहीं हैं, बल्कि जागरूक नागरिक</tspan>
      <tspan x="25" dy="28">बनकर सत्ता से अपना लोकतांत्रिक हक मांग रहे हैं।</tspan>
    </text>

    <rect x="25" y="390" width="470" height="135" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="260" y="430" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">🎯 लोकतंत्र की सतत परीक्षा:</text>
    <text x="260" y="470" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
      <tspan x="260" dy="0">लोकतंत्र कभी ठहरता नहीं; नागरिकों की नई मांगें</tspan>
      <tspan x="260" dy="28">ही लोकतंत्र की जीवंतता का सबसे बड़ा प्रमाण हैं।</tspan>
    </text>
  </g>
</svg>