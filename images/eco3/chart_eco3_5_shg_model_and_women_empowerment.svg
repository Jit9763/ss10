<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGrad5)"/>

  <!-- Master Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGrad5)" filter="url(#shadow5)" stroke="#fbcfe8" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    🤝 निर्धनों के स्वयं सहायता समूह (Self-Help Groups - SHG) एवं महिला सशक्तिकरण
  </text>

  <!-- COLUMN 1: STRUCTURE & SAVINGS -->
  <g transform="translate(45, 95)" filter="url(#shadow5)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#9d174d"/>
    <rect y="28" width="320" height="18" fill="#9d174d"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">👩‍🦰 1. SHG गठन व बचत</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#db2777" stroke-width="1.5"/>
    <text x="25" y="84" fill="#f472b6" font-size="14" font-weight="900" font-family="system-ui, sans-serif">👥 सदस्य संरचना:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• एक ही गांव/पड़ोस की 15-20 महिलाएं।</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• नियमित साप्ताहिक/मासिक बैठकें।</text>

    <rect x="15" y="158" width="290" height="85" rx="10" fill="#831843"/>
    <text x="25" y="182" fill="#fbcfe8" font-size="14" font-weight="900" font-family="system-ui, sans-serif">💰 नियमित बचत:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• प्रति सदस्य ₹25 से ₹100 या अधिक बचत।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सामर्थ्य अनुसार समूह के कोष में जमा।</text>

    <rect x="15" y="255" width="290" height="130" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <text x="160" y="280" fill="#f472b6" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🔄 आंतरिक छोटा ऋण (Internal Loans):</text>
    <text x="25" y="305" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सदस्यों को आपातकाल या जरूरत पर</text>
    <text x="25" y="325" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  समूह के फंड से छोटा ऋण मिलता है।</text>
    <text x="25" y="347" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• साहूकार की तुलना में बहुत कम ब्याज।</text>
    <text x="25" y="369" fill="#38bdf8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• समूह स्वयं शर्तें व ब्याज तय करता है।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#9d174d"/>
    <text x="160" y="422" fill="#fce7f3" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🎯 मुख्य लाभ:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• साहूकारों के शोषण से मुक्ति और</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  बचत की आदत का निर्माण।</text>
  </g>

  <!-- COLUMN 2: BANK LINKAGE & COLLATERAL-FREE LOANS -->
  <g transform="translate(390, 95)" filter="url(#shadow5)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#6b21a8"/>
    <rect y="28" width="320" height="18" fill="#6b21a8"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🏦 2. बैंक लिंकेज व साख</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1.5"/>
    <text x="25" y="84" fill="#c084fc" font-size="14" font-weight="900" font-family="system-ui, sans-serif">⏱️ 1-2 वर्ष नियमित बचत:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• समूह यदि 1-2 वर्ष तक नियमित बचत</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  करता है तो वह बैंक ऋण योग्य हो जाता है।</text>

    <rect x="15" y="158" width="290" height="85" rx="10" fill="#581c87"/>
    <text x="25" y="182" fill="#e9d5ff" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🛡️ बिना समर्थक ऋणाधार ऋण:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• ऋण समूह के नाम पर मंजूर होता है।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• किसी व्यक्तिगत संपार्श्विक की जरूरत नहीं!</text>

    <rect x="15" y="255" width="290" height="130" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="160" y="280" fill="#c084fc" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🤝 सामूहिक उत्तरदायित्व:</text>
    <text x="25" y="305" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• ऋण की अदायगी का उत्तरदायित्व</text>
    <text x="25" y="325" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  पूरे समूह का सामूहिक होता है।</text>
    <text x="25" y="347" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• समय पर वसूली सुनिश्चित रहती है,</text>
    <text x="25" y="369" fill="#38bdf8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">  इसलिए बैंक खुशी-खुशी ऋण देते हैं।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#6b21a8"/>
    <text x="160" y="422" fill="#f3e8ff" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">📦 उपयोग के क्षेत्र:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• बीज, खाद, मवेशी, सिलाई मशीन,</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  हथकरघा व कुटीर उद्योग हेतु।</text>
  </g>

  <!-- COLUMN 3: SOCIO-ECONOMIC EMPOWERMENT & GRAMEEN BANK -->
  <g transform="translate(735, 95)" filter="url(#shadow5)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#065f46"/>
    <rect y="28" width="320" height="18" fill="#065f46"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌟 3. सर्वांगीण सशक्तिकरण</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="25" y="84" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">💼 आर्थिक स्वावलंबन:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• महिलाएं स्वरोजगार प्रारंभ कर</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  परिवार की आय में भागीदार बनती हैं।</text>

    <rect x="15" y="158" width="290" height="85" rx="10" fill="#064e3b"/>
    <text x="25" y="182" fill="#6ee7b7" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🗣️ सामाजिक मंच (Social Platform):</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• बैठकों में स्वास्थ्य, पोषण एवं</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  घरेलू हिंसा जैसे मुद्दों पर खुली चर्चा।</text>

    <rect x="15" y="255" width="290" height="130" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="280" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🇧🇩 बांग्लादेश ग्रामीण बैंक मॉडल:</text>
    <text x="25" y="305" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• संस्थापक: प्रो. मोहम्मद यूनुस</text>
    <text x="25" y="325" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  (2006 नोबेल शांति पुरस्कार)।</text>
    <text x="25" y="347" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• 90 लाख से अधिक ऋणी (97% महिलाएं)।</text>
    <text x="25" y="369" fill="#38bdf8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• गरीबी उन्मूलन की विश्वप्रसिद्ध मिसाल।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#065f46"/>
    <text x="160" y="422" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🏆 परिणाम:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• महिलाएं न केवल आर्थिक रूप से सक्षम,</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  बल्कि सामाजिक नेता बनती हैं।</text>
  </g>

  <!-- Bottom Footer Bar -->
  <rect x="40" y="598" width="1020" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="623" fill="#94a3b8" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    💡 SHG की सफलता का मंत्र: "समूह की ताकत से संपार्श्विक का अभाव दूर होता है और महिलाएं स्वावलंबी बनती हैं।"
  </text>
</svg>