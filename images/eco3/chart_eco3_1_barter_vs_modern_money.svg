<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGrad)"/>

  <!-- Master Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGrad)" filter="url(#shadow)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    🪙 मुद्रा का ऐतिहासिक विकास: वस्तु विनिमय से आधुनिक डिजिटल मुद्रा तक (Evolution of Money)
  </text>

  <!-- COLUMN 1: BARTER SYSTEM -->
  <g transform="translate(45, 95)" filter="url(#shadow)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#b45309"/>
    <rect y="28" width="320" height="18" fill="#b45309"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌾 1. वस्तु विनिमय प्रणाली</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <text x="25" y="84" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🔄 आवश्यकताओं का दोहरा संयोग:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• दोनों पक्षों का एक-दूसरे की वस्तुओं को</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  खरीदने-बेचने पर सहमत होना अनिवार्य।</text>

    <rect x="15" y="158" width="290" height="80" rx="10" fill="#78350f"/>
    <text x="25" y="182" fill="#fde68a" font-size="14" font-weight="900" font-family="system-ui, sans-serif">⚠️ प्रणाली की मुख्य कमियां:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• मूल्य के समान मापक का अभाव।</text>
    <text x="25" y="226" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• वस्तु का संचय व विभाजन कठिन।</text>

    <rect x="15" y="250" width="290" height="135" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="275" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">💡 उदाहरण (जूते vs गेहूं):</text>
    <text x="25" y="300" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• जूता निर्माता को गेहूं चाहिए,</text>
    <text x="25" y="322" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  लेकिन किसान को जूते नहीं चाहिए।</text>
    <text x="25" y="344" fill="#f87171" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  $ightarrow$ लेन-देन संभव नहीं हो पाता!</text>
    <text x="25" y="368" fill="#38bdf8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• मुद्रा ने इस समस्या को समाप्त किया।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#92400e"/>
    <text x="160" y="422" fill="#fef3c7" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">📌 निष्कर्ष:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• मुद्रा 'विनिमय का माध्यम' बनकर</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  दोहरे संयोग की शर्त खत्म करती है।</text>
  </g>

  <!-- COLUMN 2: METALLIC & PAPER CURRENCY -->
  <g transform="translate(390, 95)" filter="url(#shadow)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#1e3a8a"/>
    <rect y="28" width="320" height="18" fill="#1e3a8a"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">💵 2. धातु सिक्के व कागजी नोट</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="25" y="84" fill="#60a5fa" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🏛️ प्राचीन से आधुनिक रूप:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• पहले: सोना, चांदी, तांबे के सिक्के</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  (जिनका अपना स्वयं का मूल्य था)।</text>

    <rect x="15" y="158" width="290" height="80" rx="10" fill="#1e3a8a"/>
    <text x="25" y="182" fill="#93c5fd" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📜 आधुनिक कागजी नोट:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• नोटों का अपना कोई आंतरिक मूल्य नहीं।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• यह 'विधिक ग्राह्य' (Legal Tender) है।</text>

    <rect x="15" y="250" width="290" height="135" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="275" fill="#60a5fa" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🇮🇳 स्वीकार्यता का आधार (RBI):</text>
    <text x="25" y="300" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारत सरकार की ओर से केवल</text>
    <text x="25" y="322" fill="#38bdf8" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  भारतीय रिज़र्व बैंक (RBI) नोट छापता है।</text>
    <text x="25" y="344" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• कानूनन कोई भी व्यक्ति भारत में</text>
    <text x="25" y="368" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  रुपये में भुगतान अस्वीकार नहीं कर सकता।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#172554"/>
    <text x="160" y="422" fill="#bfdbfe" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🎯 मुख्य विशेषता:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सरकार द्वारा प्राधिकृत होने के कारण</text>
    <text x="25" y="464" fill="#60a5fa" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  यह सर्वमान्य विनिमय माध्यम है।</text>
  </g>

  <!-- COLUMN 3: BANK DEPOSITS, CHEQUE & DIGITAL -->
  <g transform="translate(735, 95)" filter="url(#shadow)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#065f46"/>
    <rect y="28" width="320" height="18" fill="#065f46"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">💳 3. बैंक निक्षेप, चेक व डिजिटल</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="25" y="84" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🏦 बैंकों में निक्षेप (Deposits):</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• लोग अतिरिक्त धन बैंक खाते में जमा करते हैं।</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• इस पर बैंक सुरक्षित ब्याज देता है।</text>

    <rect x="15" y="158" width="290" height="80" rx="10" fill="#064e3b"/>
    <text x="25" y="182" fill="#6ee7b7" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📑 मांग जमा (Demand Deposits):</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• जमाकर्ता जब चाहे धन निकाल सकता है।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• मांग पर देय होने से इसे मांग जमा कहते हैं।</text>

    <rect x="15" y="250" width="290" height="135" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="275" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">✍️ चेक व डिजिटल भुगतान:</text>
    <text x="25" y="300" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• चेक: बैंक को निर्दिष्ट खाते में से</text>
    <text x="25" y="322" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  निश्चित रकम भुगतान का लिखित आदेश।</text>
    <text x="25" y="344" fill="#38bdf8" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• बिना नकद लेन-देन सीधे खाता हस्तांतरण।</text>
    <text x="25" y="368" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• UPI / Debit Card / Net Banking।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#065f46"/>
    <text x="160" y="422" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🚀 आधुनिक अर्थव्यवस्था:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• कैशलेस अर्थव्यवस्था में मांग जमा</text>
    <text x="25" y="464" fill="#a7f3d0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  मुद्रा के समान ही स्वीकार्य है।</text>
  </g>

  <!-- Bottom Footer Bar -->
  <rect x="40" y="598" width="1020" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="623" fill="#94a3b8" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    💡 मुख्य सूत्र: मुद्रा विनिमय प्रक्रिया में मध्यस्थता करती है और आर्थिक गतिविधियों को सुगम बनाती है।
  </text>
</svg>