<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <rect width="1100" height="600" rx="18" fill="#064e3b"/>
  <rect x="12" y="12" width="1076" height="576" rx="14" fill="none" stroke="#10b981" stroke-width="4"/>

  <!-- Wide Title Banner (1020px) -->
  <rect x="40" y="18" width="1020" height="52" rx="14" fill="#065f46" stroke="#34d399" stroke-width="3"/>
  <text x="550" y="52" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle">
    चार्ट 4.3: भारत में प्रमुख फसलों का तुलनात्मक उत्पादन (Production Bar Chart in MT)
  </text>

  <!-- Bar Chart Axes -->
  <line x1="140" y1="450" x2="1020" y2="450" stroke="#a7f3d0" stroke-width="3"/>
  <line x1="140" y1="100" x2="140" y2="450" stroke="#a7f3d0" stroke-width="3"/>

  <!-- Y-Axis Grid Lines -->
  <g stroke="#047857" stroke-width="1" stroke-dasharray="6,4">
    <line x1="140" y1="370" x2="1020" y2="370"/>
    <line x1="140" y1="290" x2="1020" y2="290"/>
    <line x1="140" y1="210" x2="1020" y2="210"/>
    <line x1="140" y1="130" x2="1020" y2="130"/>
  </g>
  <text x="120" y="455" font-family="'Segoe UI', Arial" font-size="15" fill="#a7f3d0" text-anchor="end">0</text>
  <text x="120" y="375" font-family="'Segoe UI', Arial" font-size="15" fill="#a7f3d0" text-anchor="end">30 MT</text>
  <text x="120" y="295" font-family="'Segoe UI', Arial" font-size="15" fill="#a7f3d0" text-anchor="end">60 MT</text>
  <text x="120" y="215" font-family="'Segoe UI', Arial" font-size="15" fill="#a7f3d0" text-anchor="end">90 MT</text>
  <text x="120" y="135" font-family="'Segoe UI', Arial" font-size="15" fill="#a7f3d0" text-anchor="end">120+ MT</text>

  <!-- Bar 1: Rice (125 MT) -->
  <rect x="190" y="140" width="115" height="310" rx="10" fill="#22c55e" stroke="#86efac" stroke-width="2"/>
  <text x="247" y="125" font-family="'Segoe UI', Arial" font-size="18" font-weight="900" fill="#86efac" text-anchor="middle">125 MT</text>
  <text x="247" y="478" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">चावल (Rice)</text>
  <text x="247" y="502" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="700" fill="#a7f3d0" text-anchor="middle">प्रथम खाद्यान्न</text>

  <!-- Bar 2: Wheat (108 MT) -->
  <rect x="360" y="180" width="115" height="270" rx="10" fill="#f59e0b" stroke="#fde047" stroke-width="2"/>
  <text x="417" y="165" font-family="'Segoe UI', Arial" font-size="18" font-weight="900" fill="#fde047" text-anchor="middle">108 MT</text>
  <text x="417" y="478" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">गेहूं (Wheat)</text>
  <text x="417" y="502" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="700" fill="#fef08a" text-anchor="middle">द्वितीय खाद्यान्न</text>

  <!-- Bar 3: Coarse Cereals / Millets (50 MT) -->
  <rect x="530" y="320" width="115" height="130" rx="10" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
  <text x="587" y="305" font-family="'Segoe UI', Arial" font-size="18" font-weight="900" fill="#fbbf24" text-anchor="middle">50 MT</text>
  <text x="587" y="478" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">मोटे अनाज</text>
  <text x="587" y="502" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="700" fill="#fde68a" text-anchor="middle">ज्वार, बाजरा, मक्का</text>

  <!-- Bar 4: Oilseeds (38 MT) -->
  <rect x="700" y="350" width="115" height="100" rx="10" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
  <text x="757" y="335" font-family="'Segoe UI', Arial" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">38 MT</text>
  <text x="757" y="478" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">तिलहन</text>
  <text x="757" y="502" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="700" fill="#bae6fd" text-anchor="middle">मूंगफली, सरसों</text>

  <!-- Bar 5: Pulses (27 MT) -->
  <rect x="870" y="380" width="115" height="70" rx="10" fill="#ec4899" stroke="#f472b6" stroke-width="2"/>
  <text x="927" y="365" font-family="'Segoe UI', Arial" font-size="18" font-weight="900" fill="#f472b6" text-anchor="middle">27 MT</text>
  <text x="927" y="478" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">दालें (Pulses)</text>
  <text x="927" y="502" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="700" fill="#fbcfe8" text-anchor="middle">विश्व में प्रथम स्थान</text>

  <!-- Bottom Legend -->
  <rect x="40" y="525" width="1020" height="50" rx="12" fill="#042f2e" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="556" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
    📊 चावल और गेहूं मिलकर भारत के कुल खाद्यान्न उत्पादन का लगभग 80% से अधिक हिस्सा बनाते हैं।
  </text>
</svg>