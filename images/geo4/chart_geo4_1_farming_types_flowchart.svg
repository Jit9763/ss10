<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <rect width="1100" height="600" rx="18" fill="#042f2e"/>
  <rect x="12" y="12" width="1076" height="576" rx="14" fill="none" stroke="#14b8a6" stroke-width="4"/>

  <!-- Wide Title Banner (1020px) -->
  <rect x="40" y="18" width="1020" height="52" rx="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="3"/>
  <text x="550" y="52" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle">
    चार्ट 4.1: भारत में कृषि के प्रकारों का वर्गीकरण (Classification of Farming Types)
  </text>

  <!-- Root Node -->
  <rect x="400" y="95" width="300" height="54" rx="12" fill="#0d9488" stroke="#5eead4" stroke-width="3"/>
  <text x="550" y="130" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle">🌱 भारतीय कृषि के मुख्य प्रकार</text>

  <!-- Connectors -->
  <line x1="550" y1="149" x2="550" y2="180" stroke="#5eead4" stroke-width="4"/>
  <line x1="200" y1="180" x2="900" y2="180" stroke="#5eead4" stroke-width="4"/>
  <line x1="200" y1="180" x2="200" y2="210" stroke="#5eead4" stroke-width="4"/>
  <line x1="550" y1="180" x2="550" y2="210" stroke="#5eead4" stroke-width="4"/>
  <line x1="900" y1="180" x2="900" y2="210" stroke="#5eead4" stroke-width="4"/>

  <!-- Branch 1: Primitive Subsistence -->
  <g transform="translate(45, 210)">
    <rect width="310" height="290" rx="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="40" rx="8" fill="#0f766e"/>
    <text x="155" y="42" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">1. प्रारंभिक जीविका निर्वाह</text>
    
    <text x="18" y="85" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ccfbf1">• 'कर्तन-दहन' (झूम / Slash &amp; Burn)</text>
    <text x="18" y="115" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• लकड़ी के हल, डाओ व खुरपी का प्रयोग</text>
    <text x="18" y="145" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• मानसून व प्राकृतिक उर्वरता पर निर्भर</text>
    <text x="18" y="175" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• परिवार व समुदाय श्रम द्वारा खेती</text>
    <text x="18" y="205" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• कम उत्पादकता (केवल जीवन निर्वाह)</text>

    <rect x="15" y="235" width="280" height="36" rx="6" fill="#042f2e"/>
    <text x="155" y="258" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="900" fill="#5eead4" text-anchor="middle">पूर्वोत्तर भारत में 'झूम कृषि'</text>
  </g>

  <!-- Branch 2: Intensive Subsistence -->
  <g transform="translate(395, 210)">
    <rect width="310" height="290" rx="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="40" rx="8" fill="#0f766e"/>
    <text x="155" y="42" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">2. गहन जीविका कृषि</text>
    
    <text x="18" y="85" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ccfbf1">• भूमि पर अत्यधिक जनसंख्या दबाव</text>
    <text x="18" y="115" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• उच्च मात्रा में रासायनिक खाद व दवाएं</text>
    <text x="18" y="145" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• नहरी व नलकूप सिंचाई का सघन प्रयोग</text>
    <text x="18" y="175" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• खेतों का आकार छोटा व खंडित</text>
    <text x="18" y="205" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• वर्ष में 2-3 सघन फसलें लेना</text>

    <rect x="15" y="235" width="280" height="36" rx="6" fill="#042f2e"/>
    <text x="155" y="258" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="900" fill="#5eead4" text-anchor="middle">गंगा मैदान, उ.प्र., बिहार, प. बंगाल</text>
  </g>

  <!-- Branch 3: Commercial & Plantation -->
  <g transform="translate(745, 210)">
    <rect width="310" height="290" rx="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="40" rx="8" fill="#0f766e"/>
    <text x="155" y="42" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">3. वाणिज्यिक / रोपण कृषि</text>
    
    <text x="18" y="85" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ccfbf1">• अधिक उपज देने वाले बीज (HYV)</text>
    <text x="18" y="115" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• भारी पूंजी व आधुनिक मशीनीकरण</text>
    <text x="18" y="145" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• बाजार में व्यापार हेतु बड़े पैमाने पर</text>
    <text x="18" y="175" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• रोपण: विशाल भूखंड पर एकल फसल</text>
    <text x="18" y="205" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff">• चाय, कॉफी, रबर, गन्ना, केला</text>

    <rect x="15" y="235" width="280" height="36" rx="6" fill="#042f2e"/>
    <text x="155" y="258" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="13" font-weight="900" fill="#5eead4" text-anchor="middle">असम (चाय), कर्नाटक (कॉफी), केरल (रबर)</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="40" y="525" width="1020" height="50" rx="12" fill="#115e59" stroke="#2dd4bf" stroke-width="2"/>
  <text x="550" y="556" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
    📌 रोपण कृषि उद्योग और कृषि के मध्य एक अंतरापृष्ठ (Interface) है जो उद्योगों को सीधा कच्चा माल प्रदान करती है।
  </text>
</svg>