<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="counterWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="counterFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- BACKGROUND WALL -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#wallGrad)"/>

  <!-- BANNER (Top Left) -->
  <g filter="url(#shadow)">
    <rect x="70" y="25" width="360" height="90" rx="12" fill="#047857" stroke="#065f46" stroke-width="4"/>
    <rect x="78" y="33" width="344" height="74" rx="8" fill="#ffffff"/>
    <text x="250" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#065f46" text-anchor="middle">SAVING MONEY IS NECESSARY</text>
    <text x="250" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#047857" text-anchor="middle">FOR OUR BRIGHT FUTURE</text>
  </g>

  <!-- WALL CLOCK (Top Right) -->
  <g filter="url(#shadow)">
    <circle cx="1080" cy="75" r="50" fill="#fef3c7" stroke="#78350f" stroke-width="8"/>
    <circle cx="1080" cy="75" r="42" fill="#ffffff"/>
    <!-- Hour marks -->
    <circle cx="1080" cy="40" r="3" fill="#1e293b"/>
    <circle cx="1115" cy="75" r="3" fill="#1e293b"/>
    <circle cx="1080" cy="110" r="3" fill="#1e293b"/>
    <circle cx="1045" cy="75" r="3" fill="#1e293b"/>
    <!-- Hands showing 10:10 -->
    <line x1="1080" y1="75" x2="1065" y2="52" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <line x1="1080" y1="75" x2="1098" y2="48" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1080" cy="75" r="5" fill="#1e293b"/>
  </g>

  <!-- GLASS PARTITION BEHIND COUNTER -->
  <rect x="40" y="130" width="1120" height="190" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="4" rx="4"/>
  <line x1="40" y1="130" x2="1160" y2="130" stroke="#7c2d12" stroke-width="12"/>
  <line x1="600" y1="130" x2="600" y2="320" stroke="#7c2d12" stroke-width="8"/>

  <!-- ================= BANK STAFF BEHIND GLASS ================= -->

  <!-- TELLER 1 (Left Window) -->
  <g id="teller1">
    <!-- Chair back -->
    <path d="M300 160 Q340 130 380 160 L390 280 L290 280 Z" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- Body/Shirt -->
    <path d="M300 240 L380 240 L395 320 L285 320 Z" fill="#10b981" stroke="#047857" stroke-width="3"/>
    <!-- Tie -->
    <polygon points="335,240 345,240 350,285 340,305 330,285" fill="#0284c7"/>
    <!-- Collar -->
    <polygon points="320,240 340,255 335,240" fill="#ffffff"/>
    <polygon points="360,240 340,255 345,240" fill="#ffffff"/>
    <!-- Head/Face -->
    <circle cx="340" cy="205" r="28" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
    <!-- Hair -->
    <path d="M312 200 Q340 165 368 200 Q355 180 340 180 Q325 180 312 200 Z" fill="#451a03"/>
    <!-- Eyes/Smile -->
    <circle cx="330" cy="205" r="3" fill="#1e293b"/>
    <circle cx="350" cy="205" r="3" fill="#1e293b"/>
    <path d="M333 218 Q340 225 347 218" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Computer Monitor 1 -->
    <rect x="170" y="190" width="100" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
    <rect x="180" y="200" width="80" height="65" rx="4" fill="#0f172a"/>
    <rect x="185" y="205" width="70" height="55" fill="#0369a1"/>
    <path d="M210 280 L230 280 L225 305 L215 305 Z" fill="#64748b"/>
    <rect x="200" y="305" width="40" height="8" rx="2" fill="#334155"/>
    <!-- Document Stacks -->
    <rect x="100" y="260" width="45" height="12" fill="#f43f5e" rx="2"/>
    <rect x="102" y="250" width="45" height="12" fill="#3b82f6" rx="2"/>
    <rect x="100" y="240" width="45" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- TELLER 2 (Right Window) -->
  <g id="teller2">
    <!-- Chair back -->
    <path d="M780 160 Q820 130 860 160 L870 280 L770 280 Z" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- Body/Shirt -->
    <path d="M780 240 L860 240 L875 320 L765 320 Z" fill="#10b981" stroke="#047857" stroke-width="3"/>
    <!-- Tie -->
    <polygon points="815,240 825,240 830,285 820,305 810,285" fill="#0284c7"/>
    <!-- Collar -->
    <polygon points="800,240 820,255 815,240" fill="#ffffff"/>
    <polygon points="840,240 820,255 825,240" fill="#ffffff"/>
    <!-- Head/Face -->
    <circle cx="820" cy="205" r="28" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <!-- Hair -->
    <path d="M792 200 Q820 165 848 200 Q835 180 820 180 Q805 180 792 200 Z" fill="#451a03"/>
    <!-- Eyes/Smile -->
    <circle cx="810" cy="205" r="3" fill="#1e293b"/>
    <circle cx="830" cy="205" r="3" fill="#1e293b"/>
    <path d="M813 218 Q820 225 827 218" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Computer Monitor 2 -->
    <rect x="670" y="190" width="100" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
    <rect x="680" y="200" width="80" height="65" rx="4" fill="#0f172a"/>
    <rect x="685" y="205" width="70" height="55" fill="#0369a1"/>
    <path d="M710 280 L730 280 L725 305 L715 305 Z" fill="#64748b"/>
    <rect x="700" y="305" width="40" height="8" rx="2" fill="#334155"/>
  </g>

  <!-- COUNTER WOODEN TOP SLAB -->
  <rect x="20" y="315" width="1160" height="25" fill="url(#counterWood)" stroke="#451a03" stroke-width="3" rx="4" filter="url(#shadow)"/>

  <!-- COUNTER FRONT PANEL -->
  <rect x="40" y="340" width="1120" height="110" fill="url(#counterFront)" stroke="#c2410c" stroke-width="4"/>
  <!-- Vertical Stripes on Counter Panel -->
  <g fill="#0284c7">
    <rect x="80" y="340" width="18" height="110"/>
    <rect x="180" y="340" width="18" height="110"/>
    <rect x="280" y="340" width="18" height="110"/>
    <rect x="380" y="340" width="18" height="110"/>
    <rect x="480" y="340" width="18" height="110"/>
    <rect x="580" y="340" width="18" height="110"/>
    <rect x="680" y="340" width="18" height="110"/>
    <rect x="780" y="340" width="18" height="110"/>
    <rect x="880" y="340" width="18" height="110"/>
    <rect x="980" y="340" width="18" height="110"/>
    <rect x="1080" y="340" width="18" height="110"/>
  </g>

  <!-- ================= CHECKERED FLOOR WITH PERSPECTIVE ================= -->
  <g id="floor">
    <polygon points="0,445 1200,445 1200,675 0,675" fill="#f0fdf4"/>
    
    <!-- Floor Pattern Tiles (Blue & White Checkerboard) -->
    <polygon points="40,445 180,445 120,530 0,530" fill="#7dd3fc"/>
    <polygon points="320,445 460,445 400,530 260,530" fill="#7dd3fc"/>
    <polygon points="600,445 740,445 680,530 540,530" fill="#7dd3fc"/>
    <polygon points="880,445 1020,445 960,530 820,530" fill="#7dd3fc"/>

    <polygon points="120,530 260,530 180,630 20,630" fill="#0284c7"/>
    <polygon points="400,530 540,530 460,630 300,630" fill="#0284c7"/>
    <polygon points="680,530 820,530 740,630 580,630" fill="#0284c7"/>
    <polygon points="960,530 1100,530 1020,630 860,630" fill="#0284c7"/>

    <polygon points="180,630 340,630 240,675 60,675" fill="#7dd3fc"/>
    <polygon points="500,630 660,630 560,675 380,675" fill="#7dd3fc"/>
    <polygon points="820,630 980,630 880,675 700,675" fill="#7dd3fc"/>
  </g>

  <!-- ================= CUSTOMERS AT THE COUNTER ================= -->

  <!-- 1. MOTHER & CHILD (Left) -->
  <g id="mother_and_child" filter="url(#shadow)">
    <!-- Mother Body (Pink Dress) -->
    <path d="M430 300 Q450 280 470 300 L495 440 L405 440 Z" fill="#ec4899" stroke="#be185d" stroke-width="3"/>
    <path d="M405 440 L495 440 L510 520 L390 520 Z" fill="#db2777" stroke="#9d174d" stroke-width="3"/>
    <!-- Legs/Shoes -->
    <rect x="420" y="520" width="16" height="35" fill="#fed7aa"/>
    <rect x="465" y="520" width="16" height="35" fill="#fed7aa"/>
    <ellipse cx="425" cy="558" rx="14" ry="7" fill="#4338ca"/>
    <ellipse cx="475" cy="558" rx="14" ry="7" fill="#4338ca"/>
    <!-- Arm extending to child -->
    <path d="M410 320 Q370 380 360 410" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
    <!-- Arm on counter -->
    <path d="M480 320 Q485 325 500 320" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="450" cy="255" r="24" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <!-- Curly Hair -->
    <path d="M425 245 Q445 220 475 245 Q485 275 470 310 Q450 315 425 285 Z" fill="#451a03"/>
    <!-- Face Profile -->
    <circle cx="440" cy="255" r="2.5" fill="#1e293b"/>
    <path d="M435 265 Q440 270 445 265" fill="none" stroke="#1e293b" stroke-width="2"/>

    <!-- Child (Boy in striped shirt & green shorts) -->
    <!-- Head & Cap -->
    <circle cx="320" cy="390" r="18" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <path d="M302 385 Q320 365 338 385 L350 388 L302 388 Z" fill="#15803d"/>
    <!-- Shirt (Orange/Red Striped) -->
    <rect x="300" y="408" width="40" height="50" rx="6" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <line x1="300" y1="422" x2="340" y2="422" stroke="#ea580c" stroke-width="3"/>
    <line x1="300" y1="436" x2="340" y2="436" stroke="#ea580c" stroke-width="3"/>
    <!-- Shorts (Olive Green) -->
    <rect x="302" y="458" width="36" height="42" fill="#65a30d" stroke="#3f6212" stroke-width="2"/>
    <!-- Legs & Shoes -->
    <rect x="306" y="500" width="10" height="24" fill="#fed7aa"/>
    <rect x="324" y="500" width="10" height="24" fill="#fed7aa"/>
    <ellipse cx="310" cy="526" rx="10" ry="5" fill="#15803d"/>
    <ellipse cx="330" cy="526" rx="10" ry="5" fill="#15803d"/>
  </g>

  <!-- 2. ELDERLY WOMAN (Middle) -->
  <g id="elderly_woman" filter="url(#shadow)">
    <!-- Shawl/Saree (Yellowish Green & Magenta) -->
    <path d="M560 380 Q590 350 610 380 L620 530 L550 530 Z" fill="#eab308" stroke="#a16207" stroke-width="3"/>
    <path d="M555 530 L615 530 L610 590 L560 590 Z" fill="#be185d" stroke="#831843" stroke-width="2"/>
    <!-- Head Covered with Shawl -->
    <path d="M570 330 Q590 305 610 330 Q615 370 590 375 Q565 370 570 330 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <!-- Face & Spectacles -->
    <circle cx="585" cy="345" r="14" fill="#fcd34d"/>
    <circle cx="580" cy="345" r="5" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="585" y1="345" x2="590" y2="345" stroke="#1e293b" stroke-width="2"/>
    <!-- Passbook in hand -->
    <rect x="560" y="415" width="25" height="18" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="564" y="427" font-size="8" fill="#ffffff" font-weight="bold">₹</text>
    <!-- Sandals -->
    <ellipse cx="572" cy="595" rx="12" ry="5" fill="#78350f"/>
    <ellipse cx="600" cy="595" rx="12" ry="5" fill="#78350f"/>
  </g>

  <!-- 3. BANK ASSISTANT / OFFICER IN BLUE SHIRT (Right) -->
  <g id="bank_assistant" filter="url(#shadow)">
    <!-- Body (Blue Shirt) -->
    <path d="M960 300 Q990 280 1020 300 L1035 440 L945 440 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
    <!-- Collar & ID Card -->
    <polygon points="980,300 990,320 985,300" fill="#ffffff"/>
    <polygon points="1000,300 990,320 995,300" fill="#ffffff"/>
    <rect x="980" y="325" width="20" height="15" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <!-- Register/Files held in hand -->
    <rect x="970" y="360" width="30" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <!-- Trousers (Dark Grey) -->
    <path d="M950 440 L1030 440 L1020 600 L955 600 Z" fill="#334155" stroke="#1e293b" stroke-width="3"/>
    <!-- Formal Shoes -->
    <ellipse cx="965" cy="610" rx="16" ry="8" fill="#0f172a"/>
    <ellipse cx="1010" cy="610" rx="16" ry="8" fill="#0f172a"/>
    <!-- Head & Hair -->
    <circle cx="990" cy="255" r="24" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <path d="M968 250 Q990 220 1012 250 Q1005 235 990 235 Q975 235 968 250 Z" fill="#451a03"/>
    <circle cx="982" cy="255" r="2.5" fill="#1e293b"/>
    <circle cx="998" cy="255" r="2.5" fill="#1e293b"/>
    <path d="M985 268 Q990 274 995 268" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- ================= FOREGROUND: SEATED WAITING CUSTOMERS ================= -->
  <g id="seated_customers" filter="url(#shadow)">
    <!-- Waiting Chair Row (Backrest) -->
    <path d="M380 620 Q600 600 820 620" stroke="#7c2d12" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- Customer 1 (Woman in Purple Top) -->
    <g transform="translate(420, 520)">
      <!-- Head / Bun Hair -->
      <circle cx="50" cy="40" r="26" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
      <ellipse cx="25" cy="45" rx="12" ry="16" fill="#451a03"/> <!-- Hair bun -->
      <path d="M35 30 Q50 15 65 30 Q60 25 50 25 Q40 25 35 30 Z" fill="#451a03"/>
      <!-- Red Earring -->
      <circle cx="48" cy="48" r="4" fill="#ef4444"/>
      <!-- Face profile -->
      <circle cx="62" cy="38" r="2.5" fill="#1e293b"/>
      <path d="M60 48 Q64 52 68 48" fill="none" stroke="#1e293b" stroke-width="2"/>
      <!-- Shoulders (Purple Dress) -->
      <path d="M10 70 Q50 55 90 70 L95 155 L5 155 Z" fill="#9333ea" stroke="#6b21a8" stroke-width="3"/>
    </g>

    <!-- Customer 2 (Man - Center Back View) -->
    <g transform="translate(560, 525)">
      <!-- Head / Back View Hair -->
      <circle cx="50" cy="35" r="26" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
      <ellipse cx="50" cy="32" rx="26" ry="24" fill="#451a03"/>
      <!-- Ears -->
      <circle cx="22" cy="36" r="6" fill="#fed7aa"/>
      <circle cx="78" cy="36" r="6" fill="#fed7aa"/>
      <!-- Shoulders (Maroon Shirt) -->
      <path d="M10 65 Q50 50 90 65 L95 150 L5 150 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3"/>
    </g>

    <!-- Customer 3 (Woman/Man - Right Profile) -->
    <g transform="translate(700, 520)">
      <!-- Head -->
      <circle cx="50" cy="40" r="26" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
      <!-- Short Hair -->
      <path d="M30 35 Q50 15 70 35 Q65 25 50 25 Q35 25 30 35 Z" fill="#78350f"/>
      <ellipse cx="65" cy="40" rx="10" ry="14" fill="#78350f"/>
      <!-- Profile Face -->
      <circle cx="38" cy="38" r="2.5" fill="#1e293b"/>
      <path d="M34 48 Q38 52 42 48" fill="none" stroke="#1e293b" stroke-width="2"/>
      <!-- Shoulders (Yellow Top) -->
      <path d="M10 70 Q50 55 90 70 L95 155 L5 155 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    </g>
  </g>

  <!-- BORDER FRAME -->
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#047857" stroke-width="8"/>
</svg>