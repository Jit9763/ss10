<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGrad5)"/>

  <!-- Master Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGrad5)" filter="url(#shadow5)" stroke="#38bdf8" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    🏛️ स्वामित्व के आधार पर क्षेत्रक (Public vs Private) एवं मनरेगा (MGNREGA 2005)
  </text>

  <!-- Left: Public vs Private Comparison -->
  <g transform="translate(45, 95)" filter="url(#shadow5)">
    <rect width="485" height="490" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect width="485" height="48" rx="18" fill="#0369a1"/>
    <rect y="30" width="485" height="18" fill="#0369a1"/>
    <text x="242" y="34" fill="#ffffff" font-size="19" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🏛️ 1. सार्वजनिक बनाम निजी क्षेत्रक</text>
    
    <!-- Public Sector -->
    <rect x="20" y="65" width="445" height="135" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="90" fill="#7dd3fc" font-size="15" font-weight="900" font-family="system-ui, sans-serif">🏢 सार्वजनिक क्षेत्रक (Public Sector - सरकार):</text>
    <text x="35" y="118" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>स्वामित्व:</b> अधिकांश परिसंपत्तियों पर सरकार का नियंत्रण।</text>
    <text x="35" y="142" fill="#34d399" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>मुख्य उद्देश्य:</b> केवल लाभ नहीं, बल्कि <b>जन-कल्याण (Social Welfare)</b>।</text>
    <text x="35" y="168" fill="#fde68a" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>उदाहरण:</b> भारतीय रेलवे (Railways), डाकघर, BHEL, SAIL, AIIMS।</text>
    <text x="35" y="190" fill="#cbd5e1" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• भारी बुनियादी ढांचे (सड़कें, बांध, बिजली) में सरकार ही निवेश कर सकती है।</text>

    <!-- Private Sector -->
    <rect x="20" y="215" width="445" height="135" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="35" y="240" fill="#cbd5e1" font-size="15" font-weight="900" font-family="system-ui, sans-serif">🏭 निजी क्षेत्रक (Private Sector - व्यक्तिगत):</text>
    <text x="35" y="268" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>स्वामित्व:</b> निजी व्यक्तियों या कंपनियों के हाथों में।</text>
    <text x="35" y="292" fill="#f87171" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>मुख्य उद्देश्य:</b> अधिकतम <b>लाभ कमाना (Profit Motive)</b>।</text>
    <text x="35" y="318" fill="#93c5fd" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>उदाहरण:</b> TATA (TISCO), Reliance Industries, Infosys।</text>
    <text x="35" y="340" fill="#94a3b8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• सेवाएं प्राप्त करने के लिए व्यक्ति को पूरी बाजार कीमत चुकानी पड़ती है।</text>

    <!-- Government Responsibility -->
    <rect x="20" y="365" width="445" height="105" rx="10" fill="#0369a1"/>
    <text x="242" y="392" fill="#e0f2fe" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">💡 सरकार की प्राथमिक जिम्मेदारियां:</text>
    <text x="35" y="420" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सभी नागरिकों को गुणवत्तापूर्ण प्राथमिक शिक्षा व स्वास्थ्य।</text>
    <text x="35" y="445" fill="#fef08a" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• गरीबों को सस्ते मूल्य पर अनाज व पीने का स्वच्छ पानी उपलब्ध कराना।</text>
  </g>

  <!-- Right: MGNREGA 2005 -->
  <g transform="translate(570, 95)" filter="url(#shadow5)">
    <rect width="485" height="490" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="485" height="48" rx="18" fill="#065f46"/>
    <rect y="30" width="485" height="18" fill="#065f46"/>
    <text x="242" y="34" fill="#ffffff" font-size="19" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">📜 2. मनरेगा (MGNREGA 2005) - काम का अधिकार</text>
    
    <rect x="20" y="65" width="445" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="88" fill="#6ee7b7" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🎯 पूरा नाम एवं विस्तार:</text>
    <text x="35" y="112" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• <b>महात्मा गांधी राष्ट्रीय ग्रामीण रोजगार गारंटी अधिनियम, 2005</b></text>
    <text x="35" y="128" fill="#a7f3d0" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• भारत के सभी ग्रामीण जिलों में लागू (काम का कानूनी अधिकार)।</text>

    <rect x="20" y="145" width="445" height="70" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="35" y="168" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📅 100 दिन के सुनिश्चित रोजगार की गारंटी:</text>
    <text x="35" y="192" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">ग्रामीण क्षेत्रों में प्रत्येक परिवार के अकुशल वयस्क को 1 वर्ष में 100 दिन का काम।</text>

    <rect x="20" y="225" width="445" height="70" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="35" y="248" fill="#fde68a" font-size="14" font-weight="900" font-family="system-ui, sans-serif">💵 बेरोजगारी भत्ता (Unemployment Allowance):</text>
    <text x="35" y="272" fill="#fed7aa" font-size="13" font-weight="900" font-family="system-ui, sans-serif">यदि सरकार आवेदन के 15 दिनों में काम देने में असमर्थ रहे, तो भत्ता अनिवार्य।</text>

    <rect x="20" y="305" width="445" height="70" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="35" y="328" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🌱 भूमि व जल संरक्षण कार्यों को प्राथमिकता:</text>
    <text x="35" y="352" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">तालाब खुदाई, मेड़बंदी, वृक्षारोपण व जल संचयन कार्य जिससे भविष्य में फसल बढ़े।</text>

    <rect x="20" y="385" width="445" height="85" rx="10" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="35" y="412" fill="#d1fae5" font-size="14" font-weight="900" font-family="system-ui, sans-serif">👩 1/3 पद महिलाओं के लिए आरक्षित:</text>
    <text x="35" y="438" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">समान कार्य के लिए समान मजदूरी, सीधे बैंक/डाकघर खाते में भुगतान।</text>
    <text x="35" y="458" fill="#fef08a" font-size="13" font-weight="900" font-family="system-ui, sans-serif">ग्रामीण पलायन रोकने में ऐतिहासिक सफलता।</text>
  </g>

  <!-- Bottom Core Takeaway Badge -->
  <rect x="40" y="600" width="1020" height="36" rx="8" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="624" fill="#ffffff" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    📌 निष्कर्ष: सार्वजनिक क्षेत्रक सामाजिक न्याय व आधारभूत सेवाएं देता है, जबकि मनरेगा ग्रामीण निर्धनों को आजीविका सुरक्षा प्रदान करता है।
  </text>
</svg>