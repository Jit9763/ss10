<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="planBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#planBg)"/>

  <rect x="50" y="25" width="1100" height="75" rx="15" fill="#3b82f6" stroke="#93c5fd" stroke-width="4"/>
  <text x="600" y="72" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">भारत में संसाधन नियोजन के 3 मुख्य सोपान (3 Stages of Resource Planning)</text>

  <!-- Stage 1 -->
  <rect x="70" y="140" width="320" height="480" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="4"/>
  <circle cx="230" cy="200" r="40" fill="#3b82f6"/>
  <text x="230" y="212" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  <text x="230" y="275" font-family="'Segoe UI', Devanagari, sans-serif" font-size="22" font-weight="900" fill="#93c5fd" text-anchor="middle">संसाधनों की पहचान &amp; तालिका</text>
  <text x="230" y="305" font-family="'Segoe UI', Devanagari, sans-serif" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="middle">(Identification &amp; Inventory)</text>
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-size="18" font-weight="900" fill="#ffffff">
    <text x="90" y="360">• देश के विभिन्न प्रदेशों में</text>
    <text x="90" y="390">  संसाधनों की पहचान।</text>
    <text x="90" y="430">• सर्वेक्षण (Surveying)।</text>
    <text x="90" y="460">• मानचित्र बनाना (Mapping)।</text>
    <text x="90" y="490">• संसाधनों का गुणात्मक एवं</text>
    <text x="90" y="520">  मात्रात्मक अनुमान।</text>
  </g>

  <!-- Stage 2 -->
  <rect x="440" y="140" width="320" height="480" rx="16" fill="#065f46" stroke="#34d399" stroke-width="4"/>
  <circle cx="600" cy="200" r="40" fill="#10b981"/>
  <text x="600" y="212" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
  <text x="600" y="275" font-family="'Segoe UI', Devanagari, sans-serif" font-size="22" font-weight="900" fill="#a7f3d0" text-anchor="middle">नियोजन ढांचा तैयार करना</text>
  <text x="600" y="305" font-family="'Segoe UI', Devanagari, sans-serif" font-size="20" font-weight="900" fill="#34d399" text-anchor="middle">(Planning Structure)</text>
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-size="18" font-weight="900" fill="#ffffff">
    <text x="460" y="360">• उपयुक्त प्रौद्योगिकी (Tech),</text>
    <text x="460" y="390">  कौशल और संस्थागत ढांचा।</text>
    <text x="460" y="430">• संसाधन विकास योजनाएं</text>
    <text x="460" y="460">  लागू करने की योग्यता।</text>
    <text x="460" y="500">• खनन व प्रसंस्करण इकाइयां</text>
    <text x="460" y="530">  स्थापित करना।</text>
  </g>

  <!-- Stage 3 -->
  <rect x="810" y="140" width="320" height="480" rx="16" fill="#78350f" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="970" cy="200" r="40" fill="#d97706"/>
  <text x="970" y="212" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
  <text x="970" y="275" font-family="'Segoe UI', Devanagari, sans-serif" font-size="22" font-weight="900" fill="#fde68a" text-anchor="middle">राष्ट्रीय विकास से मिलान</text>
  <text x="970" y="305" font-family="'Segoe UI', Devanagari, sans-serif" font-size="20" font-weight="900" fill="#fbbf24" text-anchor="middle">(Matching with National Plan)</text>
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-size="18" font-weight="900" fill="#ffffff">
    <text x="830" y="360">• संसाधन विकास योजनाओं</text>
    <text x="830" y="390">  और राष्ट्रीय विकास योजना</text>
    <text x="830" y="420">  में समन्वय (Coordination)।</text>
    <text x="830" y="460">• स्वतंत्रता के बाद प्रथम</text>
    <text x="830" y="490">  पंचवर्षीय योजना से ही</text>
    <text x="830" y="520">  प्रयास जारी।</text>
  </g>
</svg>
