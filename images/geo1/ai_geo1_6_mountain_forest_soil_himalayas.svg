<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyHim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#skyHim)"/>

  <rect x="50" y="25" width="1100" height="70" rx="15" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
  <text x="600" y="70" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">वनीय एवं पर्वतीय मृदा (Forest &amp; Mountain Soil - Himalayas)</text>

  <!-- Snowy Himalayas -->
  <polygon points="100,380 300,180 500,380" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="400,380 650,150 900,380" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="800,380 980,220 1150,380" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>

  <!-- Pine Forest Slopes -->
  <path d="M 0 380 Q 400 320 800 370 T 1200 350 L 1200 675 L 0 675 Z" fill="#0f766e"/>

  <!-- Info Cards -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="80" y="120" width="480" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
    <text x="100" y="155" font-size="24" fill="#166534">📌 पर्वतीय मृदा की विशेषताएं:</text>
    <text x="100" y="190" font-size="20" fill="#14532d">• नदी घाटियों में दोमट और सिल्टदार (Loamy &amp; Silty)।</text>
    <text x="100" y="220" font-size="20" fill="#14532d">• ऊपरी ढालों पर मोटे कणों का गठन (Coarse-grained)।</text>
    <text x="100" y="250" font-size="20" fill="#14532d">• हिमछादित क्षेत्रों में अम्लीय तथा ह्यूमस रहित।</text>

    <rect x="640" y="120" width="480" height="170" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="4"/>
    <text x="660" y="155" font-size="24" fill="#1e40af">🏔️ भौगोलिक विस्तार एवं कृषि:</text>
    <text x="660" y="190" font-size="20" fill="#1e3a8a">• क्षेत्र: जम्मू-कश्मीर, हिमाचल, उत्तराखंड, सिक्किम।</text>
    <text x="660" y="220" font-size="20" fill="#1e3a8a">• बागवानी: सेब, नाशपाती, अक्रोट व मसाले।</text>
    <text x="660" y="250" font-size="20" fill="#1e3a8a">• सोपानी कृषि (Terrace Farming) द्वारा मृदा संरक्षण।</text>
  </g>
</svg>
