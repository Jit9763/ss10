<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Title Banner -->
  <rect x="50" y="25" width="1100" height="70" rx="15" fill="#991b1b" stroke="#f87171" stroke-width="4"/>
  <text x="600" y="70" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">लेटेराइट मृदा एवं चाय/कॉफी के बागान (Laterite Soil &amp; Tea Plantations)</text>

  <!-- Terraced Hills -->
  <path d="M 0 350 Q 300 280 600 350 T 1200 320 L 1200 675 L 0 675 Z" fill="url(#hillGrad)"/>
  
  <!-- Terraced Steps -->
  <path d="M 50 380 L 1150 380 L 1150 420 L 50 420 Z" fill="#16a34a" stroke="#15803d" stroke-width="3"/>
  <rect x="50" y="420" width="1100" height="25" fill="url(#soilGrad)"/>
  
  <path d="M 80 470 L 1120 470 L 1120 510 L 80 510 Z" fill="#22c55e" stroke="#16a34a" stroke-width="3"/>
  <rect x="80" y="510" width="1040" height="30" fill="url(#soilGrad)"/>

  <rect x="0" y="560" width="1200" height="115" fill="url(#soilGrad)"/>

  <!-- Tea Bushes -->
  <g fill="#15803d" stroke="#052e16" stroke-width="2">
    <!-- Row 1 -->
    <circle cx="150" cy="370" r="22"/> <circle cx="220" cy="370" r="22"/> <circle cx="290" cy="370" r="22"/>
    <circle cx="360" cy="370" r="22"/> <circle cx="430" cy="370" r="22"/> <circle cx="500" cy="370" r="22"/>
    <circle cx="570" cy="370" r="22"/> <circle cx="640" cy="370" r="22"/> <circle cx="710" cy="370" r="22"/>
    <circle cx="780" cy="370" r="22"/> <circle cx="850" cy="370" r="22"/> <circle cx="920" cy="370" r="22"/>
    <circle cx="990" cy="370" r="22"/> <circle cx="1060" cy="370" r="22"/>

    <!-- Row 2 -->
    <circle cx="180" cy="460" r="25"/> <circle cx="260" cy="460" r="25"/> <circle cx="340" cy="460" r="25"/>
    <circle cx="420" cy="460" r="25"/> <circle cx="500" cy="460" r="25"/> <circle cx="580" cy="460" r="25"/>
    <circle cx="660" cy="460" r="25"/> <circle cx="740" cy="460" r="25"/> <circle cx="820" cy="460" r="25"/>
    <circle cx="900" cy="460" r="25"/> <circle cx="980" cy="460" r="25"/> <circle cx="1060" cy="460" r="25"/>
  </g>

  <!-- Labels & Info Boxes -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Info Box 1 -->
    <rect x="80" y="130" width="480" height="150" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="4"/>
    <text x="100" y="165" font-size="24" fill="#991b1b">📌 लेटेराइट शब्दोत्पत्ति एवं विशेषताएं:</text>
    <text x="100" y="200" font-size="20" fill="#7f1d1d">• शब्द ग्रीक भाषा के 'Later' (ईंट) से बना है।</text>
    <text x="100" y="230" font-size="20" fill="#7f1d1d">• भारी वर्षा से तीव्र निक्षालन (Leaching) का परिणाम।</text>
    <text x="100" y="260" font-size="20" fill="#7f1d1d">• उच्च अम्लीयता एवं ह्यूमस की कमी।</text>

    <!-- Info Box 2 -->
    <rect x="640" y="130" width="480" height="150" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="4"/>
    <text x="660" y="165" font-size="24" fill="#166534">☕ उपयुक्त फसलें एवं मुख्य क्षेत्र:</text>
    <text x="660" y="200" font-size="20" fill="#14532d">• फसलें: चाय, कॉफी, काजू (तामिलनाडु/केरल)।</text>
    <text x="660" y="230" font-size="20" fill="#14532d">• क्षेत्र: कर्नाटक, केरल, तमिलनाडु, ओडिशा, असम।</text>
    <text x="660" y="260" font-size="20" fill="#14532d">• खाद व उर्वरक से अत्यधिक उपजाऊ बनाई जा सकती है।</text>
  </g>
</svg>
