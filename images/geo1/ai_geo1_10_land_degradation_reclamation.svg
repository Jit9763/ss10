<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>

  <rect x="50" y="20" width="1100" height="70" rx="15" fill="#dc2626" stroke="#f87171" stroke-width="4"/>
  <text x="600" y="65" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">भू-निम्नीकरण के कारण एवं संरक्षण के उपाय (Land Degradation vs Conservation)</text>

  <!-- Left Side: Causes -->
  <rect x="60" y="115" width="520" height="530" rx="16" fill="#7f1d1d" stroke="#ef4444" stroke-width="4"/>
  <text x="320" y="160" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#fca5a5" text-anchor="middle">⚠️ भू-निम्नीकरण के मुख्य कारण (Causes):</text>
  
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
    <text x="85" y="210">1. खनन (Mining): खुला खनन, झारखण्ड, ओडिशा,</text>
    <text x="85" y="240">   मध्य प्रदेश, छत्तीसगढ़ में भूमि विनाश।</text>
    <text x="85" y="290">2. अति पशुचारण (Overgrazing): गुजरात, राजस्थान,</text>
    <text x="85" y="320">   महाराष्ट्र व मध्य प्रदेश में मुख्य कारण।</text>
    <text x="85" y="370">3. अति सिंचाई (Over-Irrigation): पंजाब, हरियाणा,</text>
    <text x="85" y="400">   प. उत्तर प्रदेश में जलाक्रांतता (Waterlogging)।</text>
    <text x="85" y="450">4. औद्योगिक अपशिष्ट &amp; धूल: सीमेंट उद्योग द्वारा</text>
    <text x="85" y="480">   चूना पत्थर पीसने से वायुमंडल में धूल।</text>
    <text x="85" y="530">5. वनों की कटाई (Deforestation) व नगरीकरण।</text>
  </g>

  <!-- Right Side: Conservation -->
  <rect x="620" y="115" width="520" height="530" rx="16" fill="#065f46" stroke="#34d399" stroke-width="4"/>
  <text x="880" y="160" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#a7f3d0" text-anchor="middle">🛡️ संरक्षण एवं सुधार के उपाय (Conservation):</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
    <text x="645" y="210">1. वनारोपण (Afforestation): नए वृक्ष लगाना</text>
    <text x="645" y="240">   तथा वनों का वैज्ञानिक प्रबंधन।</text>
    <text x="645" y="290">2. चरागाहों का उचित प्रबंधन &amp; अति पशुचारण नियंत्रण।</text>
    <text x="645" y="340">3. रक्षक मेखला (Shelter Belts): मरुस्थलीय क्षेत्रों में</text>
    <text x="645" y="370">   पौधों की कतारें लगाकर रेत के टीलों का स्थिरीकरण।</text>
    <text x="645" y="420">4. खनन गतिविधियों पर कड़ा नियंत्रण।</text>
    <text x="645" y="470">5. औद्योगिक जल का विसर्जन से पूर्व शोधन (Treatment</text>
    <text x="645" y="500">   of Industrial Effluents before release)।</text>
    <text x="645" y="550">6. टपकन व फव्वारा सिंचाई (Drip &amp; Sprinkler).</text>
  </g>
</svg>
