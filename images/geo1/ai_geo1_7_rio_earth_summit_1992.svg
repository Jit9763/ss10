<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEarth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgEarth)"/>

  <!-- Main Banner -->
  <rect x="50" y="25" width="1100" height="75" rx="15" fill="#047857" stroke="#34d399" stroke-width="4"/>
  <text x="600" y="72" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">रियो डी जेनेरो पृथ्वी सम्मेलन 1992 एवं एजेंडा 21 (Rio Earth Summit 1992 &amp; Agenda 21)</text>

  <!-- Globe Illustration -->
  <circle cx="600" cy="400" r="180" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
  <path d="M 450 400 Q 550 320 750 400 T 450 400 Z" fill="#16a34a"/>
  <path d="M 470 450 Q 600 550 730 450 T 470 450 Z" fill="#22c55e"/>

  <!-- Info Cards -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Left Box -->
    <rect x="60" y="130" width="380" height="500" rx="16" fill="#065f46" stroke="#10b981" stroke-width="4"/>
    <text x="80" y="175" font-size="24" fill="#a7f3d0">🌍 प्रथम अंतरराष्ट्रीय पृथ्वी सम्मेलन:</text>
    <text x="80" y="215" font-size="19" fill="#ffffff">• समय: जून 1992 (रियो डी जेनेरो, ब्राजील)।</text>
    <text x="80" y="250" font-size="19" fill="#ffffff">• प्रतिभागी: 100 से अधिक देशों के राष्ट्राध्यक्ष।</text>
    <text x="80" y="285" font-size="19" fill="#ffffff">• उद्देश्य: भूमंडलीय पर्यावरण संरक्षण एवं</text>
    <text x="80" y="315" font-size="19" fill="#ffffff">  सामाजिक-आर्थिक विकास की समस्याओं का हल।</text>
    <text x="80" y="355" font-size="19" fill="#a7f3d0">• घोषणा पत्र: भूमंडलीय जलवायु परिवर्तन और</text>
    <text x="80" y="385" font-size="19" fill="#ffffff">  जैविक विविधता पर सहमति पत्र।</text>
    <text x="80" y="425" font-size="19" fill="#a7f3d0">• वन सिद्धांतों (Forest Principles) पर सहमति।</text>

    <!-- Right Box -->
    <rect x="760" y="130" width="380" height="500" rx="16" fill="#065f46" stroke="#10b981" stroke-width="4"/>
    <text x="780" y="175" font-size="24" fill="#a7f3d0">📜 एजेंडा 21 (Agenda 21):</text>
    <text x="780" y="215" font-size="19" fill="#ffffff">• यह एक कार्यसूची (Action Plan) है।</text>
    <text x="780" y="250" font-size="19" fill="#ffffff">• लक्ष्य: 21वीं सदी में सतत पोषणीय विकास</text>
    <text x="780" y="280" font-size="19" fill="#ffffff">  (Sustainable Development) हासिल करना।</text>
    <text x="780" y="320" font-size="19" fill="#ffffff">• समान हितों, पारस्परिक आवश्यकताओं एवं</text>
    <text x="780" y="350" font-size="19" fill="#ffffff">  साझा जिम्मेदारियों द्वारा वैश्विक सहयोग।</text>
    <text x="780" y="390" font-size="19" fill="#fbbf24">• मुख्य उद्देश्य: प्रत्येक स्थानीय निकाय अपना</text>
    <text x="780" y="420" font-size="19" fill="#fbbf24">  स्थानीय 'एजेंडा 21' तैयार करे।</text>
  </g>
</svg>
