<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyDesert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="sandDune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#skyDesert)"/>

  <rect x="50" y="25" width="1100" height="70" rx="15" fill="#b45309" stroke="#f59e0b" stroke-width="4"/>
  <text x="600" y="70" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">शुष्क एवं मरुस्थलीय मृदा (Arid &amp; Desert Soil - Rajasthan)</text>

  <!-- Sand Dunes -->
  <path d="M 0 350 Q 350 250 700 380 T 1200 320 L 1200 675 L 0 675 Z" fill="url(#sandDune)"/>
  <path d="M 0 450 Q 400 380 800 480 T 1200 420 L 1200 675 L 0 675 Z" fill="#b45309"/>

  <!-- Thorny Bushes / Khejri -->
  <g fill="#15803d" stroke="#78350f" stroke-width="3">
    <path d="M 150 480 Q 140 430 160 410 Q 180 430 170 480 Z"/>
    <path d="M 450 460 Q 430 390 460 370 Q 490 390 470 460 Z"/>
    <path d="M 900 450 Q 880 380 910 360 Q 940 380 920 450 Z"/>
  </g>

  <!-- Info Cards -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="80" y="120" width="480" height="180" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/>
    <text x="100" y="155" font-size="24" fill="#78350f">📌 मुख्य विशेषताएं (Characteristics):</text>
    <text x="100" y="190" font-size="20" fill="#92400e">• रंग लाल से भूरा, बलुई व लवणीय (Sandy &amp; Saline)।</text>
    <text x="100" y="220" font-size="20" fill="#92400e">• उच्च तापमान से वाष्पीकरण तीव्र।</text>
    <text x="100" y="250" font-size="20" fill="#92400e">• ह्यूमस और नमी की अत्यधिक कमी।</text>
    <text x="100" y="280" font-size="20" fill="#92400e">• निचली संस्तर में 'कंकर' की परत (कैल्शियम वृद्धि)।</text>

    <rect x="640" y="120" width="480" height="180" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
    <text x="660" y="155" font-size="24" fill="#065f46">🌾 सिंचाई से कृषि उपयोग (Agricultural Potential):</text>
    <text x="660" y="190" font-size="20" fill="#047857">• इंदिरा गांधी नहर (Indira Gandhi Canal) से बदलाव।</text>
    <text x="660" y="220" font-size="20" fill="#047857">• पर्याप्त सिंचाई के बाद बाजरा, चना, सरसों खेती।</text>
    <text x="660" y="250" font-size="20" fill="#047857">• क्षेत्र: पश्चिमी राजस्थान (जैसलमेर, बाड़मेर)।</text>
    <text x="660" y="280" font-size="20" fill="#047857">• मृदा जल धारण क्षमता बढ़ाने हेतु रक्षक मेखला आवश्यक।</text>
  </g>
</svg>
