<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="stripSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#stripSky)"/>

  <rect x="50" y="20" width="1100" height="70" rx="15" fill="#1e40af" stroke="#60a5fa" stroke-width="4"/>
  <text x="600" y="65" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">पट्टी कृषि एवं रक्षक मेखला (Strip Cropping &amp; Windbreaks)</text>

  <!-- Alternating Field Strips -->
  <polygon points="50,220 1150,220 1150,300 50,300" fill="#15803d" stroke="#166534" stroke-width="3"/>
  <text x="600" y="265" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">घास की पट्टी (Grass Strip) - पवन वेग को कम करना</text>

  <polygon points="50,320 1150,320 1150,400 50,400" fill="#d97706" stroke="#b45309" stroke-width="3"/>
  <text x="600" y="365" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">मुख्य फसल पट्टी (Crop Strip - Wheat / Corn)</text>

  <polygon points="50,420 1150,420 1150,500 50,500" fill="#15803d" stroke="#166534" stroke-width="3"/>
  <text x="600" y="465" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">घास की पट्टी (Grass Strip) - मृदा कणों का संरक्षण</text>

  <!-- Info Text -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="80" y="530" width="1040" height="120" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="4"/>
    <text x="100" y="570" font-size="22" fill="#166534">💡 पट्टी कृषि (Strip Cropping) का सिद्धांत:</text>
    <text x="100" y="605" font-size="20" fill="#14532d">• बड़े खेतों को पट्टियों (Strips) में बांटा जाता है। फसलों के बीच में घास की पट्टियां उगाई जाती हैं।</text>
    <text x="100" y="635" font-size="20" fill="#14532d">• यह घास की पट्टियां हवा द्वारा जनित बल को तोड़ती हैं (Breaks force of wind), जिससे पवन अपरदन रुकता है।</text>
  </g>
</svg>
