<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="darkRoom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="anthraciteGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ligniteBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="80%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#291102"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#darkRoom)"/>
  
  <polygon points="0,380 960,380 960,540 0,540" fill="#0f172a"/>

  <!-- Left: Glossy Black Hard Anthracite Coal Chunk -->
  <g transform="translate(140, 160)" fill="url(#anthraciteGloss)" stroke="#64748b" stroke-width="2">
    <polygon points="80,40 180,-10 260,60 220,190 60,180"/>
    <polygon points="80,40 150,110 220,190 60,180" fill="#09090b"/>
    <polygon points="180,-10 260,60 210,120 150,110" fill="#334155" opacity="0.6"/>
    <!-- Glossy Highlights -->
    <line x1="90" y1="45" x2="170" y2="5" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <line x1="160" y1="110" x2="250" y2="65" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Right: Crumbly Earthy Brown Lignite Coal Chunk -->
  <g transform="translate(560, 170)" fill="url(#ligniteBrown)" stroke="#291102" stroke-width="2">
    <polygon points="60,60 160,10 250,70 210,200 40,190"/>
    <polygon points="60,60 130,120 210,200 40,190" fill="#451a03"/>
    <polygon points="160,10 250,70 190,130 130,120" fill="#78350f"/>
    <!-- Porous Matt Texture -->
    <circle cx="110" cy="80" r="6" fill="#291102"/>
    <circle cx="160" cy="150" r="8" fill="#291102"/>
    <circle cx="180" cy="80" r="7" fill="#291102"/>
  </g>
</svg>