<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="desertMineSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="malachiteOre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#desertMineSky)"/>

  <!-- Aravalli Hills & Deep Pit Mine -->
  <polygon points="0,210 280,140 560,220 840,130 960,190 960,540 0,540" fill="#a16207"/>
  <polygon points="0,280 340,240 700,290 960,250 960,540 0,540" fill="#78350f"/>
  <polygon points="0,370 420,330 820,380 960,340 960,540 0,540" fill="#451a03"/>

  <!-- Headframe Mine Shaft Tower -->
  <g transform="translate(740, 110)" fill="none" stroke="#1f2937" stroke-width="4">
    <line x1="40" y1="120" x2="70" y2="0"/>
    <line x1="100" y1="120" x2="70" y2="0"/>
    <line x1="48" y1="90" x2="92" y2="90"/>
    <line x1="56" y1="60" x2="84" y2="60"/>
    <circle cx="70" cy="10" r="18" fill="#475569"/>
  </g>

  <!-- Greenish-Blue Malachite & Copper Chalcopyrite Specimen -->
  <g fill="url(#malachiteOre)" stroke="#0f766e" stroke-width="2">
    <polygon points="140,380 240,330 320,390 280,480 160,470"/>
    <polygon points="280,400 370,350 440,410 400,490 310,480"/>
    <polygon points="60,440 140,410 180,480 110,510 50,490"/>
  </g>
</svg>