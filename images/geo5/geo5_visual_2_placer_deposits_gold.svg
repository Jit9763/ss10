<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="skyStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldSpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#skyStream)"/>

  <!-- Distant Himalayan Mountains -->
  <polygon points="0,220 220,110 460,240 700,90 960,210 960,340 0,340" fill="#475569"/>
  <polygon points="180,110 220,110 260,150 200,160" fill="#ffffff"/>
  <polygon points="670,90 700,90 740,140 680,150" fill="#ffffff"/>

  <!-- Pine Forests & River Bank -->
  <path d="M0,280 Q300,260 600,290 T960,270 L960,540 L0,540 Z" fill="#1e293b"/>
  <path d="M0,320 Q480,280 960,330 L960,540 L0,540 Z" fill="#78350f"/>

  <!-- Rushing Mountain River -->
  <path d="M0,360 Q320,310 640,370 T960,340 L960,490 Q600,440 300,500 L0,480 Z" fill="url(#waterFlow)"/>

  <!-- Riverbed Gravel & Placer Gold Pan in Foreground -->
  <!-- Pan -->
  <ellipse cx="480" cy="450" rx="220" ry="80" fill="#334155" stroke="#64748b" stroke-width="8"/>
  <ellipse cx="480" cy="450" rx="195" ry="68" fill="#1e293b"/>
  <ellipse cx="480" cy="455" rx="170" ry="55" fill="#0f172a"/>

  <!-- River Black Sand Sediments & Golden Nuggets -->
  <ellipse cx="480" cy="455" rx="140" ry="42" fill="#020617"/>
  <!-- Gold Nuggets and Grains -->
  <g fill="url(#goldSpec)" stroke="#ca8a04" stroke-width="1">
    <circle cx="450" cy="445" r="10"/>
    <circle cx="475" cy="460" r="14"/>
    <circle cx="510" cy="440" r="12"/>
    <circle cx="430" cy="465" r="8"/>
    <circle cx="530" cy="460" r="9"/>
    <circle cx="490" cy="470" r="11"/>
    <circle cx="410" cy="450" r="6"/>
    <circle cx="550" cy="448" r="7"/>
    <polygon points="465,430 475,438 468,445 458,438"/>
    <polygon points="500,465 512,475 504,482 494,472"/>
  </g>
</svg>