<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="plSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="gasPipeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#plSky)"/>

  <!-- Countryside Soil Trench -->
  <polygon points="0,290 960,290 960,540 0,540" fill="#78350f"/>
  
  <!-- Excavated Pipeline Trench -->
  <polygon points="0,420 960,370 960,490 0,540" fill="#451a03"/>

  <!-- Heavy Side-boom Pipesaver Pipelayer Cranes -->
  <g transform="translate(420, 210)" fill="#facc15" stroke="#1e293b" stroke-width="3">
    <rect x="0" y="50" width="90" height="40" rx="6"/>
    <rect x="-10" y="85" width="110" height="20" rx="8" fill="#334155"/>
    <!-- Sideboom Crane Boom -->
    <line x1="20" y1="50" x2="-80" y2="-40" stroke="#facc15" stroke-width="12"/>
    <line x1="-80" y1="-40" x2="-80" y2="180" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Giant High-Pressure Yellow Coated Steel Gas Pipeline -->
  <path d="M0,490 L340,440 L680,390 L960,340" fill="none" stroke="url(#gasPipeYellow)" stroke-width="40"/>
  <path d="M0,480 L340,430 L680,380 L960,330" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
  <path d="M0,490 L340,440 L680,390 L960,340" fill="none" stroke="#713f12" stroke-width="2"/>
</svg>