<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="dustySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="hematiteRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="80%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#dustySky)"/>

  <!-- Stepped Open Cast Mine Benches -->
  <polygon points="0,240 320,180 680,220 960,170 960,540 0,540" fill="#7f1d1d"/>
  <polygon points="0,310 420,270 780,320 960,280 960,540 0,540" fill="#991b1b"/>
  <polygon points="0,390 360,350 720,410 960,360 960,540 0,540" fill="#b91c1c"/>
  <polygon points="0,470 480,440 960,460 960,540 0,540" fill="#450a0a"/>

  <!-- Heavy Mining Excavator Silhouette -->
  <g transform="translate(680, 240) scale(0.65)" fill="#facc15" stroke="#1f2937" stroke-width="3">
    <rect x="0" y="40" width="100" height="50" rx="8"/>
    <rect x="15" y="10" width="45" height="35" fill="#38bdf8"/>
    <!-- Tracks -->
    <rect x="-10" y="85" width="120" height="25" rx="10" fill="#374151"/>
    <!-- Boom Arm -->
    <polygon points="80,45 160,-20 180,-10 95,55" fill="#facc15"/>
    <polygon points="160,-20 220,40 210,50 155,-10" fill="#facc15"/>
    <!-- Bucket -->
    <polygon points="210,40 250,60 230,85 195,65" fill="#4b5563"/>
  </g>

  <!-- Rich Metallic Hematite Ore Boulders in Foreground -->
  <g fill="url(#hematiteRock)" stroke="#450a0a" stroke-width="2">
    <polygon points="120,430 220,380 280,440 240,510 140,520"/>
    <polygon points="120,430 180,430 240,510 140,520" fill="#450a0a" opacity="0.6"/>
    <polygon points="260,460 340,410 410,470 370,530 290,520"/>
    <polygon points="40,480 110,460 140,510 80,540"/>
  </g>
</svg>