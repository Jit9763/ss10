<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="micaDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="micaSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f8fafc" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#micaDesk)"/>

  <!-- Pegmatite Rock Host Matrix -->
  <polygon points="80,180 340,90 480,210 390,440 120,400" fill="#334155" stroke="#475569" stroke-width="4"/>

  <!-- Peeling Layered Thin Muscovite Mica Sheets -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <!-- Bottom Layer -->
    <polygon points="320,160 680,110 820,310 460,360" fill="url(#micaSheet)"/>
    
    <!-- Mid Peeling Layer -->
    <polygon points="300,190 660,140 780,330 420,380" fill="url(#micaSheet)" opacity="0.85"/>
    
    <!-- Top Flexible Sheet -->
    <polygon points="270,230 620,170 730,360 380,420" fill="url(#micaSheet)" opacity="0.9"/>

    <!-- Shiny Iridescent Reflection Lines -->
    <line x1="380" y1="210" x2="690" y2="160" stroke="#ffffff" stroke-width="3"/>
    <line x1="420" y1="260" x2="710" y2="210" stroke="#ffffff" stroke-width="2"/>
    <line x1="460" y1="310" x2="730" y2="270" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>