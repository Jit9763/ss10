<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="himalayaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="hotWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#himalayaSky)"/>

  <!-- High Snow-Capped Himalayan Peaks of Parvati Valley -->
  <polygon points="0,220 220,90 480,240 720,70 960,200 960,380 0,380" fill="#475569"/>
  <polygon points="180,90 220,90 260,140 190,145" fill="#ffffff"/>
  <polygon points="680,70 720,70 760,130 690,135" fill="#ffffff"/>

  <!-- Rugged Valley Rock Cliffs -->
  <polygon points="0,320 340,270 680,330 960,290 960,540 0,540" fill="#334155"/>
  <polygon points="0,400 480,360 960,410 960,540 0,540" fill="#1e293b"/>

  <!-- Geothermal Hot Boiling Pool -->
  <ellipse cx="480" cy="460" rx="340" ry="65" fill="url(#hotWater)" stroke="#f8fafc" stroke-width="4"/>

  <!-- Rising Geothermal Steam Plumes -->
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="380" cy="380" rx="60" ry="30"/>
    <ellipse cx="400" cy="320" rx="90" ry="40"/>
    <ellipse cx="430" cy="250" rx="120" ry="50"/>
    
    <ellipse cx="580" cy="380" rx="60" ry="30"/>
    <ellipse cx="560" cy="310" rx="90" ry="40"/>
    <ellipse cx="530" cy="240" rx="130" ry="55"/>
  </g>
</svg>