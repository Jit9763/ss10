<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="seaSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#c2410c"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="seaWaves" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#seaSunset)"/>

  <!-- Arabian Sea Surface -->
  <rect x="0" y="360" width="960" height="180" fill="url(#seaWaves)"/>

  <!-- Massive Offshore Jack-up Drilling Rig ('Sagar Samrat') -->
  <!-- 3 Giant Steel Lattice Legs in Water -->
  <g fill="none" stroke="#e2e8f0" stroke-width="4">
    <line x1="340" y1="240" x2="340" y2="440"/>
    <line x1="360" y1="240" x2="360" y2="440"/>
    <line x1="600" y1="240" x2="600" y2="440"/>
    <line x1="620" y1="240" x2="620" y2="440"/>
  </g>

  <!-- Rig Main Platform Deck Hull -->
  <polygon points="280,240 680,240 650,290 310,290" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <rect x="340" y="190" width="160" height="50" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

  <!-- Helipad -->
  <polygon points="260,200 340,200 320,240 240,240" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="290" cy="220" r="14" fill="none" stroke="#facc15" stroke-width="3"/>

  <!-- Drilling Derrick Tower -->
  <g transform="translate(480, 50)" fill="none" stroke="#e2e8f0" stroke-width="3">
    <line x1="0" y1="140" x2="25" y2="0"/>
    <line x1="60" y1="140" x2="35" y2="0"/>
    <line x1="10" y1="100" x2="50" y2="100"/>
    <line x1="18" y1="60" x2="42" y2="60"/>
    <line x1="24" y1="20" x2="36" y2="20"/>
  </g>

  <!-- Gas Flare Boom with Burning Flame -->
  <line x1="650" y1="240" x2="760" y2="140" stroke="#475569" stroke-width="6"/>
  <polygon points="760,140 780,110 810,130 790,150" fill="#facc15"/>
  <polygon points="770,135 785,120 795,135" fill="#ef4444"/>
</svg>