<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="desertSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="solarBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#desertSun)"/>

  <!-- Blazing Sun -->
  <circle cx="800" cy="110" r="55" fill="#facc15"/>
  <circle cx="800" cy="110" r="75" fill="#facc15" opacity="0.3"/>

  <!-- Rolling Golden Sand Dunes -->
  <path d="M0,260 Q340,210 680,280 T960,230 L960,540 L0,540 Z" fill="#d97706"/>
  <path d="M0,320 Q480,270 960,340 L960,540 L0,540 Z" fill="#b45309"/>

  <!-- Vast Geometric Rows of Solar PV Panels -->
  <!-- Row 1 (Distant) -->
  <g fill="url(#solarBlue)" stroke="#60a5fa" stroke-width="1">
    <polygon points="80,290 240,270 300,310 140,330"/>
    <polygon points="340,270 500,250 560,290 400,310"/>
    <polygon points="600,250 760,230 820,270 660,290"/>
  </g>

  <!-- Row 2 (Midground) -->
  <g fill="url(#solarBlue)" stroke="#60a5fa" stroke-width="1.5">
    <polygon points="40,360 260,330 340,390 120,420"/>
    <polygon points="380,330 600,300 680,360 460,390"/>
    <polygon points="700,300 920,270 960,320 780,350"/>
  </g>

  <!-- Row 3 (Foreground Large Panels) -->
  <g fill="url(#solarBlue)" stroke="#93c5fd" stroke-width="2">
    <polygon points="20,440 380,390 490,490 130,540"/>
    <polygon points="480,380 840,330 950,430 590,480"/>
    <!-- Grid Lines on PV modules -->
    <line x1="200" y1="415" x2="310" y2="515" stroke="#93c5fd" stroke-width="2"/>
    <line x1="660" y1="355" x2="770" y2="455" stroke="#93c5fd" stroke-width="2"/>
  </g>
</svg>