<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <radialGradient id="magCluster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="metalPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="fieldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#0f172a"/>
  
  <!-- Laboratory Table Surface -->
  <polygon points="0,380 960,380 960,540 0,540" fill="#1e293b"/>
  <line x1="0" y1="380" x2="960" y2="380" stroke="#334155" stroke-width="3"/>

  <!-- Magnetic Flux Lines -->
  <ellipse cx="480" cy="270" rx="340" ry="160" fill="none" stroke="url(#fieldLine)" stroke-width="2" stroke-dasharray="8,6"/>
  <ellipse cx="480" cy="270" rx="270" ry="120" fill="none" stroke="url(#fieldLine)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Massive Octahedral Magnetite Crystal Cluster -->
  <g fill="url(#magCluster)" stroke="#64748b" stroke-width="2">
    <!-- Main Center Crystal -->
    <polygon points="480,120 590,220 540,360 420,360 370,220"/>
    <polygon points="480,120 480,280 540,360 590,220" fill="#334155" opacity="0.6"/>
    <polygon points="480,120 370,220 420,360 480,280" fill="#0f172a" opacity="0.8"/>
    
    <!-- Secondary Adjacent Crystals -->
    <polygon points="340,240 410,180 430,300 330,340 280,280"/>
    <polygon points="620,240 700,280 650,370 560,350 580,210"/>
    <polygon points="440,320 520,300 560,390 480,420 400,380"/>
  </g>

  <!-- Metallic Iron Nails & Filings Stuck to Crystal -->
  <g fill="url(#metalPin)" stroke="#334155" stroke-width="1">
    <!-- Iron Nails sticking out -->
    <polygon points="480,120 484,60 476,60"/>
    <polygon points="590,220 670,200 666,192"/>
    <polygon points="370,220 290,190 294,182"/>
    <polygon points="560,390 620,440 612,446"/>
    <polygon points="400,380 340,430 346,436"/>
    
    <!-- Fine Iron Filings (Spikes) -->
    <line x1="480" y1="120" x2="495" y2="90" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="475" y1="125" x2="460" y2="95" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="585" y1="215" x2="625" y2="190" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="375" y1="225" x2="335" y2="200" stroke="#cbd5e1" stroke-width="3"/>
  </g>
</svg>