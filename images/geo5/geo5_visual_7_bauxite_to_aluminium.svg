<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="smelterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bauxiteClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#c2410c"/>
      <stop offset="80%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="alumIngot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#smelterBg)"/>

  <!-- Left: Raw Bauxite Ore -->
  <g transform="translate(180, 260)">
    <g fill="url(#bauxiteClay)" stroke="#431407" stroke-width="2">
      <polygon points="0,60 70,-20 160,20 140,130 20,120"/>
      <polygon points="120,40 200,-10 260,50 220,140 130,130"/>
      <polygon points="-50,90 20,40 60,120 0,160 -40,140"/>
    </g>
  </g>

  <!-- Center: Smelting Transition Arrow -->
  <g transform="translate(480, 270)" fill="#f59e0b">
    <polygon points="0,-25 35,0 0,25 -5,12 -45,12 -45,-12 -5,-12"/>
  </g>

  <!-- Right: Gleaming Aluminium Stacked Ingots -->
  <g transform="translate(560, 230)" fill="url(#alumIngot)" stroke="#334155" stroke-width="2">
    <!-- Bottom Row -->
    <polygon points="0,80 140,40 260,40 120,80"/>
    <polygon points="0,80 120,80 120,120 0,120"/>
    <polygon points="120,80 260,40 260,80 120,120"/>

    <polygon points="100,20 240,-20 360,-20 220,20"/>
    <polygon points="100,20 220,20 220,60 100,60"/>
    <polygon points="220,20 360,-20 360,20 220,60"/>

    <!-- Top Ingot -->
    <polygon points="50,-30 190,-70 310,-70 170,-30"/>
    <polygon points="50,-30 170,-30 170,10 50,10"/>
    <polygon points="170,-30 310,-70 310,-30 170,10"/>
  </g>
</svg>