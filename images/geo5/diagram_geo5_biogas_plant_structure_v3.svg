<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="slurryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="soilZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="760" fill="url(#canvasBg)" rx="24"/>
  <rect x="14" y="14" width="1172" height="732" fill="none" stroke="#059669" stroke-width="5" rx="20"/>

  <!-- ================= 1. MASTER TOP HEADER BANNER (Completely unobstructed) ================= -->
  <g filter="url(#softShadow)">
    <rect x="40" y="20" width="1120" height="54" rx="14" fill="url(#headerGrad)"/>
    <text x="600" y="55" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">
      बायोगैस / गोबर गैस संयंत्र की संरचना एवं कार्यप्रणाली (Biogas Plant Model)
    </text>
  </g>

  <!-- ================= 2. UNDERGROUND ZONE & BOUNDARY ================= -->
  <!-- Soil Background (below y=330) -->
  <rect x="40" y="330" width="1120" height="330" fill="url(#soilZone)" rx="14"/>
  <!-- Dotted Ground Line -->
  <line x1="40" y1="330" x2="1160" y2="330" stroke="#059669" stroke-width="5" stroke-dasharray="14,10"/>
  
  <!-- Ground Level Indicator Badge (Safely placed at y=345, well below any pipes) -->
  <g filter="url(#softShadow)">
    <rect x="50" y="345" width="220" height="36" rx="8" fill="#065f46"/>
    <text x="160" y="369" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      🌱 भू-तल स्तर (Ground Level)
    </text>
  </g>

  <!-- ================= 3. PIPES (Rendered before boxes to prevent overlap) ================= -->
  <!-- Left Inlet Slurry Pipe -->
  <path d="M 230 260 L 420 460" fill="none" stroke="#15803d" stroke-width="28" stroke-linecap="round"/>
  <path d="M 230 260 L 420 460" fill="none" stroke="#86efac" stroke-width="16" stroke-linecap="round"/>
  <!-- Flow Arrow -->
  <polygon points="360,395 395,430 355,435" fill="#15803d"/>

  <!-- Right Outlet Sludge Pipe -->
  <path d="M 780 460 L 970 260" fill="none" stroke="#c2410c" stroke-width="28" stroke-linecap="round"/>
  <path d="M 780 460 L 970 260" fill="none" stroke="#fdba74" stroke-width="16" stroke-linecap="round"/>
  <!-- Flow Arrow -->
  <polygon points="885,360 915,350 905,385" fill="#c2410c"/>

  <!-- ================= 4. GAS OUTLET PIPE & BADGE (Placed cleanly at y=90 to 140) ================= -->
  <!-- Vertical Pipe from Dome to Top Line -->
  <rect x="591" y="115" width="18" height="60" fill="#0284c7"/>
  <rect x="575" y="115" width="50" height="16" fill="#0369a1" rx="4"/>
  <path d="M 600 115 L 600 105 L 820 105" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>

  <!-- Gas Outlet Badge (Positioned at y=85, with zero overlap over the header banner) -->
  <g filter="url(#softShadow)">
    <rect x="760" y="82" width="390" height="48" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="955" y="113" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      💨 गैस निकास (रसोई चूल्हे हेतु स्वच्छ ईंधन)
    </text>
  </g>

  <!-- ================= 5. CENTRAL DIGESTER TANK (पाचक कक्ष) ================= -->
  <!-- Outer Tank Body -->
  <g filter="url(#softShadow)">
    <rect x="390" y="240" width="420" height="400" fill="#ffffff" stroke="#0f766e" stroke-width="6" rx="24"/>
    <!-- Liquid Slurry Fill -->
    <rect x="404" y="340" width="392" height="286" fill="url(#slurryGrad)" rx="16"/>
  </g>

  <!-- Floating / Fixed Gas Dome -->
  <g filter="url(#softShadow)">
    <path d="M 420 250 Q 600 125 780 250 Z" fill="url(#domeGrad)" stroke="#075985" stroke-width="5"/>
    
    <!-- Dome Title Box (Solid White Badge at y=175) -->
    <rect x="450" y="175" width="300" height="46" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="4" filter="url(#softShadow)"/>
    <text x="600" y="206" fill="#0369a1" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      गैस संचयन डोम (CH₄ + CO₂)
    </text>
  </g>

  <!-- ================= 6. INLET TANK (प्रवेश कक्ष - बायां बॉक्स) ================= -->
  <g filter="url(#softShadow)">
    <rect x="50" y="145" width="280" height="125" fill="#ffffff" stroke="#15803d" stroke-width="5" rx="18"/>
    <!-- Header -->
    <rect x="60" y="155" width="260" height="42" fill="#15803d" rx="10"/>
    <text x="190" y="184" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      प्रवेश कक्ष (Inlet Tank)
    </text>
    <!-- Description Box -->
    <rect x="60" y="204" width="260" height="55" fill="#dcfce7" rx="10"/>
    <text x="190" y="228" fill="#14532d" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      गोबर + जल का घोल
    </text>
    <text x="190" y="248" fill="#166534" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      (अनुपात 1:1 स्लरी)
    </text>
  </g>

  <!-- ================= 7. OUTLET TANK (निकास कक्ष - दायां बॉक्स) ================= -->
  <g filter="url(#softShadow)">
    <rect x="870" y="145" width="280" height="125" fill="#ffffff" stroke="#c2410c" stroke-width="5" rx="18"/>
    <!-- Header -->
    <rect x="880" y="155" width="260" height="42" fill="#c2410c" rx="10"/>
    <text x="1010" y="184" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      निकास कक्ष (Outlet Tank)
    </text>
    <!-- Description Box -->
    <rect x="880" y="204" width="260" height="55" fill="#ffedd5" rx="10"/>
    <text x="1010" y="228" fill="#7c2d12" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      प्रयुक्त बायोगैस स्लरी
    </text>
    <text x="1010" y="248" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      (नाइट्रोजन युक्त जैविक खाद)
    </text>
  </g>

  <!-- ================= 8. DIGESTER INTERNAL LABELS (पाचक कक्ष के अंदर) ================= -->
  <!-- Digester Title Badge -->
  <g filter="url(#softShadow)">
    <rect x="440" y="360" width="320" height="46" rx="12" fill="#78350f"/>
    <text x="600" y="391" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="900" text-anchor="middle">
      पाचक कक्ष (Digester Tank)
    </text>
  </g>

  <!-- Digester Process Description Box -->
  <g filter="url(#softShadow)">
    <rect x="420" y="440" width="360" height="100" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="4"/>
    <text x="600" y="475" fill="#78350f" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="900" text-anchor="middle">
      अवायवीय सूक्ष्मजीव (Bacteria)
    </text>
    <text x="600" y="504" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      बिना ऑक्सीजन किण्वन (Fermentation)
    </text>
    <text x="600" y="528" fill="#b45309" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      (मीथेन व कार्बन डाइऑक्साइड निर्माण)
    </text>
  </g>

  <!-- ================= 9. BOTTOM 3 SUMMARY CARDS ================= -->
  <g filter="url(#softShadow)">
    <!-- Card 1 -->
    <rect x="40" y="675" width="355" height="58" rx="16" fill="#065f46" stroke="#10b981" stroke-width="3"/>
    <text x="217" y="711" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      1. कच्चा माल: गोबर + जल + अपशिष्ट
    </text>

    <!-- Card 2 -->
    <rect x="420" y="675" width="360" height="58" rx="16" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="711" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      2. मुख्य गैस: मीथेन (CH₄ 55% - 70%)
    </text>

    <!-- Card 3 -->
    <rect x="805" y="675" width="355" height="58" rx="16" fill="#9a3412" stroke="#fb923c" stroke-width="3"/>
    <text x="982" y="711" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      3. सह-उत्पाद: N &amp; P युक्त जैविक खाद
    </text>
  </g>
</svg>