<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="slurryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="soilZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#canvasBg)" rx="24"/>
  <rect x="14" y="14" width="1172" height="722" fill="none" stroke="#059669" stroke-width="5" rx="20"/>

  <!-- ================= 1. MASTER HEADER BANNER ================= -->
  <g filter="url(#softShadow)">
    <rect x="40" y="20" width="1120" height="60" rx="16" fill="url(#headerGrad)"/>
    <text x="600" y="58" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1">
      बायोगैस / गोबर गैस संयंत्र की संरचना एवं कार्यप्रणाली (Biogas Plant Model)
    </text>
  </g>

  <!-- ================= 2. UNDERGROUND GROUND LEVEL (भू-तल) ================= -->
  <!-- Soil Zone (Below ground y=330) -->
  <rect x="40" y="330" width="1120" height="320" fill="url(#soilZone)" rx="14"/>
  <!-- Dotted Ground Boundary -->
  <line x1="40" y1="330" x2="1160" y2="330" stroke="#059669" stroke-width="5" stroke-dasharray="14,10"/>
  
  <!-- Ground Level Indicator Badge (Top Left) -->
  <g filter="url(#softShadow)">
    <rect x="50" y="280" width="240" height="40" rx="10" fill="#065f46" stroke="#ffffff" stroke-width="2"/>
    <text x="170" y="306" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      🌱 भू-तल स्तर (Ground Level)
    </text>
  </g>

  <!-- ================= 3. INLET / OUTLET CONNECTING PIPES ================= -->
  <!-- Left Inlet Slurry Pipe (Underground) -->
  <path d="M 230 300 L 420 465" fill="none" stroke="#15803d" stroke-width="28" stroke-linecap="round"/>
  <path d="M 230 300 L 420 465" fill="none" stroke="#86efac" stroke-width="16" stroke-linecap="round"/>
  <!-- Flow Arrow -->
  <polygon points="360,400 395,435 355,440" fill="#15803d"/>

  <!-- Right Outlet Sludge Pipe (Underground) -->
  <path d="M 780 465 L 970 300" fill="none" stroke="#c2410c" stroke-width="28" stroke-linecap="round"/>
  <path d="M 780 465 L 970 300" fill="none" stroke="#fdba74" stroke-width="16" stroke-linecap="round"/>
  <!-- Flow Arrow -->
  <polygon points="885,365 915,355 905,390" fill="#c2410c"/>

  <!-- ================= 4. CENTRAL DIGESTER TANK (पाचक कक्ष) ================= -->
  <!-- Outer Tank Body -->
  <g filter="url(#softShadow)">
    <rect x="390" y="230" width="420" height="400" fill="#ffffff" stroke="#0f766e" stroke-width="6" rx="24"/>
    <!-- Liquid Slurry Fill -->
    <rect x="404" y="340" width="392" height="276" fill="url(#slurryGrad)" rx="16"/>
  </g>

  <!-- Floating / Fixed Gas Dome -->
  <g filter="url(#softShadow)">
    <path d="M 420 240 Q 600 110 780 240 Z" fill="url(#domeGrad)" stroke="#075985" stroke-width="5"/>
    
    <!-- Ultra-Clear Dome Title Box (Solid White Badge with Zero Overlap) -->
    <rect x="450" y="160" width="300" height="46" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="4" filter="url(#softShadow)"/>
    <text x="600" y="191" fill="#0369a1" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      गैस संचयन डोम (CH₄ + CO₂)
    </text>
  </g>

  <!-- ================= 5. GAS OUTLET PIPE & VALVE ================= -->
  <rect x="591" y="80" width="18" height="50" fill="#0284c7"/>
  <rect x="575" y="80" width="50" height="16" fill="#0369a1" rx="4"/>
  <path d="M 600 80 L 600 65 L 810 65" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>

  <!-- Gas Outlet Top-Right Badge -->
  <g filter="url(#softShadow)">
    <rect x="760" y="42" width="380" height="50" rx="14" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="950" y="74" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      💨 गैस निकास (रसोई चूल्हे हेतु स्वच्छ ईंधन)
    </text>
  </g>

  <!-- ================= 6. INLET TANK (प्रवेश कक्ष - बायां बॉक्स) ================= -->
  <g filter="url(#softShadow)">
    <rect x="50" y="145" width="280" height="125" fill="#ffffff" stroke="#15803d" stroke-width="5" rx="18"/>
    <!-- Header -->
    <rect x="60" y="155" width="260" height="42" fill="#15803d" rx="10"/>
    <text x="190" y="184" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      प्रवेश कक्ष (Inlet Tank)
    </text>
    <!-- Description Box -->
    <rect x="60" y="204" width="260" height="55" fill="#dcfce7" rx="10"/>
    <text x="190" y="228" fill="#14532d" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      गोबर + जल का घोल
    </text>
    <text x="190" y="248" fill="#166534" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      (अनुपात 1:1 स्लरी)
    </text>
  </g>

  <!-- ================= 7. OUTLET TANK (निकास कक्ष - दायां बॉक्स) ================= -->
  <g filter="url(#softShadow)">
    <rect x="870" y="145" width="280" height="125" fill="#ffffff" stroke="#c2410c" stroke-width="5" rx="18"/>
    <!-- Header -->
    <rect x="880" y="155" width="260" height="42" fill="#c2410c" rx="10"/>
    <text x="1010" y="184" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      निकास कक्ष (Outlet Tank)
    </text>
    <!-- Description Box -->
    <rect x="880" y="204" width="260" height="55" fill="#ffedd5" rx="10"/>
    <text x="1010" y="228" fill="#7c2d12" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      प्रयुक्त बायोगैस स्लरी
    </text>
    <text x="1010" y="248" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      (नाइट्रोजन युक्त जैविक खाद)
    </text>
  </g>

  <!-- ================= 8. DIGESTER INTERNAL LABELS (पाचक कक्ष के अंदर) ================= -->
  <!-- Digester Title Badge (Solid Dark Brown) -->
  <g filter="url(#softShadow)">
    <rect x="440" y="360" width="320" height="46" rx="12" fill="#78350f"/>
    <text x="600" y="391" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="900" text-anchor="middle">
      पाचक कक्ष (Digester Tank)
    </text>
  </g>

  <!-- Digester Process Description Box (Solid White Background with Zero Overlap) -->
  <g filter="url(#softShadow)">
    <rect x="420" y="440" width="360" height="100" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="4"/>
    <text x="600" y="475" fill="#78350f" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="900" text-anchor="middle">
      अवायवीय सूक्ष्मजीव (Bacteria)
    </text>
    <text x="600" y="504" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      बिना ऑक्सीजन किण्वन (Fermentation)
    </text>
    <text x="600" y="528" fill="#b45309" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      (मीथेन व कार्बन डाइऑक्साइड निर्माण)
    </text>
  </g>

  <!-- ================= 9. BOTTOM 3 SUMMARY CARDS ================= -->
  <g filter="url(#softShadow)">
    <!-- Card 1 -->
    <rect x="40" y="665" width="355" height="58" rx="16" fill="#065f46" stroke="#10b981" stroke-width="3"/>
    <text x="217" y="701" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      1. कच्चा माल: गोबर + जल + अपशिष्ट
    </text>

    <!-- Card 2 -->
    <rect x="420" y="665" width="360" height="58" rx="16" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="701" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      2. मुख्य गैस: मीथेन (CH₄ 55% - 70%)
    </text>

    <!-- Card 3 -->
    <rect x="805" y="665" width="355" height="58" rx="16" fill="#9a3412" stroke="#fb923c" stroke-width="3"/>
    <text x="982" y="701" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      3. सह-उत्पाद: N &amp; P युक्त जैविक खाद
    </text>
  </g>
</svg>