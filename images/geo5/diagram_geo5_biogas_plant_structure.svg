<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="digesterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="700" fill="url(#bgGrad)" rx="24"/>
  <rect x="12" y="12" width="1076" height="676" fill="none" stroke="#059669" stroke-width="5" rx="20"/>

  <!-- ================= 1. TOP HEADER BANNER ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="18" width="1020" height="56" rx="14" fill="url(#bannerGrad)"/>
    <text x="550" y="54" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="1">
      बायोगैस / गोबर गैस संयंत्र की संरचना एवं कार्यप्रणाली (Biogas Plant Architecture)
    </text>
  </g>

  <!-- ================= 2. GROUND LEVEL (भू-तल) ================= -->
  <!-- Ground shaded zone -->
  <rect x="40" y="315" width="1020" height="305" fill="#f1f5f9" opacity="0.7" rx="12"/>
  <!-- Dotted Ground Line -->
  <line x1="40" y1="315" x2="1060" y2="315" stroke="#059669" stroke-width="4" stroke-dasharray="12,8"/>
  
  <!-- Ground Level Badge (Left Top - Clear of any lines) -->
  <g filter="url(#shadow)">
    <rect x="50" y="272" width="220" height="34" rx="8" fill="#065f46"/>
    <text x="160" y="295" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      🌱 भू-तल स्तर (Ground Level)
    </text>
  </g>

  <!-- ================= 3. INLET / OUTLET CONNECTING PIPES ================= -->
  <!-- Left Inlet Slurry Pipe (Underground) -->
  <path d="M 220 280 L 395 440" fill="none" stroke="#15803d" stroke-width="26" stroke-linecap="round"/>
  <path d="M 220 280 L 395 440" fill="none" stroke="#86efac" stroke-width="16" stroke-linecap="round"/>
  <!-- Inlet Flow Arrow -->
  <polygon points="340,380 370,410 335,415" fill="#15803d"/>

  <!-- Right Outlet Sludge Pipe (Underground) -->
  <path d="M 705 440 L 880 280" fill="none" stroke="#c2410c" stroke-width="26" stroke-linecap="round"/>
  <path d="M 705 440 L 880 280" fill="none" stroke="#fdba74" stroke-width="16" stroke-linecap="round"/>
  <!-- Outlet Flow Arrow -->
  <polygon points="805,345 830,335 825,365" fill="#c2410c"/>

  <!-- ================= 4. CENTRAL DIGESTER TANK (पाचक कक्ष) ================= -->
  <!-- Outer Tank Body -->
  <g filter="url(#shadow)">
    <rect x="360" y="225" width="380" height="385" fill="#ffffff" stroke="#0f766e" stroke-width="6" rx="22"/>
    <!-- Liquid Slurry Fill -->
    <rect x="372" y="325" width="356" height="273" fill="url(#digesterGrad)" rx="14"/>
  </g>

  <!-- Floating / Fixed Gas Dome -->
  <g filter="url(#shadow)">
    <path d="M 385 235 Q 550 110 715 235 Z" fill="url(#domeGrad)" stroke="#075985" stroke-width="5"/>
    
    <!-- Dome Title Box (Solid White Badge with Zero Overlap) -->
    <rect x="415" y="160" width="270" height="42" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/>
    <text x="550" y="187" fill="#0369a1" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      गैस संचयन डोम (CH₄ + CO₂)
    </text>
  </g>

  <!-- ================= 5. GAS OUTLET PIPE & VALVE ================= -->
  <!-- Pipe T-Junction -->
  <rect x="542" y="80" width="16" height="45" fill="#0284c7"/>
  <rect x="525" y="80" width="50" height="16" fill="#0369a1" rx="4"/>
  <path d="M 550 80 L 550 65 L 750 65" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>

  <!-- Gas Outlet Top-Right Badge -->
  <g filter="url(#shadow)">
    <rect x="710" y="44" width="350" height="46" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="885" y="74" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      💨 गैस निकास (रसोई चूल्हे हेतु स्वच्छ ईंधन)
    </text>
  </g>

  <!-- ================= 6. INLET TANK (प्रवेश कक्ष - बायां बॉक्स) ================= -->
  <g filter="url(#shadow)">
    <!-- White Base Container -->
    <rect x="55" y="150" width="255" height="115" fill="#ffffff" stroke="#15803d" stroke-width="5" rx="16"/>
    <!-- Header -->
    <rect x="65" y="160" width="235" height="38" fill="#15803d" rx="8"/>
    <text x="182" y="186" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      प्रवेश कक्ष (Inlet Tank)
    </text>
    <!-- Description Box -->
    <rect x="65" y="204" width="235" height="50" fill="#dcfce7" rx="8"/>
    <text x="182" y="226" fill="#14532d" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      गोबर + जल का घोल
    </text>
    <text x="182" y="246" fill="#166534" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
      (अनुपात 1:1 स्लरी)
    </text>
  </g>

  <!-- ================= 7. OUTLET TANK (निकास कक्ष - दायां बॉक्स) ================= -->
  <g filter="url(#shadow)">
    <!-- White Base Container -->
    <rect x="790" y="150" width="260" height="115" fill="#ffffff" stroke="#c2410c" stroke-width="5" rx="16"/>
    <!-- Header -->
    <rect x="800" y="160" width="240" height="38" fill="#c2410c" rx="8"/>
    <text x="920" y="186" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      निकास कक्ष (Outlet Tank)
    </text>
    <!-- Description Box -->
    <rect x="800" y="204" width="240" height="50" fill="#ffedd5" rx="8"/>
    <text x="920" y="226" fill="#7c2d12" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      प्रयुक्त बायोगैस स्लरी
    </text>
    <text x="920" y="246" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
      (नाइट्रोजन युक्त जैविक खाद)
    </text>
  </g>

  <!-- ================= 8. DIGESTER INTERNAL LABELS (पाचक कक्ष के अंदर) ================= -->
  <!-- Digester Title Badge (Solid Dark Brown) -->
  <g filter="url(#shadow)">
    <rect x="410" y="345" width="280" height="40" rx="10" fill="#78350f"/>
    <text x="550" y="371" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="900" text-anchor="middle">
      पाचक कक्ष (Digester Tank)
    </text>
  </g>

  <!-- Digester Process Description Box (Solid White Background with Zero Overlap) -->
  <g filter="url(#shadow)">
    <rect x="385" y="420" width="330" height="85" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
    <text x="550" y="450" fill="#78350f" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      अवायवीय सूक्ष्मजीव (Bacteria)
    </text>
    <text x="550" y="476" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      बिना ऑक्सीजन किण्वन (Fermentation)
    </text>
    <text x="550" y="496" fill="#b45309" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      (मीथेन व CO₂ गैस निर्माण)
    </text>
  </g>

  <!-- Short Lower Partition Wall (Only at the very bottom, below text) -->
  <rect x="544" y="525" width="12" height="75" fill="#0f766e" rx="4"/>

  <!-- ================= 9. BOTTOM 3 SUMMARY CARDS ================= -->
  <g filter="url(#shadow)">
    <!-- Card 1 -->
    <rect x="40" y="628" width="325" height="54" rx="14" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="202" y="661" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      1. कच्चा माल: गोबर + जल + अपशिष्ट
    </text>

    <!-- Card 2 -->
    <rect x="385" y="628" width="330" height="54" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="550" y="661" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      2. मुख्य गैस: मीथेन (CH₄ 55% - 70%)
    </text>

    <!-- Card 3 -->
    <rect x="735" y="628" width="325" height="54" rx="14" fill="#9a3412" stroke="#fb923c" stroke-width="2"/>
    <text x="897" y="661" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      3. सह-उत्पाद: N &amp; P युक्त जैविक खाद
    </text>
  </g>
</svg>