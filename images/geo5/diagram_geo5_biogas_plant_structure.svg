<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="digesterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)" rx="24"/>
  <rect x="12" y="12" width="1076" height="656" fill="none" stroke="#059669" stroke-width="5" rx="20"/>

  <!-- ================= TOP HEADER BANNER ================= -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGrad)"/>
    <text x="550" y="53" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="1">
      बायोगैस / गोबर गैस संयंत्र की संरचना एवं कार्यप्रणाली (Biogas Plant Architecture)
    </text>
  </g>

  <!-- ================= GROUND LEVEL (भू-तल) ================= -->
  <rect x="40" y="310" width="1020" height="295" fill="#f8fafc" opacity="0.6" rx="12"/>
  <line x1="40" y1="310" x2="1060" y2="310" stroke="#059669" stroke-width="5" stroke-dasharray="12,8"/>
  
  <!-- Ground Level Badge (Left) -->
  <g filter="url(#cardShadow)">
    <rect x="45" y="270" width="220" height="34" rx="8" fill="#065f46"/>
    <text x="155" y="293" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      🌱 भू-तल स्तर (Ground Level)
    </text>
  </g>

  <!-- ================= CENTRAL DIGESTER PIT (पाचक कक्ष) ================= -->
  <!-- Outer Digester Wall -->
  <g filter="url(#cardShadow)">
    <rect x="360" y="230" width="380" height="365" fill="#ffffff" stroke="#0f766e" stroke-width="6" rx="20"/>
    <!-- Slurry Liquid Fill -->
    <rect x="372" y="325" width="356" height="258" fill="url(#digesterGrad)" rx="12"/>
    
    <!-- Central Brick Partition Wall -->
    <rect x="544" y="390" width="12" height="193" fill="#0f766e" rx="4"/>
  </g>

  <!-- Floating / Fixed Gas Dome (गैस धारक डोम) -->
  <g filter="url(#cardShadow)">
    <path d="M 390 240 Q 550 120 710 240 Z" fill="url(#domeGrad)" stroke="#075985" stroke-width="5"/>
    
    <!-- Ultra High Contrast Dome Label Badge -->
    <rect x="420" y="165" width="260" height="38" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="3" filter="url(#cardShadow)"/>
    <text x="550" y="190" fill="#0369a1" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      गैस संचयन डोम (CH₄ + CO₂)
    </text>
  </g>

  <!-- ================= GAS OUTLET PIPE & VALVE ================= -->
  <!-- Metal Pipe T-Junction -->
  <rect x="542" y="80" width="16" height="50" fill="#0284c7"/>
  <rect x="525" y="80" width="50" height="16" fill="#0369a1" rx="4"/>
  <path d="M 550 80 L 550 65 L 750 65" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>

  <!-- Gas Outlet High-Contrast Badge -->
  <g filter="url(#cardShadow)">
    <rect x="710" y="44" width="350" height="46" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="885" y="74" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      💨 गैस निकास (रसोई चूल्हे हेतु स्वच्छ ईंधन)
    </text>
  </g>

  <!-- ================= INLET TANK (प्रवेश कक्ष - बाईं तरफ) ================= -->
  <!-- Connecting Slurry Pipe -->
  <path d="M 230 290 L 405 435" fill="none" stroke="#15803d" stroke-width="26" stroke-linecap="round"/>
  <path d="M 230 290 L 405 435" fill="none" stroke="#86efac" stroke-width="16" stroke-linecap="round"/>
  <!-- Flow Arrow -->
  <polygon points="350,380 375,405 345,410" fill="#15803d"/>

  <!-- Inlet Box Container -->
  <g filter="url(#cardShadow)">
    <rect x="65" y="160" width="240" height="120" fill="#ffffff" stroke="#15803d" stroke-width="5" rx="16"/>
    
    <!-- Title Header -->
    <rect x="75" y="170" width="220" height="38" fill="#15803d" rx="8"/>
    <text x="185" y="196" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      प्रवेश कक्ष (Inlet Tank)
    </text>
    
    <!-- Content Description -->
    <rect x="75" y="215" width="220" height="52" fill="#dcfce7" rx="8"/>
    <text x="185" y="238" fill="#14532d" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      गोबर + जल का घोल
    </text>
    <text x="185" y="258" fill="#166534" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
      (अनुपात 1:1 स्लरी)
    </text>
  </g>

  <!-- ================= OUTLET TANK (निकास कक्ष - दाईं तरफ) ================= -->
  <!-- Connecting Sludge Pipe -->
  <path d="M 695 435 L 870 290" fill="none" stroke="#c2410c" stroke-width="26" stroke-linecap="round"/>
  <path d="M 695 435 L 870 290" fill="none" stroke="#fdba74" stroke-width="16" stroke-linecap="round"/>
  <!-- Flow Arrow -->
  <polygon points="795,345 820,335 815,365" fill="#c2410c"/>

  <!-- Outlet Box Container -->
  <g filter="url(#cardShadow)">
    <rect x="795" y="160" width="255" height="120" fill="#ffffff" stroke="#c2410c" stroke-width="5" rx="16"/>
    
    <!-- Title Header -->
    <rect x="805" y="170" width="235" height="38" fill="#c2410c" rx="8"/>
    <text x="922" y="196" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      निकास कक्ष (Outlet Tank)
    </text>
    
    <!-- Content Description -->
    <rect x="805" y="215" width="235" height="52" fill="#ffedd5" rx="8"/>
    <text x="922" y="238" fill="#7c2d12" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      प्रयुक्त बायोगैस स्लरी
    </text>
    <text x="922" y="258" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
      (नाइट्रोजन युक्त जैविक खाद)
    </text>
  </g>

  <!-- ================= DIGESTER PROCESS LABELS (INSIDE PIT) ================= -->
  <!-- Digester Title Badge -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="340" width="280" height="38" rx="10" fill="#78350f"/>
    <text x="550" y="365" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      पाचक कक्ष (Digester Tank)
    </text>
  </g>

  <!-- Digester Activity Description Box -->
  <rect x="385" y="440" width="330" height="75" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="550" y="468" fill="#78350f" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
    अवायवीय सूक्ष्मजीव (Anaerobic Bacteria)
  </text>
  <text x="550" y="495" fill="#9a3412" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
    बिना ऑक्सीजन किण्वन द्वारा गैस निर्माण
  </text>

  <!-- ================= BOTTOM 3 PROJECTOR SUMMARY CARDS ================= -->
  <g filter="url(#cardShadow)">
    <!-- Card 1 -->
    <rect x="40" y="608" width="325" height="52" rx="14" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="202" y="640" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      1. कच्चा माल: गोबर + जल + कृषि कचरा
    </text>

    <!-- Card 2 -->
    <rect x="385" y="608" width="330" height="52" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="550" y="640" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      2. मुख्य गैस: मीथेन (CH₄ 55% - 70%)
    </text>

    <!-- Card 3 -->
    <rect x="735" y="608" width="325" height="52" rx="14" fill="#9a3412" stroke="#fb923c" stroke-width="2"/>
    <text x="897" y="640" fill="#ffffff" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      3. सह-उत्पाद: N &amp; P युक्त उत्तम जैविक खाद
    </text>
  </g>
</svg>