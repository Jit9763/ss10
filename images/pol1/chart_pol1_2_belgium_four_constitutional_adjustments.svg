<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad2)" stroke="#334155" stroke-width="3"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow2)">
    <rect x="30" y="24" width="1040" height="76" rx="16" fill="#090d16" stroke="#facc15" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad2)" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">⭐ बेल्जियम मॉडल के 4 प्रमुख संवैधानिक संशोधन (1970 - 1993)</text>
  </g>

  <!-- 4 Grid Cards -->
  <g transform="translate(35, 125)" filter="url(#shadow2)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#0284c7"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. केंद्र में समान मंत्री (Equal Ministers)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• केंद्र सरकार में डच व फ्रेंच मंत्रियों की संख्या समान।</text>
    <text x="15" y="155" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• विशेष कानून दोनों भाषाई बहुमत से ही पास होंगे।</text>
  </g>

  <g transform="translate(565, 125)" filter="url(#shadow2)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#059669"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. स्वतंत्र राज्य सरकारें (State Power)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• केंद्र की अनेक शक्तियां राज्य सरकारों को दी गईं।</text>
    <text x="15" y="155" fill="#a7f3d0" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• राज्य सरकारें केंद्र सरकार के अधीन नहीं हैं।</text>
  </g>

  <g transform="translate(35, 380)" filter="url(#shadow2)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#d97706"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">3. ब्रुसेल्स में अलग सरकार (Brussels HQ)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• ब्रुसेल्स में दोनों समुदायों को समान प्रतिनिधित्व।</text>
    <text x="15" y="155" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• फ्रेंच भाषियों ने केंद्र में डच बराबरी स्वीकार की।</text>
  </g>

  <g transform="translate(565, 380)" filter="url(#shadow2)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#9333ea"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">4. सामुदायिक सरकार (Community Govt)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• संस्कृति, शिक्षा व भाषा हेतु तीसरी सरकार का गठन।</text>
    <text x="15" y="155" fill="#e9d5ff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• इसका चुनाव एक ही भाषा के लोग करते हैं।</text>
  </g>
</svg>