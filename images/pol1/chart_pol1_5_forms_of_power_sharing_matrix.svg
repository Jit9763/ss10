<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="titleGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad5)" stroke="#334155" stroke-width="3"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow5)">
    <rect x="30" y="24" width="1040" height="76" rx="16" fill="#090d16" stroke="#c084fc" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad5)" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="25" font-weight="900" text-anchor="middle">🧩 सत्ता की साझेदारी के 4 प्रमुख रूप (Forms of Power Sharing)</text>
  </g>

  <!-- 4 Grid Cards -->
  <g transform="translate(35, 125)" filter="url(#shadow5)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#0284c7"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. क्षैतिज वितरण (Horizontal Sharing)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• विधायिका, कार्यपालिका व न्यायपालिका में बंटवारा।</text>
    <text x="15" y="155" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• नियंत्रण और संतुलन की व्यवस्था (Checks & Balances)।</text>
  </g>

  <g transform="translate(565, 125)" filter="url(#shadow5)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#059669"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. ऊर्ध्वाधर वितरण (Vertical Sharing)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• केंद्र, राज्य और स्थानीय निकायों के बीच बंटवारा।</text>
    <text x="15" y="155" fill="#a7f3d0" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• संघात्मक सरकार (Federal Government)।</text>
  </g>

  <g transform="translate(35, 380)" filter="url(#shadow5)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#d97706"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">3. सामाजिक समूहों में (Social Groups)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• धार्मिक व भाषाई समूहों में सत्ता की भागीदारी।</text>
    <text x="15" y="155" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• बेल्जियम की सामुदायिक सरकार व भारत में आरक्षण।</text>
  </g>

  <g transform="translate(565, 380)" filter="url(#shadow5)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#9333ea"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">4. गठबंधन व दबाव समूह (Coalition Govt)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• दो या अधिक दलों का मिलकर सरकार बनाना।</text>
    <text x="15" y="155" fill="#e9d5ff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• व्यापारी, किसान व मजदूर संघों का प्रभाव।</text>
  </g>
</svg>