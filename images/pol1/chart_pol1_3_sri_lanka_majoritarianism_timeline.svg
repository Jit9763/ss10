<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180808"/>
      <stop offset="50%" stop-color="#2d1212"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad3)" stroke="#334155" stroke-width="3"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow3)">
    <rect x="30" y="24" width="1040" height="76" rx="16" fill="#090d16" stroke="#ef4444" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad3)" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="25" font-weight="900" text-anchor="middle">📜 श्रीलंका: बहुसंख्यकवाद से गृहयुद्ध की टाइमलाइन (1948 - 2009)</text>
  </g>

  <!-- 4 Step Flow Grid -->
  <g transform="translate(35, 125)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#d97706"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1948: स्वतंत्रता एवं सिंहली वर्चस्व</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• बहुसंख्यक सिंहली समुदाय का शासन पर वर्चस्व।</text>
    <text x="15" y="155" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• तमिल अल्पसंख्यकों की मांगों की अनदेखी।</text>
  </g>

  <g transform="translate(565, 125)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#fb923c" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#ea580c"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1956: सिंहली भाषा कानून (Only Act)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• सिंहली को एकमात्र आधिकारिक भाषा का दर्जा।</text>
    <text x="15" y="155" fill="#fed7aa" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• नौकरियों व कॉलेजों में सिंहलियों को प्राथमिकता।</text>
  </g>

  <g transform="translate(35, 380)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#dc2626"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1980s: तमिल ईलम की मांग (Tamil State)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• उत्तर-पूर्वी श्रीलंका में स्वतंत्र तमिल राज्य की मांग।</text>
    <text x="15" y="155" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• तमिल संगठनों व सरकार के बीच सैन्य संघर्ष।</text>
  </g>

  <g transform="translate(565, 380)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#b91c1c" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="55" rx="16" fill="#991b1b"/>
    <text x="250" y="38" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">गृहयुद्ध व भीषण विनाश (Civil War)</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• दोनों पक्षों के हज़ारों निर्दोष नागरिकों की मृत्यु।</text>
    <text x="15" y="155" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• देश की अर्थव्यवस्था व सौहार्द का भारी विनाश।</text>
  </g>
</svg>