<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180808"/>
      <stop offset="50%" stop-color="#2d1212"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow3)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#ef4444" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad3)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">🔥 श्रीलंका: बहुसंख्यकवाद से गृहयुद्ध तक का घटनाक्रम (Majoritarian Timeline)</text>
  </g>

  <!-- Timeline Cards (Horizontal Step Flow) -->
  <!-- Step 1: 1948 Independence -->
  <g transform="translate(40, 130)" filter="url(#shadow3)">
    <rect width="235" height="480" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="235" height="50" rx="16" fill="#d97706"/>
    <text x="117.5" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1948: स्वतंत्रता</text>
    
    <text x="15" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• श्रीलंका स्वतंत्र देश बना।</text>
    <text x="15" y="125" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• सिंहली समुदाय के नेताओं ने अपनी बहुसंख्या के बल पर प्रभुत्व जमाया।</text>
    <text x="15" y="185" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">🎯 लोकतांत्रिक सरकार ने बहुसंख्यकवादी नीतियां अपनाईं।</text>
  </g>

  <!-- Step 2: 1956 Act -->
  <g transform="translate(305, 130)" filter="url(#shadow3)">
    <rect width="235" height="480" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="235" height="50" rx="16" fill="#dc2626"/>
    <text x="117.5" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1956: राजभाषा कानून</text>
    
    <text x="15" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• सिंहली को एकमात्र राजभाषा का दर्जा (तमिल की उपेक्षा)।</text>
    <text x="15" y="145" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• विश्वविद्यालयों व सरकारी नौकरियों में सिंहली आवेदकों को प्राथमिकता।</text>
    <text x="15" y="215" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• बौद्ध धर्म को संरक्षण व बढ़ावा।</text>
  </g>

  <!-- Step 3: Tamil Alienation & Struggle -->
  <g transform="translate(570, 130)" filter="url(#shadow3)">
    <rect width="235" height="480" rx="16" fill="#1e293b" stroke="#fb923c" stroke-width="2.5"/>
    <rect x="0" y="0" width="235" height="50" rx="16" fill="#ea580c"/>
    <text x="117.5" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1970-80: तमिल संघर्ष</text>
    
    <text x="15" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• श्रीलंकाई तमिलों में अलगाव की भावना बढ़ी।</text>
    <text x="15" y="140" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• तमिल को राजभाषा बनाने व स्वायत्तता हेतु राजनीतिक दलों का गठन।</text>
    <text x="15" y="210" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• स्वतंत्र 'तमिल ईलम' (राज्य) की मांग उठी।</text>
  </g>

  <!-- Step 4: Civil War (2009 Ending) -->
  <g transform="translate(835, 130)" filter="url(#shadow3)">
    <rect width="225" height="480" rx="16" fill="#1e293b" stroke="#b91c1c" stroke-width="2.5"/>
    <rect x="0" y="0" width="225" height="50" rx="16" fill="#991b1b"/>
    <text x="112.5" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">गृहयुद्ध व विनाश</text>
    
    <text x="15" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• दोनों समुदायों में हिंसक टकराव व भयानक गृहयुद्ध (Civil War)।</text>
    <text x="15" y="150" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">• हजारों नागरिकों की मृत्यु, लाखों शरणार्थी बने।</text>
    <text x="15" y="210" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">💥 देश की सामाजिक व आर्थिक व्यवस्था पूरी तरह तबाह हुई (2009 में समाप्त)।</text>
  </g>
</svg>