<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad1)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow1)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#6366f1" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad1)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="30" font-weight="900" text-anchor="middle">📊 बेल्जियम बनाम श्रीलंका: जातीय बनावट (Ethnic Composition Comparison)</text>
  </g>

  <!-- Belgium Box (Left Side) -->
  <g transform="translate(45, 125)" filter="url(#shadow1)">
    <rect width="480" height="490" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="480" height="60" rx="18" fill="#0284c7"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">🇧🇪 बेल्जियम (यूरोप का छोटा देश - 1.1 करोड़ आबादी)</text>
    
    <!-- Country Demographics -->
    <rect x="20" y="80" width="440" height="180" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="112" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">1. संपूर्ण देश की जातीय बनावट:</text>
    <text x="45" y="146" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 59% फलेमिश क्षेत्र: डच भाषी (बहुसंख्यक)</text>
    <text x="45" y="180" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 40% वेलोनिया क्षेत्र: फ्रेंच भाषी (समृद्ध व शक्तिशाली)</text>
    <text x="45" y="214" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 01% जर्मन भाषी नागरिक</text>

    <!-- Brussels Capital Special Case -->
    <rect x="20" y="280" width="440" height="180" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="35" y="312" fill="#fbbf24" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">2. राजधानी ब्रुसेल्स की अनूठी जटिलता:</text>
    <text x="45" y="346" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 80% फ्रेंच भाषी (राजधानी में बहुसंख्यक)</text>
    <text x="45" y="380" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 20% डच भाषी (राजधानी में अल्पसंख्यक)</text>
    <text x="45" y="420" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="900">🎯 समाधान: 50-50 समान प्रतिनिधित्व मॉडल</text>
  </g>

  <!-- Sri Lanka Box (Right Side) -->
  <g transform="translate(575, 125)" filter="url(#shadow1)">
    <rect width="480" height="490" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <rect x="0" y="0" width="480" height="60" rx="18" fill="#dc2626"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">🇱🇰 श्रीलंका (द्वीप राष्ट्र - 2 करोड़ आबादी)</text>

    <!-- Language & Religion Breakdown -->
    <rect x="20" y="80" width="440" height="180" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="112" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">1. भाषा एवं धर्म का विभाजन:</text>
    <text x="45" y="146" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 74% सिंहली भाषी (मुख्यतः बौद्ध धर्म)</text>
    <text x="45" y="180" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 18% तमिल भाषी (13% मूल, 5% भारतीय)</text>
    <text x="45" y="214" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• 07% ईसाई (सिंहली व तमिल दोनों)</text>

    <!-- Majoritarian Policy Impact -->
    <rect x="20" y="280" width="440" height="180" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="35" y="312" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">2. 1956 का बहुसंख्यकवादी कानून:</text>
    <text x="45" y="346" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• सिंहली को एकमात्र आधिकारिक राजभाषा बनाया</text>
    <text x="45" y="380" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• विश्वविद्यालय व नौकरियों में सिंहलियों को प्राथमिकता</text>
    <text x="45" y="420" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="900">💥 दुष्परिणाम: तमिल अलगाव व भयानक गृहयुद्ध</text>
  </g>
</svg>