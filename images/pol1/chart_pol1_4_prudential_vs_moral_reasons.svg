<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="titleGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad4)" stroke="#334155" stroke-width="3"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow4)">
    <rect x="30" y="24" width="1040" height="76" rx="16" fill="#090d16" stroke="#facc15" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad4)" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="25" font-weight="900" text-anchor="middle">⚖️ सत्ता की साझेदारी के युक्तिपरक बनाम नैतिक तर्क</text>
  </g>

  <!-- Left: Prudential Reasons -->
  <g transform="translate(35, 125)" filter="url(#shadow4)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="65" rx="18" fill="#0284c7"/>
    <text x="250" y="42" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">1. युक्तिपरक तर्क (Prudential Reasons)</text>

    <text x="15" y="115" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• लाभ-हानि का समझदारी भरा गणित:</text>
    <text x="15" y="160" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">• सामाजिक समूहों के बीच टकराव को कम करता है।</text>
    <text x="15" y="205" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">• राजनीतिक व्यवस्था के स्थायित्व हेतु बेहतर।</text>
    <text x="15" y="250" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">• हिंसा और अशांति से बचाव करता है।</text>

    <rect x="15" y="315" width="470" height="145" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="235" y="355" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">🎯 मुख्य उद्देश्य:</text>
    <text x="235" y="405" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">बेहतर परिणाम (Better Outcomes)</text>
  </g>

  <!-- Right: Moral Reasons -->
  <g transform="translate(565, 125)" filter="url(#shadow4)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="65" rx="18" fill="#059669"/>
    <text x="250" y="42" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">2. नैतिक तर्क (Moral Reasons)</text>

    <text x="15" y="115" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• लोकतंत्र की आत्मा और मूलभूत नियम:</text>
    <text x="15" y="160" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">• लोगों की भागीदारी के बिना लोकतंत्र अधूरा है।</text>
    <text x="15" y="205" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">• नागरिकों का यह अधिकार है कि उनसे पूछा जाए।</text>
    <text x="15" y="250" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">• वैध सरकार वही है जहाँ जनता हिस्सा लेती है।</text>

    <rect x="15" y="315" width="470" height="145" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="235" y="355" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">🎯 मुख्य उद्देश्य:</text>
    <text x="235" y="405" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">लोकतंत्र का अंतर्निहित मूल्य (Intrinsic)</text>
  </g>
</svg>