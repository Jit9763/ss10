    <text x="25" y="112" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">₹34,409 <tspan fill="#f87171" font-size="13">(सबसे कम 🔴)</tspan></text>

    <rect x="15" y="142" width="290" height="70" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="25" y="166" fill="#fca5a5" font-size="14" font-weight="900" font-family="system-ui, sans-serif">👶 शिशु मृत्यु दर (IMR प्रति 1000):</text>
    <text x="25" y="194" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">35 <tspan fill="#f87171" font-size="13">(अत्यधिक चिंताजनक 🔴)</tspan></text>

    <rect x="15" y="224" width="290" height="70" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="25" y="248" fill="#fca5a5" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📚 साक्षरता दर (Literacy %):</text>
    <text x="25" y="276" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">62% <tspan fill="#f87171" font-size="13">(राष्ट्रीय औसत से कम 🔴)</tspan></text>

    <rect x="15" y="306" width="290" height="70" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="25" y="330" fill="#fca5a5" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🎒 निवल उपस्थिति (कक्षा 9-10):</text>
    <text x="25" y="358" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">43% <tspan fill="#f87171" font-size="13">(57% बच्चे स्कूल से बाहर)</tspan></text>

    <rect x="15" y="390" width="290" height="85" rx="10" fill="#7f1d1d"/>
    <text x="160" y="415" fill="#fecaca" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">⚠️ विकासात्मक चुनौती:</text>
    <text x="25" y="440" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सार्वजनिक सुविधाओं एवं बुनियादी</text>
    <text x="25" y="460" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  ढांचे में भारी निवेश की आवश्यकता।</text>
