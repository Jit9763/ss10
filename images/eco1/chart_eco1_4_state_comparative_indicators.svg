    <text x="25" y="194" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">10 <tspan fill="#34d399" font-size="13">(सर्वश्रेष्ठ स्वास्थ्य 🏆)</tspan></text>

    <rect x="15" y="224" width="290" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="248" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📚 साक्षरता दर (Literacy %):</text>
    <text x="25" y="276" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">94% <tspan fill="#34d399" font-size="13">(देश में शीर्ष 🏆)</tspan></text>

    <rect x="15" y="306" width="290" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="330" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🎒 निवल उपस्थिति (कक्षा 9-10):</text>
    <text x="25" y="358" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">83% <tspan fill="#34d399" font-size="13">(सर्वोच्च 🏆)</tspan></text>

    <rect x="15" y="390" width="290" height="85" rx="10" fill="#047857"/>
    <text x="160" y="415" fill="#d1fae5" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌟 सफलता का रहस्य:</text>
    <text x="25" y="440" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• मजबूत सार्वजनिक स्वास्थ्य ढांचा।</text>
    <text x="25" y="460" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सुचारु PDS राशन व सार्वभौमिक शिक्षा।</text>
  </g>

  <!-- COLUMN 3: BIHAR -->
  <g transform="translate(735, 95)" filter="url(#shadow4)">
