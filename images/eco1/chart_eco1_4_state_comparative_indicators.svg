  <!-- Bottom Core Takeaway Badge -->
  <rect x="40" y="605" width="1020" height="34" rx="8" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="550" y="628" fill="#ffffff" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    📌 सिद्ध निष्कर्ष: पैसा आपकी जेब में हो सकता है, लेकिन वह बेहतरीन स्वास्थ्य, स्वच्छ वायु और शिक्षा नहीं खरीद सकता (केरल मॉडल सर्वश्रेष्ठ है)।
  </text>
