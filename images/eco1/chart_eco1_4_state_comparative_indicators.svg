    <text x="25" y="84" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif">💵 प्रति व्यक्ति आय (2016-17):</text>
    <text x="25" y="112" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">₹1,80,174 <tspan fill="#34d399" font-size="13">(सर्वोच्च 🥇)</tspan></text>

    <rect x="15" y="142" width="290" height="70" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="166" fill="#f87171" font-size="14" font-weight="900" font-family="system-ui, sans-serif">👶 शिशु मृत्यु दर (IMR प्रति 1000):</text>
    <text x="25" y="194" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">30 <tspan fill="#fca5a5" font-size="13">(केरल से 3 गुना अधिक ⚠️)</tspan></text>

    <rect x="15" y="224" width="290" height="70" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="25" y="248" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📚 साक्षरता दर (Literacy %):</text>
    <text x="25" y="276" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">82% <tspan fill="#94a3b8" font-size="13">(मध्यम)</tspan></text>

    <rect x="15" y="306" width="290" height="70" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="25" y="330" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🎒 निवल उपस्थिति (कक्षा 9-10):</text>
    <text x="25" y="358" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">61% <tspan fill="#94a3b8" font-size="13">(मध्यम)</tspan></text>

