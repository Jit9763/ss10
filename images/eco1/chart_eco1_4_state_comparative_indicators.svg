    <text x="25" y="112" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">₹1,63,476 <tspan fill="#6ee7b7" font-size="13">(उच्च)</tspan></text>

    <rect x="15" y="142" width="290" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
