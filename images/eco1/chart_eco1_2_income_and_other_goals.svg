<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGrad2)"/>

  <!-- Master Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGrad2)" filter="url(#shadow2)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    ⚖️ विकास के बहुआयामी घटक: आय बनाम गैर-भौतिक लक्ष्य (Income vs Non-Material Goals)
  </text>

  <!-- Left Box: Material / Income Goals -->
  <g transform="translate(45, 95)" filter="url(#shadow2)">
    <rect width="485" height="490" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect width="485" height="50" rx="18" fill="#1e3a8a"/>
    <rect y="32" width="485" height="18" fill="#1e3a8a"/>
    <text x="242" y="34" fill="#ffffff" font-size="20" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">💰 भौतिक वस्तुएं / आय (Material Goals)</text>
    
    <rect x="25" y="70" width="435" height="70" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="98" fill="#60a5fa" font-size="17" font-weight="900" font-family="system-ui, sans-serif">💵 1. नियमित काम एवं बेहतर मजदूरी</text>
    <text x="40" y="124" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">अपनी उपज या निर्मित उत्पादों की उचित और अधिकतम कीमत।</text>

    <rect x="25" y="155" width="435" height="70" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="183" fill="#60a5fa" font-size="17" font-weight="900" font-family="system-ui, sans-serif">🏠 2. उच्च क्रय शक्ति एवं जीवन-यापन</text>
    <text x="40" y="209" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">पक्का मकान, पौष्टिक भोजन, वाहन व भौतिक उपभोग वस्तुएं।</text>

    <rect x="25" y="240" width="435" height="70" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="268" fill="#60a5fa" font-size="17" font-weight="900" font-family="system-ui, sans-serif">📈 3. धन व संपत्ति संचय (Wealth)</text>
    <text x="40" y="294" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">भविष्य की अनिश्चितताओं से सुरक्षा हेतु बचत एवं निवेश।</text>

    <rect x="25" y="325" width="435" height="145" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="242" y="355" fill="#ffffff" font-size="16" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">💡 द्रव्य (Money) की सीमाएं:</text>
    <text x="40" y="385" fill="#dbeafe" font-size="14" font-weight="900" font-family="system-ui, sans-serif">• द्रव्य भौतिक वस्तुएं खरीद सकता है, लेकिन यह</text>
    <text x="40" y="410" fill="#93c5fd" font-size="14" font-weight="900" font-family="system-ui, sans-serif">  प्रदूषण-मुक्त वातावरण या आदर नहीं खरीद सकता।</text>
    <text x="40" y="440" fill="#facc15" font-size="14" font-weight="900" font-family="system-ui, sans-serif">• केवल अधिक आय होना सुखी जीवन की गारंटी नहीं है।</text>
  </g>

  <!-- Right Box: Non-Material Quality of Life Goals -->
  <g transform="translate(570, 95)" filter="url(#shadow2)">
    <rect width="485" height="490" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="485" height="50" rx="18" fill="#065f46"/>
    <rect y="32" width="485" height="18" fill="#065f46"/>
    <text x="242" y="34" fill="#ffffff" font-size="20" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🕊️ गैर-भौतिक मूल्य (Non-Material Goals)</text>
    
    <rect x="25" y="70" width="435" height="70" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="98" fill="#34d399" font-size="17" font-weight="900" font-family="system-ui, sans-serif">🗽 1. स्वतंत्रता एवं स्वायत्तता (Freedom)</text>
    <text x="40" y="124" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">अपने निर्णय स्वयं लेने तथा विचारों की अभिव्यक्ति की आजादी।</text>

    <rect x="25" y="155" width="435" height="70" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="183" fill="#34d399" font-size="17" font-weight="900" font-family="system-ui, sans-serif">🛡️ 2. सुरक्षा एवं आदर (Security &amp; Respect)</text>
    <text x="40" y="209" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">कार्यस्थल पर सुरक्षा, सम्मानजनक व्यवहार एवं भेदभाव से मुक्ति।</text>

    <rect x="25" y="240" width="435" height="70" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="268" fill="#34d399" font-size="17" font-weight="900" font-family="system-ui, sans-serif">🤝 3. बराबरी का व्यवहार (Equality)</text>
    <text x="40" y="294" fill="#cbd5e1" font-size="14" font-weight="900" font-family="system-ui, sans-serif">जाति, धर्म, लिंग अथवा क्षेत्र के आधार पर कोई भेदभाव न होना।</text>

    <rect x="25" y="325" width="435" height="145" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="242" y="355" fill="#ffffff" font-size="16" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌟 'मिश्रित लक्ष्य' (Mix of Goals) का सिद्धांत:</text>
    <text x="40" y="385" fill="#d1fae5" font-size="14" font-weight="900" font-family="system-ui, sans-serif">• यदि किसी को दूर नौकरी में अधिक वेतन मिले लेकिन</text>
    <text x="40" y="410" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif">  सुरक्षा या परिवार के लिए समय न हो, तो वह स्वीकार नहीं करेगा।</text>
    <text x="40" y="440" fill="#facc15" font-size="14" font-weight="900" font-family="system-ui, sans-serif">• विकास के लिए लोग हमेशा 'लक्ष्यों के मिश्रण' को देखते हैं।</text>
  </g>

  <!-- Bottom Core Takeaway Badge -->
  <rect x="40" y="605" width="1020" height="34" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="628" fill="#ffffff" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    📌 कोर अवधारणा: जीवन जीने के लिए भौतिक द्रव्यों के साथ-साथ गैर-भौतिक मूल्य (स्वतंत्रता, सुरक्षा व सम्मान) अनिवार्य हैं।
  </text>
</svg>