<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad1)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow1)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad1)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="30" font-weight="900" text-anchor="middle">🏛️ एकात्मक बनाम संघात्मक शासन व्यवस्था (Unitary vs Federal System)</text>
  </g>

  <!-- Unitary Left Box -->
  <g transform="translate(45, 125)" filter="url(#shadow1)">
    <rect width="480" height="490" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <rect x="0" y="0" width="480" height="60" rx="18" fill="#dc2626"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">1. एकात्मक शासन (Unitary System)</text>
    
    <text x="25" y="100" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">केवल एक ही स्तर की केंद्रीय सरकार:</text>
    <text x="25" y="145" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• समस्त शक्तियां एक केंद्रीय सरकार के पास निहित होती हैं।</text>
    <text x="25" y="195" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• प्रांतीय या स्थानीय सरकारें केंद्र सरकार के अधीन होती हैं।</text>
    <text x="25" y="245" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• केंद्र सरकार राज्य सरकारों को कोई भी आदेश दे सकती है।</text>
    
    <rect x="20" y="320" width="440" height="140" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="240" y="355" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🌍 उदाहरण देश:</text>
    <text x="240" y="395" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">ब्रिटेन, श्रीलंका, चीन, फ्रांस।</text>
  </g>

  <!-- Federal Right Box -->
  <g transform="translate(575, 125)" filter="url(#shadow1)">
    <rect width="480" height="490" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <rect x="0" y="0" width="480" height="60" rx="18" fill="#059669"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">2. संघात्मक शासन (Federal System)</text>
    
    <text x="25" y="100" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">दो या दो से अधिक स्तरों की सरकारें:</text>
    <text x="25" y="145" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• शक्तियां संविधान द्वारा केंद्र व राज्य में स्पष्ट विभाजित।</text>
    <text x="25" y="195" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• राज्य सरकारें अपने अधिकारों हेतु केंद्र के अधीन नहीं हैं।</text>
    <text x="25" y="245" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• राज्य सरकारें अपने फैसलों के लिए जनता के प्रति जवाबदेह।</text>

    <rect x="20" y="320" width="440" height="140" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="240" y="355" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🌍 उदाहरण देश:</text>
    <text x="240" y="395" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">भारत, अमेरिका, बेल्जियम, कनाडा, ऑस्ट्रेलिया।</text>
  </g>
</svg>