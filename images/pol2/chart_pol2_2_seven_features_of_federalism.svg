<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow2)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#facc15" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad2)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">⭐ संघात्मक व्यवस्था की 7 मूलभूत विशेषताएं (7 Key Features of Federalism)</text>
  </g>

  <!-- 7 Points Box Layout -->
  <g transform="translate(35, 120)" filter="url(#shadow2)">
    <rect width="1010" height="495" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>
    
    <text x="35" y="55" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">1. दो या अधिक स्तर की सरकारें:</text>
    <text x="350" y="55" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">केंद्रीय सरकार, राज्य सरकार व स्थानीय निकाय।</text>

    <text x="35" y="115" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">2. अलग-अलग अधिकार क्षेत्र:</text>
    <text x="350" y="115" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">कानून बनाने, कर (Tax) वसूलने और प्रशासन का अपना-अपना दायरा।</text>

    <text x="35" y="175" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">3. संवैधानिक सुरक्षा:</text>
    <text x="350" y="175" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">अधिकार क्षेत्र संविधान में स्पष्ट रूप से लिखित व सुरक्षित।</text>

    <text x="35" y="235" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">4. कठोर संविधान संशोधन:</text>
    <text x="350" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">मौलिक प्रावधानों को एक स्तर की सरकार अकेले नहीं बदल सकती।</text>

    <text x="35" y="295" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">5. स्वतंत्र न्यायपालिका:</text>
    <text x="350" y="295" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">अदालतों को संविधान की व्याख्या का अधिकार; सर्वोच्च न्यायालय अंपायर।</text>

    <text x="35" y="355" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">6. वित्तीय स्वायत्तता:</text>
    <text x="350" y="355" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">राजस्व (Revenue) के अलग-अलग स्रोत तय ताकि आर्थिक स्वतंत्रता रहे।</text>

    <text x="35" y="415" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">7. दोहरा उद्देश्य:</text>
    <text x="350" y="415" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold">देश की एकता की सुरक्षा + क्षेत्रीय विविधताओं का सम्मान।</text>
  </g>
</svg>