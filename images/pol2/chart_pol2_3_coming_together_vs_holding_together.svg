<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow3)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#6366f1" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad3)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">🤝 'साथ आकर' बनाम 'साथ लेकर' संघ बनाने की व्यवस्था</text>
  </g>

  <!-- Left: Coming Together -->
  <g transform="translate(45, 125)" filter="url(#shadow3)">
    <rect width="480" height="490" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="480" height="60" rx="18" fill="#0284c7"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">1. साथ आकर संघ बनाना (Coming Together)</text>
    
    <text x="25" y="100" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• स्वतंत्र राज्यों का अपनी मर्जी से साथ आना:</text>
    <text x="25" y="135" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">दो या अधिक स्वतंत्र राष्ट्र अपनी सुरक्षा व संप्रभुता बढ़ाने हेतु मिलकर एक बड़ा संघ बनाते हैं।</text>

    <text x="25" y="200" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• प्रांतों को समान व केंद्र जितनी शक्ति:</text>
    <text x="25" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">सभी घटक राज्यों को समान अधिकार प्राप्त होते हैं और वे केंद्र जितने शक्तिशाली होते हैं।</text>

    <rect x="20" y="320" width="440" height="140" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="240" y="355" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🌍 उदाहरण देश:</text>
    <text x="240" y="395" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">USA (अमेरिका), स्विट्जरलैंड, ऑस्ट्रेलिया।</text>
  </g>

  <!-- Right: Holding Together -->
  <g transform="translate(575, 125)" filter="url(#shadow3)">
    <rect width="480" height="490" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
    <rect x="0" y="0" width="480" height="60" rx="18" fill="#db2777"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="22" font-weight="900" text-anchor="middle">2. साथ लेकर संघ बनाना (Holding Together)</text>
    
    <text x="25" y="100" fill="#fbcfe8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• बड़े देश द्वारा आंतरिक विभाजन:</text>
    <text x="25" y="135" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">एक बड़ा देश अपनी आंतरिक विविधता को ध्यान में रखकर राज्य और केंद्र में शक्तियां बांटता है।</text>

    <text x="25" y="200" fill="#fbcfe8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• केंद्र सरकार अधिक शक्तिशाली:</text>
    <text x="25" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">राज्यों की तुलना में केंद्र अधिक शक्तिशाली होता है; कुछ राज्यों को विशेष अधिकार (जैसे 371)।</text>

    <rect x="20" y="320" width="440" height="140" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <text x="240" y="355" fill="#f472b6" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🌍 उदाहरण देश:</text>
    <text x="240" y="395" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">भारत 🇮🇳, स्पेन, बेल्जियम।</text>
  </g>
</svg>