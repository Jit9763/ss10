<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow3)">
    <rect x="40" y="22" width="1020" height="74" rx="16" fill="#090d16" stroke="#6366f1" stroke-width="3"/>
    <text x="550" y="68" fill="url(#titleGrad3)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">🤝 'साथ आकर' बनाम 'साथ लेकर' संघ बनाने की व्यवस्था</text>
  </g>

  <!-- Left: Coming Together -->
  <g transform="translate(35, 120)" filter="url(#shadow3)">
    <rect width="500" height="500" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#0284c7"/>
    <text x="250" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. साथ आकर संघ बनाना (Coming Together)</text>
    
    <!-- Point 1 -->
    <text x="25" y="95" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• स्वतंत्र राज्यों का अपनी मर्जी से साथ आना:</text>
    <text x="25" y="125" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" line-height="1.5">
      <tspan x="25" dy="0">दो या अधिक स्वतंत्र राष्ट्र अपनी सुरक्षा व संप्रभुता</tspan>
      <tspan x="25" dy="24">बढ़ाने हेतु मिलकर एक बड़ा संघ बनाते हैं।</tspan>
    </text>

    <!-- Point 2 -->
    <text x="25" y="195" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• प्रांतों को समान व केंद्र जितनी शक्ति:</text>
    <text x="25" y="225" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">
      <tspan x="25" dy="0">सभी घटक राज्यों को समान अधिकार प्राप्त होते हैं</tspan>
      <tspan x="25" dy="24">और वे केंद्र जितने ही शक्तिशाली होते हैं।</tspan>
    </text>

    <!-- Examples Box -->
    <rect x="25" y="320" width="450" height="145" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="360" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🌍 उदाहरण देश:</text>
    <text x="250" y="405" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">USA (अमेरिका), स्विट्जरलैंड, ऑस्ट्रेलिया।</text>
  </g>

  <!-- Right: Holding Together -->
  <g transform="translate(565, 120)" filter="url(#shadow3)">
    <rect width="500" height="500" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#db2777"/>
    <text x="250" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. साथ लेकर संघ बनाना (Holding Together)</text>
    
    <!-- Point 1 -->
    <text x="25" y="95" fill="#fbcfe8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• बड़े देश द्वारा आंतरिक शक्तियों का विभाजन:</text>
    <text x="25" y="125" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">
      <tspan x="25" dy="0">एक बड़ा देश अपनी आंतरिक विविधता को ध्यान में</tspan>
      <tspan x="25" dy="24">रखकर राज्य और केंद्र में शक्तियां बांटता है।</tspan>
    </text>

    <!-- Point 2 -->
    <text x="25" y="195" fill="#fbcfe8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• केंद्र सरकार राज्यों से अधिक शक्तिशाली:</text>
    <text x="25" y="225" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">
      <tspan x="25" dy="0">राज्यों की तुलना में केंद्र अधिक शक्तिशाली होता है;</tspan>
      <tspan x="25" dy="24">कुछ राज्यों को विशेष अधिकार भी मिलते हैं।</tspan>
    </text>

    <!-- Examples Box -->
    <rect x="25" y="320" width="450" height="145" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <text x="250" y="360" fill="#f472b6" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🌍 उदाहरण देश:</text>
    <text x="250" y="405" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">भारत 🇮🇳, स्पेन, बेल्जियम।</text>
  </g>
</svg>