<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="titleGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow4)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#10b981" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad4)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">📜 भारतीय संविधान की विधायी सूचियां (3 Legislative Lists of India)</text>
  </g>

  <!-- 3 Columns (Union, State, Concurrent) + Residuary -->
  <!-- 1. Union List -->
  <g transform="translate(40, 125)" filter="url(#shadow4)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="50" rx="16" fill="#0284c7"/>
    <text x="160" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">1. संघ सूची (Union List)</text>

    <text x="15" y="85" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">राष्ट्रीय महत्व के विषय (केवल केंद्र):</text>
    <text x="15" y="120" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• रक्षा (Defense)</text>
    <text x="15" y="150" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• विदेशी मामले (Foreign Affairs)</text>
    <text x="15" y="180" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• बैंकिंग (Banking)</text>
    <text x="15" y="210" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• संचार (Communications)</text>
    <text x="15" y="240" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• मुद्रा (Currency)</text>

    <rect x="12" y="300" width="296" height="170" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="148" y="335" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">🎯 अधिकार:</text>
    <text x="148" y="370" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" text-anchor="middle">इन विषयों पर कानून बनाने का</text>
    <text x="148" y="400" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">अधिकार केवल केंद्र सरकार को।</text>
  </g>

  <!-- 2. State List -->
  <g transform="translate(390, 125)" filter="url(#shadow4)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="50" rx="16" fill="#d97706"/>
    <text x="160" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">2. राज्य सूची (State List)</text>

    <text x="15" y="85" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">स्थानीय महत्व के विषय (राज्य):</text>
    <text x="15" y="120" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• पुलिस (Police)</text>
    <text x="15" y="150" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• व्यापार (Trade & Commerce)</text>
    <text x="15" y="180" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• कृषि (Agriculture)</text>
    <text x="15" y="210" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• सिंचाई (Irrigation)</text>
    <text x="15" y="240" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• जेल व स्थानीय व्यवस्था</text>

    <rect x="12" y="300" width="296" height="170" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="148" y="335" fill="#fbbf24" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">🎯 अधिकार:</text>
    <text x="148" y="370" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" text-anchor="middle">इन विषयों पर केवल</text>
    <text x="148" y="400" fill="#fbbf24" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">राज्य सरकारें कानून बनाती हैं।</text>
  </g>

  <!-- 3. Concurrent List & Residuary -->
  <g transform="translate(740, 125)" filter="url(#shadow4)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <rect x="0" y="0" width="320" height="50" rx="16" fill="#059669"/>
    <text x="160" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="21" font-weight="900" text-anchor="middle">3. समवर्ती व बाकी विषय</text>

    <text x="15" y="85" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold">साझा विषय (केंद्र + राज्य दोनों):</text>
    <text x="15" y="120" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• शिक्षा (Education), वन (Forests)</text>
    <text x="15" y="150" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• मजदूर संघ (Trade Unions)</text>
    <text x="15" y="180" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16">• विवाह व गोद लेना (Marriage)</text>
    <text x="15" y="215" fill="#a7f3d0" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">• बाकी विषय: कम्प्यूटर/IT (केंद्र)</text>

    <rect x="12" y="300" width="296" height="170" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="148" y="335" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">🎯 टकराव की स्थिति:</text>
    <text x="148" y="370" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" text-anchor="middle">टकराव होने पर केवल</text>
    <text x="148" y="400" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">केंद्र का कानून मान्य होगा।</text>
  </g>
</svg>