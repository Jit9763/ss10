<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#052e16"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#22c55e" stroke-width="4"/>

  <!-- Title -->
  <rect x="100" y="25" width="800" height="55" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    मेघालय की 200 वर्ष पुरानी बांस ड्रिप सिंचाई प्रणाली (Bamboo Drip Irrigation)
  </text>

  <!-- Left: Visual Illustration of Bamboo Network -->
  <g transform="translate(60, 105)">
    <rect width="420" height="370" rx="14" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    
    <!-- Mountain Spring Stream -->
    <path d="M 40 40 Q 100 80 150 70" stroke="#38bdf8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="100" y="30" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#7dd3fc">पहाड़ी झरना (18-20 ली./मिनट)</text>

    <!-- Connected Bamboo Pipes -->
    <!-- Bamboo 1 -->
    <line x1="140" y1="70" x2="260" y2="120" stroke="#84cc16" stroke-width="12" stroke-linecap="round"/>
    <circle cx="200" cy="95" r="4" fill="#3f6212"/>
    <!-- Bamboo 2 -->
    <line x1="255" y1="120" x2="360" y2="180" stroke="#84cc16" stroke-width="10" stroke-linecap="round"/>
    <!-- Bamboo 3 Sub Branches -->
    <line x1="355" y1="180" x2="280" y2="250" stroke="#84cc16" stroke-width="8" stroke-linecap="round"/>
    <line x1="355" y1="180" x2="390" y2="250" stroke="#84cc16" stroke-width="8" stroke-linecap="round"/>

    <!-- Plant Roots & Drops -->
    <circle cx="280" cy="300" r="18" fill="#15803d"/>
    <line x1="280" y1="255" x2="280" y2="280" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,3"/>
    <text x="280" y="335" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">पान/काली मिर्च पौधा</text>
    <text x="280" y="355" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">20-80 बूंदें/मिनट</text>

    <circle cx="390" cy="300" r="18" fill="#15803d"/>
    <line x1="390" y1="255" x2="390" y2="280" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,3"/>
  </g>

  <!-- Right: Detailed NCERT Facts -->
  <g transform="translate(520, 105)">
    <rect width="420" height="370" rx="14" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <text x="210" y="40" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#fde047" text-anchor="middle">🎋 बांस ड्रिप प्रणाली के मुख्य तथ्य</text>
    
    <text x="20" y="80" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• <b>प्राचीनता:</b> मेघालय में यह प्रणाली <b>200 वर्षों</b></text>
    <text x="20" y="110" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">  से भी अधिक समय से प्रचलित है।</text>
    
    <text x="20" y="150" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• <b>पानी का परिवहन:</b> बांस के पाइपों द्वारा झरने</text>
    <text x="20" y="180" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">  का 18-20 लीटर पानी सैकड़ों मीटर दूर ले जाते हैं।</text>
    
    <text x="20" y="220" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• <b>अंतिम छोर पर पानी:</b> पौधों की जड़ों पर</text>
    <text x="20" y="250" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">  घटाकर <b>20 से 80 बूंद प्रति मिनट</b> किया जाता है।</text>
    
    <text x="20" y="290" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• <b>मुख्य फसलें:</b> पान (Betel leaf), सुपारी व</text>
    <text x="20" y="320" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">  काली मिर्च के बागानों की सिंचाई।</text>

    <rect x="20" y="335" width="380" height="25" rx="6" fill="#166534"/>
    <text x="210" y="353" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="900" fill="#bbf7d0" text-anchor="middle">बिना किसी मोटर या बिजली के केवल गुरुत्वाकर्षण द्वारा संचालन</text>
  </g>

  <!-- Bottom Alert -->
  <text x="500" y="520" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#dcfce7" text-anchor="middle">
    📌 शून्य ऊर्जा खपत एवं पर्यावरण अनुकूल जल संरक्षण का विश्व प्रसिद्ध भारतीय मॉडल।
  </text>
</svg>