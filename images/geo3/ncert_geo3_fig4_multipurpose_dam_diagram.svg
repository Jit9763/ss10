<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#0f172a"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#3b82f6" stroke-width="4"/>

  <!-- Title -->
  <rect x="120" y="25" width="760" height="55" rx="14" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    बहुउद्देशीय बांध की आंतरिक संरचना एवं जलविद्युत उत्पादन
  </text>

  <!-- Reservoir (Left Side) -->
  <path d="M 40 180 L 380 180 L 380 480 L 40 480 Z" fill="#0284c7"/>
  <path d="M 40 180 Q 200 170 380 180" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <text x="210" y="240" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">जलाशय (Reservoir / झील)</text>
  <text x="210" y="270" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#e0f2fe" text-anchor="middle">संग्रहित जल (स्थितिज ऊर्जा)</text>

  <!-- Dam Wall (Concrete Cross Section) -->
  <polygon points="380,140 440,140 600,480 380,480" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
  <text x="440" y="280" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff" transform="rotate(65 440 280)">कंक्रीट बांध की दीवार (Dam Wall)</text>

  <!-- Intake & Penstock -->
  <rect x="360" y="320" width="30" height="40" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="345" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#fbbf24">जल प्रवेश द्वार</text>
  <polygon points="390,330 630,420 630,460 390,370" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
  <text x="500" y="390" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#7dd3fc" transform="rotate(20 500 390)">पेनस्टॉक (Penstock)</text>

  <!-- Power House & Turbine -->
  <rect x="630" y="380" width="160" height="100" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="680" cy="440" r="22" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <text x="680" y="446" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">⚙️</text>
  <text x="710" y="415" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff">पावर हाउस</text>
  <text x="710" y="445" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#93c5fd">टरबाइन + जनरेटर</text>

  <!-- Outflow River & Canal -->
  <path d="M 790 440 L 960 440 L 960 480 L 790 480 Z" fill="#0369a1"/>
  <text x="875" y="465" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">नदी व सिंचाई नहर</text>

  <!-- Power Lines -->
  <line x1="710" y1="380" x2="710" y2="280" stroke="#f59e0b" stroke-width="4"/>
  <line x1="710" y1="280" x2="920" y2="220" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="850" y="190" width="110" height="40" rx="8" fill="#d97706"/>
  <text x="905" y="217" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">⚡ राष्ट्रीय ग्रिड</text>

  <!-- Spillway Label -->
  <rect x="420" y="100" width="160" height="35" rx="6" fill="#0284c7"/>
  <text x="500" y="124" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">स्पिलवे (अतिरिक्त जल)</text>

  <!-- Bottom Explanatory Box -->
  <rect x="40" y="495" width="920" height="40" rx="8" fill="#1e293b"/>
  <text x="500" y="522" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#93c5fd" text-anchor="middle">
    💡 बांध का मुख्य उद्देश्य जल रोकना व नियंत्रित छोड़ना है; जलविद्युत, बाढ़ नियंत्रण व सिंचाई इसके मुख्य बहुउद्देश्य हैं।
  </text>
</svg>