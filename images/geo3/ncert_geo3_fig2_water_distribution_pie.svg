<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#0f172a"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#0ea5e9" stroke-width="4"/>

  <!-- Title -->
  <rect x="120" y="25" width="760" height="55" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    पृथ्वी पर कुल जल का वितरण (NCERT Global Water Distribution)
  </text>

  <!-- Left Pie Chart: Total Global Water -->
  <g transform="translate(260, 290)">
    <!-- 96.5% Saline Water (Circle almost full) -->
    <circle cx="0" cy="0" r="150" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <!-- 2.5% Fresh Water Slice -->
    <path d="M 0 0 L 150 0 A 150 150 0 0 1 146 35 Z" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="10" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">96.5%</text>
    <text x="0" y="40" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#e0f2fe" text-anchor="middle">महासागरीय लवणीय जल</text>
    
    <!-- Pointer to Fresh Water -->
    <line x1="140" y1="20" x2="200" y2="40" stroke="#22c55e" stroke-width="3"/>
    <rect x="170" y="45" width="160" height="40" rx="8" fill="#15803d"/>
    <text x="250" y="72" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">अलवणीय (2.5%)</text>
  </g>

  <!-- Right Chart: Freshwater Breakdown -->
  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="270" height="320" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="135" y="40" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">2.5% अलवणीय जल का विभाजन</text>
    
    <!-- Item 1: Glaciers (70%) -->
    <rect x="20" y="65" width="230" height="65" rx="10" fill="#0284c7"/>
    <text x="35" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff">🏔️ हिमनद व बर्फ: 70%</text>
    <text x="35" y="118" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#e0f2fe">अंटार्कटिका, ग्रीनलैंड व पर्वत</text>

    <!-- Item 2: Groundwater (30%) -->
    <rect x="20" y="145" width="230" height="65" rx="10" fill="#16a34a"/>
    <text x="35" y="175" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff">💧 भौम जल: लगभग 30%</text>
    <text x="35" y="198" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#dcfce7">कुओं, नलकूपों व जलभरों में</text>

    <!-- Item 3: Rivers & Lakes (<1%) -->
    <rect x="20" y="225" width="230" height="65" rx="10" fill="#d97706"/>
    <text x="35" y="255" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff">🌊 नदियां, झीलें: &lt; 1%</text>
    <text x="35" y="278" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#fef3c7">प्रत्यक्ष मानव उपयोग हेतु उपलब्ध</text>
  </g>

  <!-- Bottom Alert Bar -->
  <rect x="60" y="480" width="880" height="50" rx="12" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="500" y="513" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fee2e2" text-anchor="middle">
    ⚠️ भारत विश्व की कुल वर्षा का मात्र 4% प्राप्त करता है तथा प्रति व्यक्ति जल उपलब्धता में 133वें स्थान पर है।
  </text>
</svg>