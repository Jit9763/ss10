<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#450a0a"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#ef4444" stroke-width="4"/>

  <!-- Title -->
  <rect x="100" y="25" width="800" height="55" rx="14" fill="#991b1b" stroke="#f87171" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    बड़े बांधों के पर्यावरणीय, पारिस्थितिक एवं सामाजिक दुष्प्रभाव
  </text>

  <!-- 4 Negative Impact Cards -->
  <!-- 1. Riverbed Sedimentation -->
  <g transform="translate(60, 110)">
    <rect width="410" height="175" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="20" y="40" font-family="'Segoe UI', Arial" font-size="22">🛑</text>
    <text x="55" y="38" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fca5a5">1. नदियों के प्राकृतिक बहाव में रुकावट</text>
    <text x="20" y="75" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• तलछट (Sediment) का जलाशय तलहटी में जमाव।</text>
    <text x="20" y="105" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• नदी तल का अधिक पथरीला (rockier) होना।</text>
    <text x="20" y="135" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• जलीय जीवों के अंडे देने व प्रवास (Spawning) में बाधा।</text>
  </g>

  <!-- 2. Submergence of Forests -->
  <g transform="translate(530, 110)">
    <rect width="410" height="175" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="20" y="40" font-family="'Segoe UI', Arial" font-size="22">🌲</text>
    <text x="55" y="38" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fca5a5">2. वनों व उपजाऊ भूमि का जलमग्न होना</text>
    <text x="20" y="75" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• विशाल प्राकृतिक वन व वनस्पतिजात का डूबना।</text>
    <text x="20" y="105" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• जलमग्न वनस्पति के सड़ने से मीथेन गैस उत्सर्जन।</text>
    <text x="20" y="135" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• बाढ़ के मैदानों की प्राकृतिक उर्वरता में कमी।</text>
  </g>

  <!-- 3. Displacement & Social Injustice -->
  <g transform="translate(60, 310)">
    <rect width="410" height="175" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="20" y="40" font-family="'Segoe UI', Arial" font-size="22">🏚️</text>
    <text x="55" y="38" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fca5a5">3. स्थानीय समुदायों का भारी विस्थापन</text>
    <text x="20" y="75" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• जनजातीय व स्थानीय किसानों की जमीन छीनना।</text>
    <text x="20" y="105" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• विस्थापितों को उचित पुनर्वास व मुआवजा न मिलना।</text>
    <text x="20" y="135" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• "बलिदान हम दें और लाभ उद्योगपतियों को मिले।"</text>
  </g>

  <!-- 4. Soil Salinization & Interstate Disputes -->
  <g transform="translate(530, 310)">
    <rect width="410" height="175" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="20" y="40" font-family="'Segoe UI', Arial" font-size="22">⚔️</text>
    <text x="55" y="38" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fca5a5">4. मृदा लवणीकरण व अंतर्राज्यीय विवाद</text>
    <text x="20" y="75" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• अत्यधिक नहरी सिंचाई से भूमि में लवणीकरण।</text>
    <text x="20" y="105" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• राज्यों के मध्य जल बँटवारे को लेकर कड़वाहट।</text>
    <text x="20" y="135" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• उदाहरण: कावेरी विवाद, कृष्णा-गोदावरी विवाद।</text>
  </g>

  <!-- Bottom Alert -->
  <text x="500" y="525" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#fecaca" text-anchor="middle">
    ⚠️ विडंबना: बाढ़ नियंत्रण हेतु बनाए गए बांधों की तलहटी में गाद भर जाने से ये स्वयं विनाशकारी बाढ़ का कारण बने।
  </text>
</svg>