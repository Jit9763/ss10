<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#0f172a"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Title -->
  <rect x="100" y="25" width="800" height="55" rx="14" fill="#0284c7" stroke="#7dd3fc" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    समन्वित जल संसाधन प्रबंधन (Integrated Water Resources Management - IWRM)
  </text>

  <!-- Center Circle -->
  <circle cx="500" cy="290" r="85" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
  <text x="500" y="280" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">जल संरक्षण के</text>
  <text x="500" y="310" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#fef08a" text-anchor="middle">5 मूल स्तंभ</text>

  <!-- 5 Surrounding Pillars -->
  <!-- 1. Rainwater Harvesting -->
  <g transform="translate(60, 110)">
    <rect width="250" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="35" font-family="'Segoe UI', Arial" font-size="22">🌧️</text>
    <text x="50" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#38bdf8">1. वर्षा जल संग्रहण</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#ffffff">रूफटॉप, टांका, जोहड़ व चेक डैम।</text>
  </g>

  <!-- 2. Micro Irrigation (Drip/Sprinkler) -->
  <g transform="translate(690, 110)">
    <rect width="250" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="35" font-family="'Segoe UI', Arial" font-size="22">💧</text>
    <text x="50" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#38bdf8">2. सूक्ष्म सिंचाई तकनीक</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#ffffff">ड्रिप व फव्वारा सिंचाई से 60% बचत।</text>
  </g>

  <!-- 3. Wastewater Recycling & Reuse -->
  <g transform="translate(50, 240)">
    <rect width="250" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="35" font-family="'Segoe UI', Arial" font-size="22">♻️</text>
    <text x="50" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#38bdf8">3. अपशिष्ट जल पुनर्चक्रण</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#ffffff">सीवेज शोधन व औद्योगिक पुनःउपयोग।</text>
  </g>

  <!-- 4. Afforestation & Watershed -->
  <g transform="translate(700, 240)">
    <rect width="250" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="35" font-family="'Segoe UI', Arial" font-size="22">🌳</text>
    <text x="50" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#38bdf8">4. वनीकरण व जलागम</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#ffffff">मृदा अपरदन रोकथाम व भूजल पुनर्भरण।</text>
  </g>

  <!-- 5. Public Awareness & Laws -->
  <g transform="translate(370, 390)">
    <rect width="260" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="35" font-family="'Segoe UI', Arial" font-size="22">📢</text>
    <text x="50" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#38bdf8">5. जन-जागरूकता व कानून</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#ffffff">जल अपव्यय रोकथाम व सामुदायिक सहभागिता।</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="50" y="495" width="900" height="45" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="500" y="525" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">
    💧 "जल ही जीवन है और इसका विवेकपूर्ण संरक्षण ही हमारे सतत विकास की गारंटी है।"
  </text>
</svg>