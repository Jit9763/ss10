<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#042f2e"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#14b8a6" stroke-width="4"/>

  <!-- Title -->
  <rect x="120" y="25" width="760" height="55" rx="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    जल दुर्लभता के 4 मुख्य कारक (Causes of Water Scarcity)
  </text>

  <!-- 4 Cards Grid -->
  <!-- Card 1: Population -->
  <g transform="translate(60, 110)">
    <rect width="410" height="180" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="50" cy="45" r="28" fill="#0f766e"/>
    <text x="50" y="55" font-family="'Segoe UI', Arial" font-size="24" text-anchor="middle">👥</text>
    <text x="95" y="52" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#5eead4">1. तीव्र जनसंख्या वृद्धि</text>
    <text x="25" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• घरेलू आवश्यकताओं व भोजन हेतु अत्यधिक मांग।</text>
    <text x="25" y="125" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• प्रति व्यक्ति जल उपलब्धता में निरंतर गिरावट।</text>
    <text x="25" y="155" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• जल का असमान वितरण व अत्यधिक दोहन।</text>
  </g>

  <!-- Card 2: Intensive Agriculture -->
  <g transform="translate(530, 110)">
    <rect width="410" height="180" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="50" cy="45" r="28" fill="#0f766e"/>
    <text x="50" y="55" font-family="'Segoe UI', Arial" font-size="24" text-anchor="middle">🌾</text>
    <text x="95" y="52" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#5eead4">2. सघन कृषि एवं नलकूप</text>
    <text x="25" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• शुष्क ऋतु में फसलों हेतु अत्यधिक भूमिगत जल दोहन।</text>
    <text x="25" y="125" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• अधिक जल चाहने वाली फसलें (धान, गन्ना)।</text>
    <text x="25" y="155" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• भूजल स्तर (Water Table) में खतरनाक गिरावट।</text>
  </g>

  <!-- Card 3: Urbanization & Industry -->
  <g transform="translate(60, 315)">
    <rect width="410" height="180" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="50" cy="45" r="28" fill="#0f766e"/>
    <text x="50" y="55" font-family="'Segoe UI', Arial" font-size="24" text-anchor="middle">🏭</text>
    <text x="95" y="52" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#5eead4">3. औद्योगीकरण व शहरीकरण</text>
    <text x="25" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• उद्योगों द्वारा भारी मात्रा में जल व ऊर्जा की खपत।</text>
    <text x="25" y="125" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• भारत में कुल विद्युत का 22% जलविद्युत से।</text>
    <text x="25" y="155" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• शहरों की बहुमंजिला हाउसिंग सोसायटियों में नलकूप।</text>
  </g>

  <!-- Card 4: Water Quality Degradation -->
  <g transform="translate(530, 315)">
    <rect width="410" height="180" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="50" cy="45" r="28" fill="#0f766e"/>
    <text x="50" y="55" font-family="'Segoe UI', Arial" font-size="24" text-anchor="middle">☣️</text>
    <text x="95" y="52" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#5eead4">4. जल की खराब गुणवत्ता व प्रदूषण</text>
    <text x="25" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• घरेलू व औद्योगिक अपशिष्टों का नदियों में बहाव।</text>
    <text x="25" y="125" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• रासायनिक खाद व कीटनाशकों से भूजल जहरीला।</text>
    <text x="25" y="155" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="700" fill="#ffffff">• जल प्रचुर मात्रा में उपलब्ध होने पर भी अनुपयोगी।</text>
  </g>

  <!-- Bottom Note -->
  <text x="500" y="525" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ccfbf1" text-anchor="middle">
    📌 फॉल्कनमार्क सूचकांक: प्रति व्यक्ति प्रति वर्ष 1000 m³ से कम जल उपलब्धता होने पर क्षेत्र जल-संकटग्रस्त कहलाता है।
  </text>
</svg>