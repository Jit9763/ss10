<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#1e3a5f"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#60a5fa" stroke-width="4"/>

  <!-- Title -->
  <rect x="100" y="25" width="800" height="55" rx="14" fill="#1e40af" stroke="#93c5fd" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    कृषि-जल संग्रहण: जैसलमेर के 'खादीन' एवं राजस्थान के 'जोहड़'
  </text>

  <!-- Left: Khadin Structure -->
  <g transform="translate(60, 105)">
    <rect width="420" height="370" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="40" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">🌾 जैसलमेर की 'खादीन' (Khadin)</text>
    
    <!-- Hill Slope to Bund Diagram -->
    <polygon points="20,100 120,60 180,100" fill="#475569"/>
    <text x="100" y="125" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="14" font-weight="700" fill="#94a3b8">पहाड़ी ढलान (Catchment)</text>

    <!-- Water Retention & Mud Bund -->
    <path d="M 120 160 L 300 160 L 320 210 L 100 210 Z" fill="#0284c7"/>
    <polygon points="290,140 330,140 360,220 280,220" fill="#78350f" stroke="#d97706" stroke-width="2"/>
    <text x="325" y="130" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="900" fill="#fbbf24">मिट्टी का बांध (Bund)</text>

    <text x="20" y="250" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• <b>कार्यप्रणाली:</b> ढलान वाले कृषि क्षेत्र में मिट्टी</text>
    <text x="20" y="280" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">  का मजबूत बांध बनाकर वर्षा जल को रोकते हैं।</text>
    <text x="20" y="315" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• पानी सूखने पर संरक्षित नमी में रबी फसल</text>
    <text x="20" y="345" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">  (गेहूं/चना) उगाई जाती है।</text>
  </g>

  <!-- Right: Johad Structure -->
  <g transform="translate(520, 105)">
    <rect width="420" height="370" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="40" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">💧 राजस्थान के 'जोहड़' (Johad)</text>
    
    <!-- Johad Pond Diagram -->
    <ellipse cx="210" cy="110" rx="160" ry="40" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
    <text x="210" y="115" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">वर्षा जल संचयन तालाब (जोहड़)</text>

    <text x="20" y="185" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• <b>क्षेत्र:</b> अलवर एवं मध्य-पूर्वी राजस्थान।</text>
    <text x="20" y="215" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• <b>उद्देश्य:</b> छोटे चेक-डैम व कच्चे तालाब</text>
    <text x="20" y="245" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">  बनाकर भूजल (Groundwater) का पुनर्भरण।</text>
    
    <text x="20" y="280" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">• <b>राजेंद्र सिंह (जल पुरुष / Water Man):</b></text>
    <text x="20" y="310" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">  तरुण भारत संघ द्वारा हजारों जोहड़ बनाकर</text>
    <text x="20" y="340" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">  अरवरी व रूपारेल सूखी नदियों को पुनर्जीवित किया।</text>
  </g>

  <!-- Bottom Alert -->
  <text x="500" y="520" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#e0f2fe" text-anchor="middle">
    📌 पश्चिमी हिमालय में पर्वतीय जलधाराओं को खेतों तक ले जाने के लिए 'गुल' (Gul) अथवा 'कुल' (Kul) बनाई जाती हैं।
  </text>
</svg>