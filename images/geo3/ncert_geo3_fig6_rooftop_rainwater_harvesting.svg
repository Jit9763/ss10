<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#0c4a6e"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Title -->
  <rect x="120" y="20" width="760" height="50" rx="12" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/>
  <text x="500" y="54" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
    छत वर्षा जल संग्रहण प्रणाली (Rooftop Rainwater Harvesting System)
  </text>

  <!-- House Diagram -->
  <!-- Slanted Roof -->
  <polygon points="120,200 320,110 520,200" fill="#b91c1c" stroke="#f87171" stroke-width="3"/>
  <rect x="160" y="200" width="320" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="270" y="320" width="60" height="120" fill="#78350f"/> <!-- Door -->
  <rect x="190" y="240" width="50" height="50" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/> <!-- Window -->
  <rect x="400" y="240" width="50" height="50" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>

  <!-- Rain Clouds & Rain Falling on Roof -->
  <path d="M 180 90 q 20 -30 50 -20 q 30 -30 60 0 q 40 0 40 30 q 10 30 -30 30 h -100 q -30 0 -20 -40 z" fill="#64748b"/>
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4">
    <line x1="220" y1="100" x2="200" y2="150"/>
    <line x1="260" y1="100" x2="240" y2="150"/>
    <line x1="300" y1="100" x2="280" y2="150"/>
    <line x1="340" y1="100" x2="320" y2="150"/>
  </g>

  <!-- Rainwater Gutter & PVC Pipe -->
  <rect x="470" y="195" width="20" height="15" fill="#1e293b"/>
  <path d="M 480 205 L 560 205 L 560 380 L 620 380" stroke="#0284c7" stroke-width="8" fill="none"/>
  <text x="570" y="280" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#bae6fd" transform="rotate(90 570 280)">PVC पाइप द्वारा प्रवाह</text>

  <!-- Filter Chamber -->
  <rect x="620" y="340" width="80" height="80" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="375" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">रेत व बजरी</text>
  <text x="660" y="400" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">फ़िल्टर</text>

  <!-- Underground Storage Tank (Tanka) -->
  <rect x="740" y="320" width="200" height="180" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
  <rect x="750" y="370" width="180" height="120" rx="8" fill="#0284c7"/>
  <text x="840" y="355" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">भूमिगत टांका (Tank)</text>
  <text x="840" y="420" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">💧 पार्लर पानी</text>
  <text x="840" y="450" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="15" font-weight="700" fill="#bae6fd" text-anchor="middle">पीने का शुद्धतम जल</text>

  <!-- Connect Filter to Tank -->
  <line x1="700" y1="380" x2="740" y2="380" stroke="#38bdf8" stroke-width="8"/>

  <!-- Left Info Step Badges -->
  <g transform="translate(40, 450)">
    <rect width="660" height="85" rx="10" fill="#075985" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="30" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#fde047">1. छत पर जल संग्रहण ➔ 2. पाइप व निस्पंदन (फ़िल्टर) ➔ 3. भूमिगत टांका/कुआं पुनर्भरण</text>
    <text x="20" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff">📌 <b>तमिलनाडु:</b> भारत का पहला राज्य जहाँ हर घर में छत वर्षा जल संग्रहण अनिवार्य (कानूनन) है।</text>
  </g>
</svg>