<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#1e1b4b"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#6366f1" stroke-width="4"/>

  <!-- Title -->
  <rect x="120" y="25" width="760" height="55" rx="14" fill="#4338ca" stroke="#818cf8" stroke-width="3"/>
  <text x="500" y="62" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    जल प्रदूषण के स्रोत एवं नदियां जहरीली होने की प्रक्रिया
  </text>

  <!-- River Flow with Pollution Inflow -->
  <path d="M 50 350 Q 300 280 500 350 T 950 350 L 950 500 L 50 500 Z" fill="#0f766e"/>
  <path d="M 50 350 Q 300 280 500 350 T 950 350" stroke="#14b8a6" stroke-width="6" fill="none"/>

  <!-- 3 Major Pollution Pipes -->
  <!-- 1. Industrial Effluent -->
  <g transform="translate(100, 110)">
    <rect width="240" height="150" rx="12" fill="#312e81" stroke="#f43f5e" stroke-width="2"/>
    <text x="120" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fda4af" text-anchor="middle">🏭 औद्योगिक रासायनिक कचरा</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• चमड़ा, कपड़ा, रसायन उद्योग</text>
    <text x="15" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• सीसा, पारा, आर्सेनिक भारी धातुएं</text>
    <text x="15" y="120" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• बिना शोधन सीधे नदियों में</text>
    
    <!-- Pipe to river -->
    <rect x="100" y="150" width="40" height="120" fill="#475569"/>
    <path d="M 105 270 L 135 270 L 120 330 Z" fill="#e11d48"/>
  </g>

  <!-- 2. Urban Sewage -->
  <g transform="translate(380, 110)">
    <rect width="240" height="150" rx="12" fill="#312e81" stroke="#fbbf24" stroke-width="2"/>
    <text x="120" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle">🏙️ नगरीय सीवेज व कचरा</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• अपशिष्ट जल व ठोस प्लास्टिक</text>
    <text x="15" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• सीवेज ट्रीटमेंट प्लांट की कमी</text>
    <text x="15" y="120" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• बायोकेमिकल ऑक्सीजन डिमांड (BOD) वृद्धि</text>

    <!-- Pipe to river -->
    <rect x="100" y="150" width="40" height="120" fill="#475569"/>
    <path d="M 105 270 L 135 270 L 120 330 Z" fill="#d97706"/>
  </g>

  <!-- 3. Agricultural Runoff -->
  <g transform="translate(660, 110)">
    <rect width="240" height="150" rx="12" fill="#312e81" stroke="#4ade80" stroke-width="2"/>
    <text x="120" y="35" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#bbf7d0" text-anchor="middle">🌾 कीटनाशक व उर्वरक</text>
    <text x="15" y="70" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• यूरिया व फॉस्फेट का रिसाव</text>
    <text x="15" y="95" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• यूट्रोफिकेशन (शैवाल प्रस्फुटन)</text>
    <text x="15" y="120" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">• भूजल में नाइट्रेट संदूषण</text>

    <!-- Pipe to river -->
    <rect x="100" y="150" width="40" height="120" fill="#475569"/>
    <path d="M 105 270 L 135 270 L 120 330 Z" fill="#16a34a"/>
  </g>

  <!-- River Text Info -->
  <text x="500" y="440" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
    ⚠️ परिणाम: गंगा एवं यमुना जैसी पवित्र नदियां कई हिस्सों में 'जैव-मृत' (Biologically Dead) हो चुकी हैं।
  </text>
</svg>