<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1000" height="560" fill="url(#skyGrad)"/>
  
  <!-- Outer Projector Border -->
  <rect x="10" y="10" width="980" height="540" rx="16" fill="none" stroke="#0369a1" stroke-width="5"/>
  <rect x="20" y="20" width="960" height="520" rx="12" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="150" y="30" width="700" height="55" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/>
  <text x="500" y="67" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    NCERT जल चक्र (Hydrological Cycle) - जल एक नवीकरण योग्य संसाधन
  </text>

  <!-- Mountains -->
  <polygon points="500,420 680,180 820,420" fill="url(#mountainGrad)"/>
  <polygon points="680,180 650,230 680,240 710,230" fill="#ffffff"/> <!-- Snow cap -->
  <polygon points="720,420 860,220 990,420" fill="#14532d"/>
  <polygon points="860,220 835,260 860,270 885,260" fill="#ffffff"/>

  <!-- Land & Underground -->
  <rect x="20" y="420" width="960" height="120" fill="#78350f"/>
  <rect x="20" y="400" width="600" height="30" fill="#22c55e"/> <!-- Grass -->

  <!-- Ocean -->
  <path d="M 20 420 Q 150 400 300 420 L 300 540 L 20 540 Z" fill="url(#oceanGrad)"/>
  <path d="M 30 435 Q 120 425 280 435" stroke="#7dd3fc" stroke-width="3" fill="none"/>
  <path d="M 40 460 Q 140 450 260 460" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <text x="140" y="500" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">महासागर (Ocean)</text>

  <!-- River Stream -->
  <path d="M 680 240 Q 600 340 450 390 T 290 430" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <text x="520" y="380" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#0c4a6e">सतही अपवाह (River Runoff)</text>

  <!-- Sun -->
  <circle cx="120" cy="150" r="45" fill="#f59e0b" stroke="#fef08a" stroke-width="5"/>
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="90" x2="120" y2="70"/>
    <line x1="120" y1="210" x2="120" y2="230"/>
    <line x1="60" y1="150" x2="40" y2="150"/>
    <line x1="180" y1="150" x2="200" y2="150"/>
    <line x1="75" y1="105" x2="60" y2="90"/>
    <line x1="165" y1="195" x2="180" y2="210"/>
    <line x1="75" y1="195" x2="60" y2="210"/>
    <line x1="165" y1="105" x2="180" y2="90"/>
  </g>
  <text x="120" y="157" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">सूर्य ताप</text>

  <!-- Clouds -->
  <!-- Evaporation Cloud -->
  <path d="M 280 180 q 20 -30 50 -20 q 30 -30 60 0 q 40 0 40 30 q 10 30 -30 30 h -100 q -30 0 -20 -40 z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rain Cloud -->
  <path d="M 580 140 q 30 -40 70 -30 q 40 -40 80 0 q 50 0 50 40 q 20 40 -40 40 h -130 q -40 0 -30 -50 z" fill="#475569" stroke="#334155" stroke-width="3"/>
  <text x="690" y="145" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">संघनन (Condensation)</text>

  <!-- Rain Arrows -->
  <g stroke="#0284c7" stroke-width="3" stroke-dasharray="8,6">
    <line x1="620" y1="200" x2="600" y2="270"/>
    <line x1="660" y1="200" x2="640" y2="270"/>
    <line x1="700" y1="200" x2="680" y2="270"/>
    <line x1="740" y1="200" x2="720" y2="270"/>
  </g>
  <rect x="730" y="240" width="180" height="40" rx="8" fill="#1e3a8a"/>
  <text x="820" y="267" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">वर्षण (Precipitation)</text>

  <!-- Evaporation Arrows -->
  <g stroke="#ea580c" stroke-width="4" stroke-linecap="round">
    <path d="M 180 380 Q 200 320 220 250" fill="none" marker-end="url(#arrow)"/>
    <path d="M 230 380 Q 250 320 270 250" fill="none"/>
  </g>
  <polygon points="220,240 210,258 230,258" fill="#ea580c"/>
  <polygon points="270,240 260,258 280,258" fill="#ea580c"/>
  <rect x="130" y="300" width="190" height="40" rx="8" fill="#c2410c"/>
  <text x="225" y="327" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">वाष्पीकरण (Evaporation)</text>

  <!-- Underground Water -->
  <text x="450" y="470" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="22" font-weight="900" fill="#fef08a">अंतःस्यंदन (Infiltration)</text>
  <text x="450" y="505" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#ffffff">भौम जल संचयन (Groundwater Storage)</text>
  <path d="M 600 480 L 320 480" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10,6"/>
  <polygon points="310,480 325,472 325,488" fill="#38bdf8"/>
</svg>