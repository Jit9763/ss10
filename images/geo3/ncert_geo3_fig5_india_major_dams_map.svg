<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="16" fill="#0f172a"/>
  <rect x="10" y="10" width="980" height="540" rx="14" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Title -->
  <rect x="120" y="20" width="760" height="50" rx="12" fill="#0284c7" stroke="#7dd3fc" stroke-width="3"/>
  <text x="500" y="54" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
    भारत के प्रमुख बांध एवं बहुउद्देशीय नदी घाटी परियोजनाएं
  </text>

  <!-- Map Representation Outline & Dam Nodes -->
  <!-- Left Column Dams -->
  <g transform="translate(40, 85)">
    <!-- Bhakra Nangal -->
    <rect x="0" y="0" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="40" r="18" fill="#0284c7"/>
    <text x="35" y="47" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <text x="70" y="32" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">भाखड़ा नांगल बांध (Bhakra Nangal)</text>
    <text x="70" y="58" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: सतलुज-ब्यास | राज्य: पंजाब-हिमाचल</text>

    <!-- Tehri Dam -->
    <rect x="0" y="90" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="130" r="18" fill="#0284c7"/>
    <text x="35" y="137" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <text x="70" y="122" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">टिहरी बांध (Tehri Dam - भारत का सबसे ऊंचा)</text>
    <text x="70" y="148" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: भागीरथी | राज्य: उत्तराखंड (260.5 मी.)</text>

    <!-- Rana Pratap Sagar -->
    <rect x="0" y="180" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="220" r="18" fill="#0284c7"/>
    <text x="35" y="227" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <text x="70" y="212" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">राणा प्रताप / गांधी सागर (Chambal)</text>
    <text x="70" y="238" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: चंबल | राज्य: राजस्थान एवं मध्य प्रदेश</text>

    <!-- Sardar Sarovar -->
    <rect x="0" y="270" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="310" r="18" fill="#0284c7"/>
    <text x="35" y="317" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
    <text x="70" y="302" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">सरदार सरोवर बांध (Sardar Sarovar)</text>
    <text x="70" y="328" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: नर्मदा | राज्य: गुजरात, म.प्र., महा., राज.</text>
  </g>

  <!-- Right Column Dams -->
  <g transform="translate(530, 85)">
    <!-- Hirakud Dam -->
    <rect x="0" y="0" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="40" r="18" fill="#0284c7"/>
    <text x="35" y="47" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
    <text x="70" y="32" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">हीराकुंड बांध (Hirakud - सबसे लंबा बांध)</text>
    <text x="70" y="58" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: महानदी | राज्य: ओडिशा (लंबाई: 25.8 किमी)</text>

    <!-- Damodar Valley -->
    <rect x="0" y="90" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="130" r="18" fill="#0284c7"/>
    <text x="35" y="137" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">6</text>
    <text x="70" y="122" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">दामोदर घाटी निगम (DVC)</text>
    <text x="70" y="148" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: दामोदर | राज्य: झारखंड एवं प. बंगाल</text>

    <!-- Nagarjuna Sagar -->
    <rect x="0" y="180" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="220" r="18" fill="#0284c7"/>
    <text x="35" y="227" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>
    <text x="70" y="212" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">नागार्जुन सागर बांध (Nagarjuna Sagar)</text>
    <text x="70" y="238" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: कृष्णा | राज्य: आंध्र प्रदेश व तेलंगाना</text>

    <!-- Tungabhadra & Kaveri -->
    <rect x="0" y="270" width="430" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="310" r="18" fill="#0284c7"/>
    <text x="35" y="317" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">8</text>
    <text x="70" y="302" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#38bdf8">तुंगभद्रा / मेट्टूर बांध (South India)</text>
    <text x="70" y="328" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="16" font-weight="700" fill="#ffffff">नदी: तुंगभद्रा / कावेरी | राज्य: कर्नाटक, तमिलनाडु</text>
  </g>

  <!-- Bottom Map Legend Bar -->
  <rect x="40" y="450" width="920" height="85" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="480" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="middle">
    🗺️ परीक्षा में मानचित्र अभ्यास (Map Work): भाखड़ा, टिहरी, सरदार सरोवर व हीराकुंड बांध बार-बार पूछे जाते हैं।
  </text>
  <text x="500" y="515" font-family="'Segoe UI', 'Noto Sans Devanagari', Arial" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    दामोदर नदी को पहले 'बंगाल का शोक' कहा जाता था, बांध बनने के बाद बाढ़ पर काफी हद तक नियंत्रण हुआ।
  </text>
</svg>