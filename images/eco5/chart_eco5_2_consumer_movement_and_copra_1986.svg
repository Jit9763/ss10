<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- Title Gradient -->
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glowArrow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="680" rx="24" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2.5"/>
  
  <!-- Outer Glow Border -->
  <rect x="12" y="12" width="1176" height="656" rx="20" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Main Title Box (Large Font 32px) -->
  <g filter="url(#shadow2)">
    <rect x="40" y="24" width="1120" height="76" rx="16" fill="#090d16" stroke="#6366f1" stroke-width="3"/>
    <text x="600" y="73" fill="url(#titleGrad2)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="32" font-weight="900" text-anchor="middle">📊 उपभोक्ता आंदोलन का इतिहास एवं कोपरा (COPRA Timeline)</text>
  </g>

  <!-- Step 1: 1960s (Crimson Red) -->
  <g transform="translate(40, 125)" filter="url(#shadow2)">
    <rect width="252" height="520" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <rect x="0" y="0" width="252" height="60" rx="18" fill="#dc2626"/>
    <text x="126" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">1960 का दशक</text>
    
    <!-- Subtitle -->
    <rect x="12" y="74" width="228" height="38" rx="10" fill="#450a0a"/>
    <text x="126" y="100" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">🔥 उपभोक्ता असंतोष</text>
    
    <!-- Points (Bigger Fonts 18px & 16px) -->
    <text x="16" y="148" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• अत्यधिक जमाखोरी</text>
    <text x="16" y="174" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">व्यापारियों द्वारा स्टॉक छिपाना</text>
    
    <text x="16" y="214" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• खाद्य मिलावट</text>
    <text x="16" y="240" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">तेल व मसालों में जहरीले रसायन</text>
    
    <text x="16" y="280" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• कालाबाजारी व मुनाफाखोरी</text>
    <text x="16" y="306" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">एमआरपी से अधिक दाम वसूली</text>

    <!-- Bottom Highlight (Bigger Fonts 18px & 16px) -->
    <rect x="12" y="355" width="228" height="148" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="126" y="388" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">⚠️ स्थिति:</text>
    <text x="20" y="420" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">उपभोक्ताओं की सुरक्षा हेतु</text>
    <text x="20" y="446" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">कोई कानूनी संस्था या</text>
    <text x="20" y="472" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="900">अदालत उपलब्ध नहीं थी।</text>
  </g>

  <!-- Arrow 1-2 -->
  <g transform="translate(298, 360)">
    <path d="M 0 0 L 20 0 L 20 -8 L 34 6 L 20 20 L 20 12 L 0 12 Z" fill="#f59e0b" filter="url(#glowArrow)"/>
  </g>

  <!-- Step 2: 1970s (Amber Gold) -->
  <g transform="translate(336, 125)" filter="url(#shadow2)">
    <rect width="252" height="520" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <rect x="0" y="0" width="252" height="60" rx="18" fill="#d97706"/>
    <text x="126" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">1970 का दशक</text>
    
    <!-- Subtitle -->
    <rect x="12" y="74" width="228" height="38" rx="10" fill="#451a03"/>
    <text x="126" y="100" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">✊ संगठित आंदोलन</text>
    
    <!-- Points (Bigger Fonts 18px & 16px) -->
    <text x="16" y="148" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• उपभोक्ता समूहों का गठन</text>
    <text x="16" y="174" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">स्थानीय स्तर पर नागरिक समूह</text>
    
    <text x="16" y="214" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• राशन दुकानों की निगरानी</text>
    <text x="16" y="240" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">वितरण प्रणाली पर निगरानी</text>
    
    <text x="16" y="280" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• पत्रिकाओं में लेख व प्रदर्शन</text>
    <text x="16" y="306" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">जनमत तैयार करने का प्रयास</text>

    <!-- Bottom Highlight (Bigger Fonts 18px & 16px) -->
    <rect x="12" y="355" width="228" height="148" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="126" y="388" fill="#fbbf24" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">📣 प्रभाव:</text>
    <text x="20" y="420" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">भारत सरकार पर नया</text>
    <text x="20" y="446" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">उपभोक्ता सुरक्षा कानून</text>
    <text x="20" y="472" fill="#fbbf24" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="900">बनाने का चौतरफा दबाव।</text>
  </g>

  <!-- Arrow 2-3 -->
  <g transform="translate(594, 360)">
    <path d="M 0 0 L 20 0 L 20 -8 L 34 6 L 20 20 L 20 12 L 0 12 Z" fill="#10b981" filter="url(#glowArrow)"/>
  </g>

  <!-- Step 3: 1986 COPRA (Emerald Green) -->
  <g transform="translate(632, 125)" filter="url(#shadow2)">
    <rect width="252" height="520" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect x="0" y="0" width="252" height="60" rx="18" fill="#059669"/>
    <text x="126" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">1986 (COPRA)</text>
    
    <!-- Subtitle -->
    <rect x="12" y="74" width="228" height="38" rx="10" fill="#064e3b"/>
    <text x="126" y="100" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">⚖️ कोपरा कानून 1986</text>
    
    <!-- Points (Bigger Fonts 18px & 16px) -->
    <text x="16" y="148" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• संसद द्वारा पारित कानून</text>
    <text x="16" y="174" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">24 दिसंबर 1986 को स्वीकृत</text>
    
    <text x="16" y="214" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• राष्ट्रीय उपभोक्ता दिवस</text>
    <text x="16" y="240" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">प्रतिवर्ष 24 दिसंबर को दिवस</text>
    
    <text x="16" y="280" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• त्रि-स्तरीय उपभोक्ता अदालतें</text>
    <text x="16" y="306" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">जिला, राज्य व राष्ट्रीय आयोग</text>

    <!-- Bottom Highlight (Bigger Fonts 18px & 16px) -->
    <rect x="12" y="355" width="228" height="148" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="126" y="388" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">🎯 उपलब्धि:</text>
    <text x="20" y="420" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">आम नागरिकों को 6 मौलिक</text>
    <text x="20" y="446" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">अधिकार व क्षतिपूर्ति का</text>
    <text x="20" y="472" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="900">कानूनी हक प्राप्त हुआ।</text>
  </g>

  <!-- Arrow 3-4 -->
  <g transform="translate(890, 360)">
    <path d="M 0 0 L 20 0 L 20 -8 L 34 6 L 20 20 L 20 12 L 0 12 Z" fill="#38bdf8" filter="url(#glowArrow)"/>
  </g>

  <!-- Step 4: 2019 Amendment (Sky Blue) -->
  <g transform="translate(928, 125)" filter="url(#shadow2)">
    <rect width="252" height="520" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="252" height="60" rx="18" fill="#0284c7"/>
    <text x="126" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="24" font-weight="900" text-anchor="middle">2019 का संशोधन</text>
    
    <!-- Subtitle -->
    <rect x="12" y="74" width="228" height="38" rx="10" fill="#0c4a6e"/>
    <text x="126" y="100" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">💻 आधुनिक ई-कॉमर्स</text>
    
    <!-- Points (Bigger Fonts 18px & 16px) -->
    <text x="16" y="148" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• ऑनलाइन शॉपिंग शामिल</text>
    <text x="16" y="174" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">Amazon/Flipkart दायरे में</text>
    
    <text x="16" y="214" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• CCPA केंद्रीय प्राधिकरण</text>
    <text x="16" y="240" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">विशेष जांच व कार्रवाई संस्था</text>
    
    <text x="16" y="280" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• ई-दाखिल व डिजिटल केस</text>
    <text x="16" y="306" fill="#cbd5e1" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">घर बैठे ऑनलाइन सुनवाई</text>

    <!-- Bottom Highlight (Bigger Fonts 18px & 16px) -->
    <rect x="12" y="355" width="228" height="148" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="126" y="388" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900" text-anchor="middle">🔒 नया कड़ा कानून:</text>
    <text x="20" y="420" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">भ्रामक विज्ञापनों व झूठे</text>
    <text x="20" y="446" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold">दावों पर ₹50 लाख तक</text>
    <text x="20" y="472" fill="#38bdf8" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="17" font-weight="900">का जुर्माना एवं जेल की सजा।</text>
  </g>

</svg>