<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180808"/>
      <stop offset="50%" stop-color="#2d1212"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow3)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#ef4444" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad3)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">🔥 राजनीति में साम्प्रदायिकता के 4 रूप (4 Forms of Communalism)</text>
  </g>

  <!-- 4 Step Flow Grid -->
  <g transform="translate(35, 125)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#d97706"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. रोजमर्रा के पूर्वग्रह (Everyday Beliefs)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• धार्मिक पूर्वाग्रह, पारंपरिक अवधारणाएं और दूसरे धर्मों को नीचा मानना।</text>
    <text x="20" y="130" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• यह साम्प्रदायिकता का सबसे आम और व्यापक रूप है।</text>
  </g>

  <g transform="translate(565, 125)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#fb923c" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#ea580c"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. राजनीतिक प्रभुत्व की चाह (Political Dominance)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• बहुसंख्यक समुदाय अपने धर्म का राजनीतिक वर्चस्व कायम करना चाहता है।</text>
    <text x="20" y="130" fill="#fed7aa" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• अल्पसंख्यक समुदाय अलग राजनीतिक इकाई की मांग करता है।</text>
  </g>

  <g transform="translate(35, 380)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#dc2626"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">3. धर्म के आधार पर ध्रुवीकरण (Communal Mobilization)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• चुनाव में धर्म गुरुओं, पवित्र प्रतीकों व भावनात्मक अपीलों का इस्तेमाल।</text>
    <text x="20" y="130" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• एक धर्म के मतदाताओं को दूसरे धर्म के खिलाफ डराकर वोट हासिल करना।</text>
  </g>

  <g transform="translate(565, 380)" filter="url(#shadow3)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#b91c1c" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#991b1b"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">4. साम्प्रदायिक हिंसा व दंगे (Communal Violence & Riots)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• साम्प्रदायिकता का सबसे भयानक और हिंसक रूप।</text>
    <text x="20" y="130" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="900">• विभाजन के समय भयानक नरसंहार तथा आजादी के बाद के साम्प्रदायिक दंगे।</text>
  </g>
</svg>