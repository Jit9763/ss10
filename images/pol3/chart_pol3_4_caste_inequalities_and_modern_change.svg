<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="titleGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow4)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#facc15" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad4)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">📊 जातिगत असमानता व आधुनिक भारत में परिवर्तन (Caste Inequalities & Social Mobility)</text>
  </g>

  <!-- Left: Traditional Caste System -->
  <g transform="translate(35, 125)" filter="url(#shadow4)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#dc2626"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. पारंपरिक जाति व्यवस्था (Traditional Caste System)</text>
    
    <text x="25" y="100" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• जन्म पर आधारित सामाजिक पदानुक्रम:</text>
    <text x="25" y="135" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">पेशा, शादी और खान-पान केवल अपनी जाति तक सीमित।</text>

    <text x="25" y="200" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• अछूत प्रथा (Untouchability):</text>
    <text x="25" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">निचली जातियों के साथ अमानवीय व्यवहार व संसाधनों से बेदखली।</text>

    <rect x="20" y="320" width="440" height="140" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="240" y="355" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">⚠️ पुरानी स्थिति:</text>
    <text x="240" y="395" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">अवसरों से वंचित रखना व सामाजिक गतिशीलता का अभाव।</text>
  </g>

  <!-- Right: Modern Transformation -->
  <g transform="translate(565, 125)" filter="url(#shadow4)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#059669"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. आधुनिक भारत में परिवर्तन (Modern Social Change)</text>
    
    <text x="25" y="100" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• आर्थिक विकास व शहरीकरण (Urbanization):</text>
    <text x="25" y="135" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">शहरों में बसने से पुरानी जातिगत पहचान कमजोर हुई।</text>

    <text x="25" y="200" fill="#6ee7b7" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="19" font-weight="900">• शिक्षा, कानून व संवैधानिक संरक्षण:</text>
    <text x="25" y="235" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">साक्षरता वृद्धि, छुआछूत का अंत व आरक्षित चुनाव क्षेत्र।</text>

    <rect x="20" y="320" width="440" height="140" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="240" y="355" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🎯 सुधारकों का योगदान:</text>
    <text x="240" y="395" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">गांधी जी, डॉ. आंबेडकर, जोतिबा फुले, पेरियार।</text>
  </g>
</svg>