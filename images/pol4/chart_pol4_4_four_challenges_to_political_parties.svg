<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180808"/>
      <stop offset="50%" stop-color="#2d1212"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow4)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#ef4444" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad4)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">⚠️ राजनीतिक दलों के सामने 4 प्रमुख चुनौतियां (4 Challenges)</text>
  </g>

  <!-- 4 Grid Cards -->
  <g transform="translate(35, 125)" filter="url(#shadow4)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#d97706"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. आंतरिक लोकतंत्र की कमी (Lack of Internal Democracy)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• दलों के अंदर नियमित संगठनात्मक चुनाव नहीं होते।</text>
    <text x="20" y="130" fill="#fde047" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• सारी शक्ति शीर्ष 1-2 नेताओं के पास ही केंद्रित रहती है।</text>
  </g>

  <g transform="translate(565, 125)" filter="url(#shadow4)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#fb923c" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#ea580c"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. वंशवाद की चुनौती (Dynastic Succession)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• शीर्ष पदों पर केवल एक ही परिवार के लोगों का कब्जा रहना।</text>
    <text x="20" y="130" fill="#fed7aa" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• आम कार्यकर्ताओं को आगे बढ़ने का मौका न मिलना।</text>
  </g>

  <g transform="translate(35, 380)" filter="url(#shadow4)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#dc2626"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">3. धन और बाहुबल का प्रभाव (Money and Muscle Power)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• चुनाव जीतने हेतु अमीर उम्मीदवारों व अपराधियों को टिकट देना।</text>
    <text x="20" y="130" fill="#fca5a5" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• उद्योगपतियों द्वारा दिए गए चंदे से सरकारी नीतियां प्रभावित होना।</text>
  </g>

  <g transform="translate(565, 380)" filter="url(#shadow4)">
    <rect width="500" height="235" rx="16" fill="#1e293b" stroke="#b91c1c" stroke-width="2.5"/>
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#991b1b"/>
    <text x="240" y="34" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">4. सार्थक विकल्प की कमी (Lack of Meaningful Choice)</text>
    <text x="20" y="90" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• सभी दलों की नीतियों और विचारों में कोई खास अंतर न होना।</text>
    <text x="20" y="130" fill="#f87171" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• मतदाताओं के सामने असली वैचारिक विकल्प का अभाव।</text>
  </g>
</svg>