<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="650" rx="24" fill="url(#bgGrad1)" stroke="#334155" stroke-width="2.5"/>
  <rect x="12" y="12" width="1076" height="626" rx="20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title -->
  <g filter="url(#shadow1)">
    <rect x="40" y="24" width="1020" height="74" rx="16" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
    <text x="550" y="72" fill="url(#titleGrad1)" font-family="'Tiro Devanagari Hindi', 'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">📢 राजनीतिक दल के 3 घटक व मुख्य कार्य (Components & Functions)</text>
  </g>

  <!-- 3 Components Box -->
  <g transform="translate(35, 125)" filter="url(#shadow1)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#0284c7"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1. राजनीतिक दल के 3 हिस्से (Components)</text>
    
    <text x="25" y="110" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">1. नेता (Leaders):</text>
    <text x="25" y="145" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">चुनाव लड़ते हैं और सरकार में पद संभालते हैं।</text>

    <text x="25" y="210" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">2. सक्रिय सदस्य (Active Members):</text>
    <text x="25" y="245" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">पार्टी के कार्यक्रमों और रैलियों को संचालित करते हैं।</text>

    <text x="25" y="310" fill="#7dd3fc" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900">3. अनुयायी या समर्थक (Followers):</text>
    <text x="25" y="345" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18">चुनाव में पार्टी की नीतियों पर भरोसा करके वोट देते हैं।</text>
  </g>

  <!-- Functions Box -->
  <g transform="translate(565, 125)" filter="url(#shadow1)">
    <rect width="500" height="490" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="60" rx="18" fill="#059669"/>
    <text x="240" y="40" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2. राजनीतिक दलों के 6 मुख्य कार्य (Functions)</text>
    
    <text x="25" y="100" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• चुनाव लड़ना व उम्मीदवार खड़े करना।</text>
    <text x="25" y="140" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• नीतियां व कार्यक्रम जनता के सामने रखना।</text>
    <text x="25" y="180" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• देश के लिए कानून बनाने में निर्णायक भूमिका।</text>
    <text x="25" y="220" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• सरकार बनाना और चलाना।</text>
    <text x="25" y="260" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• विपक्ष की भूमिका निभाना (अंकुश लगाना)।</text>
    <text x="25" y="300" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold">• जनमत का निर्माण करना व योजनाएं पहुंचाना।</text>

    <rect x="20" y="340" width="440" height="120" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="240" y="375" fill="#34d399" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="20" font-weight="900" text-anchor="middle">🎯 लोकतंत्र का आधार:</text>
    <text x="240" y="415" fill="#ffffff" font-family="'Tiro Devanagari Hindi', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">राजनीतिक दलों के बिना आधुनिक लोकतंत्र असंभव है।</text>
  </g>
</svg>