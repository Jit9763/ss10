<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGradEco4_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGradEco4_3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowEco4_3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGradEco4_3)"/>

  <!-- Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGradEco4_3)" filter="url(#shadowEco4_3)" stroke="#fde047" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    🧸 NCERT केस स्टडी: भारत में चीनी खिलौनों का आयात एवं प्रभाव (Impact of Chinese Toys in India)
  </text>

  <!-- 3 COLUMN CARDS -->
  <!-- 1. CHINESE MANUFACTURERS -->
  <g transform="translate(45, 95)" filter="url(#shadowEco4_3)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#b45309"/>
    <rect y="28" width="320" height="18" fill="#b45309"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🇨🇳 1. चीनी उत्पादक (China)</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <text x="25" y="84" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🚀 अवसर की पहचान:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय खिलौनों की ऊंची कीमतों</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  को देखकर निर्यात का फैसला।</text>

    <rect x="15" y="158" width="290" height="95" rx="10" fill="#78350f"/>
    <text x="25" y="182" fill="#fde68a" font-size="14" font-weight="900" font-family="system-ui, sans-serif">✨ मुख्य विशेषताएं:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• नए आकर्षक प्लास्टिक डिजाइन।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• बेहद सस्ती व किफायती कीमतें।</text>
    <text x="25" y="244" fill="#ffffff" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• इलेक्ट्रॉनिक व बैटरी संचालित।</text>

    <rect x="15" y="265" width="290" height="120" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="290" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">📈 परिणाम:</text>
    <text x="25" y="315" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• 1 ही वर्ष में 70% से 80% भारतीय</text>
    <text x="25" y="335" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  दुकानों पर चीनी खिलौने छा गए।</text>
    <text x="25" y="355" fill="#38bdf8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• चीनी व्यापार का भारी विस्तार।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#b45309"/>
    <text x="160" y="422" fill="#fef3c7" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🏆 विजेता:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• चीनी निर्यातकों को नया बड़ा</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  बाजार और भारी मुनाफा मिला।</text>
  </g>

  <!-- 2. INDIAN BUYERS / CONSUMERS -->
  <g transform="translate(390, 95)" filter="url(#shadowEco4_3)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#065f46"/>
    <rect y="28" width="320" height="18" fill="#065f46"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">👨‍👩‍👧 2. भारतीय खरीदार (Buyers)</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="25" y="84" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🛍️ विकल्पों में भारी वृद्धि:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय खरीदारों को खिलौनों के</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  अनेक नए डिजाइन मिलने लगे।</text>

    <rect x="15" y="158" width="290" height="95" rx="10" fill="#064e3b"/>
    <text x="25" y="182" fill="#6ee7b7" font-size="14" font-weight="900" font-family="system-ui, sans-serif">💰 कम कीमतों का लाभ:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय खिलौनों की तुलना में</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  सस्ते दामों पर बेहतर वैरायटी।</text>
    <text x="25" y="244" fill="#ffffff" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• मध्यम वर्ग की पहुंच में खिलौने।</text>

    <rect x="15" y="265" width="290" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="290" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🎯 उपभोक्ता की पसंद:</text>
    <text x="25" y="315" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सस्ते दाम और नए डिजाइन के</text>
    <text x="25" y="335" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  कारण उपभोक्ताओं ने चीनी</text>
    <text x="25" y="355" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  खिलौने खरीदना शुरू किया।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#065f46"/>
    <text x="160" y="422" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🟢 सकारात्मक पहलू:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• विदेशी व्यापार से खरीदारों को</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  पसंद और बचत का अवसर मिला।</text>
  </g>

  <!-- 3. INDIAN TOY PRODUCERS -->
  <g transform="translate(735, 95)" filter="url(#shadowEco4_3)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#991b1b"/>
    <rect y="28" width="320" height="18" fill="#991b1b"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🇮🇳 3. भारतीय उत्पादक (Makers)</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="25" y="84" fill="#f87171" font-size="14" font-weight="900" font-family="system-ui, sans-serif">⚡ कड़ी प्रतिस्पर्धा का सामना:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय उत्पादक चीनी खिलौनों की</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  सस्ती कीमतों का मुकाबला न कर सके।</text>

    <rect x="15" y="158" width="290" height="95" rx="10" fill="#7f1d1d"/>
    <text x="25" y="182" fill="#fca5a5" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📉 बिक्री व आय में गिरावट:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय खिलौनों की मांग तेजी से घटी।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• उत्पादकों को भारी घाटा हुआ।</text>
    <text x="25" y="244" fill="#fca5a5" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• कई छोटे कारखाने बंद हो गए।</text>

    <rect x="15" y="265" width="290" height="120" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="160" y="290" fill="#f87171" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">❌ रोजगार पर संकट:</text>
    <text x="25" y="315" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• कुटीर व छोटे खिलौना उद्योग बंद होने</text>
    <text x="25" y="335" fill="#f87171" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  से हजारों कारीगर बेरोजगार हुए।</text>
    <text x="25" y="355" fill="#fca5a5" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• आजीविका पर गंभीर संकट।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#991b1b"/>
    <text x="160" y="422" fill="#fecaca" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">📌 सीख:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• विदेशी व्यापार से प्रतिस्पर्धा बढ़ती है,</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  जिसमें अक्षम छोटे उत्पादक पिटते हैं।</text>
  </g>

  <!-- Bottom Footer Bar -->
  <rect x="40" y="598" width="1020" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="623" fill="#94a3b8" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    💡 निष्कर्ष: "विदेशी व्यापार बाजारों को जोड़ता है और उपभोक्ताओं को विकल्प देता है, पर घरेलू छोटे उद्योगों को संरक्षण की जरूरत होती है।"
  </text>
</svg>