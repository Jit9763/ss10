<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGradEco4_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGradEco4_5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadowEco4_5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGradEco4_5)"/>

  <!-- Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGradEco4_5)" filter="url(#shadowEco4_5)" stroke="#e9d5ff" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    ⚖️ WTO, उदारीकरण (1991) एवं न्यायसंगत वैश्वीकरण (Fair Globalization)
  </text>

  <!-- 3 COLUMN CARDS -->
  <!-- 1. LIBERALIZATION 1991 -->
  <g transform="translate(45, 95)" filter="url(#shadowEco4_5)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#0369a1"/>
    <rect y="28" width="320" height="18" fill="#0369a1"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🔓 1. उदारीकरण (1991)</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="25" y="84" fill="#38bdf8" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📋 व्यापार अवरोधक हटाना:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सरकार द्वारा व्यापार से प्रतिबंधों</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  को हटाने की प्रक्रिया (Liberalization)।</text>

    <rect x="15" y="158" width="290" height="95" rx="10" fill="#0c4a6e"/>
    <text x="25" y="182" fill="#7dd3fc" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🇮🇳 1991 की नई नीति:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• आयात कर (Custom Duties) घटाए।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• विदेशी निवेश (FDI) की खुली छूट।</text>
    <text x="25" y="244" fill="#ffffff" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• आयात लाइसेंसिंग प्रणाली समाप्त।</text>

    <rect x="15" y="265" width="290" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="160" y="290" fill="#38bdf8" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🎯 मुख्य उद्देश्य:</text>
    <text x="25" y="315" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय उत्पादकों में वैश्विक</text>
    <text x="25" y="335" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  प्रतिस्पर्धा की क्षमता लाना।</text>
    <text x="25" y="355" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• गुणवत्ता और आधुनिक तकनीक।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#0369a1"/>
    <text x="160" y="422" fill="#bae6fd" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">📦 परिणाम:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• विदेशी वस्तुओं और MNCs का</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  भारतीय बाजार में अभूतपूर्व प्रवेश।</text>
  </g>

  <!-- 2. WORLD TRADE ORGANIZATION (WTO) -->
  <g transform="translate(390, 95)" filter="url(#shadowEco4_5)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#b45309"/>
    <rect y="28" width="320" height="18" fill="#b45309"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌐 2. WTO व विवाद</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <text x="25" y="84" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🏛️ WTO का उद्देश्य:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• अंतर्राष्ट्रीय व्यापार को मुक्त,</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  नियमबद्ध और निष्पक्ष बनाना।</text>

    <rect x="15" y="158" width="290" height="95" rx="10" fill="#78350f"/>
    <text x="25" y="182" fill="#fde68a" font-size="14" font-weight="900" font-family="system-ui, sans-serif">⚠️ विकसित देशों का दोहरा रुख:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• विकासशील देशों को व्यापार</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  अवरोधक हटाने को विवश किया।</text>
    <text x="25" y="244" fill="#ffffff" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• स्वयं अपने किसानों को अरबों $ सब्सिडी दी।</text>

    <rect x="15" y="265" width="290" height="120" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="290" fill="#fbbf24" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌾 कृषि सब्सिडी विवाद:</text>
    <text x="25" y="315" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• USA में GDP का केवल 1% कृषि,</text>
    <text x="25" y="335" fill="#f87171" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  पर भारी सब्सिडी से माल बहुत सस्ता।</text>
    <text x="25" y="355" fill="#f87171" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारतीय किसान बराबरी पर नहीं लड़ सकते।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#b45309"/>
    <text x="160" y="422" fill="#fef3c7" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🛑 असमानता:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• WTO पर विकसित देशों का प्रभुत्व</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  व्यापार को पक्षपातपूर्ण बनाता है।</text>
  </g>

  <!-- 3. FAIR GLOBALIZATION (GOVERNMENT ROLE) -->
  <g transform="translate(735, 95)" filter="url(#shadowEco4_5)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="320" height="46" rx="16" fill="#065f46"/>
    <rect y="28" width="320" height="18" fill="#065f46"/>
    <text x="160" y="32" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌱 3. न्यायसंगत वैश्वीकरण</text>
    
    <rect x="15" y="60" width="290" height="85" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="25" y="84" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🤝 सभी के लिए समान लाभ:</text>
    <text x="25" y="108" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• वैश्वीकरण के अवसर और लाभ</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  सभी तक पहुंचे, सिर्फ अमीरों तक नहीं।</text>

    <rect x="15" y="158" width="290" height="95" rx="10" fill="#064e3b"/>
    <text x="25" y="182" fill="#6ee7b7" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🏛️ सरकार की 4 मुख्य भूमिकाएं:</text>
    <text x="25" y="206" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">1. श्रम कानूनों का कड़ाई से पालन।</text>
    <text x="25" y="226" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">2. छोटे उत्पादकों को सरकारी संरक्षण।</text>
    <text x="25" y="244" fill="#ffffff" font-size="12" font-weight="900" font-family="system-ui, sans-serif">3. उचित व्यापार अवरोधकों का प्रयोग।</text>

    <rect x="15" y="265" width="290" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="290" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🌍 WTO में एकजुटता:</text>
    <text x="25" y="315" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• विकासशील देशों के साथ मिलकर</text>
    <text x="25" y="335" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  विकसित देशों के दबदबे के खिलाफ</text>
    <text x="25" y="355" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  साझा रणनीति और आवाज उठाना।</text>

    <rect x="15" y="398" width="290" height="78" rx="10" fill="#065f46"/>
    <text x="160" y="422" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🏆 अंतिम लक्ष्य:</text>
    <text x="25" y="446" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• श्रमिकों के अधिकार सुरक्षित हों और</text>
    <text x="25" y="464" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">  देश का समावेशी विकास हो सके।</text>
  </g>

  <!-- Bottom Footer Bar -->
  <rect x="40" y="598" width="1020" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="623" fill="#94a3b8" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    💡 परीक्षा सूत्र: "न्यायसंगत वैश्वीकरण सभी के लिए अवसर पैदा करेगा और इसके लाभों का न्यायपूर्ण बंटवारा सुनिश्चित करेगा।"
  </text>
</svg>