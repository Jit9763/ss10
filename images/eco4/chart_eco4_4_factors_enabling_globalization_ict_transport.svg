<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bgGradEco4_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerGradEco4_4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadowEco4_4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGradEco4_4)"/>

  <!-- Top Banner -->
  <rect x="40" y="18" width="1020" height="54" rx="14" fill="url(#bannerGradEco4_4)" filter="url(#shadowEco4_4)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="53" fill="#ffffff" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
    🚀 वैश्वीकरण को संभव बनाने वाले 2 प्रमुख प्रेरक कारक (Drivers of Globalization)
  </text>

  <!-- 2 BIG SPLIT PANELS -->
  <!-- PANEL 1: TRANSPORTATION TECHNOLOGY & CONTAINERIZATION -->
  <g transform="translate(45, 95)" filter="url(#shadowEco4_4)">
    <rect width="490" height="420" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect width="490" height="48" rx="16" fill="#1e3a8a"/>
    <rect y="30" width="490" height="18" fill="#1e3a8a"/>
    <text x="245" y="34" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      🚢 1. तीव्र परिवहन प्रौद्योगिकी (Containerization)
    </text>

    <!-- Content 1 -->
    <rect x="20" y="65" width="450" height="95" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="35" y="90" fill="#60a5fa" font-size="14" font-weight="900" font-family="system-ui, sans-serif">📦 कंटेनरों (Containers) का उपयोग:</text>
    <text x="35" y="112" fill="#e2e8f0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सामान को मानकीकृत बड़े कंटेनरों में लादा जाता है।</text>
    <text x="35" y="132" fill="#e2e8f0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• जहाजों, रेलगाड़ियों, ट्रकों और विमानों पर बिना तोड़े सीधे शिफ्ट।</text>
    <text x="35" y="150" fill="#93c5fd" font-size="12" font-weight="900" font-family="system-ui, sans-serif">  (मल्टीमॉडल सीमलेस लॉजिस्टिक्स)</text>

    <!-- Content 2 -->
    <rect x="20" y="172" width="450" height="105" rx="10" fill="#1e3a8a"/>
    <text x="35" y="197" fill="#93c5fd" font-size="14" font-weight="900" font-family="system-ui, sans-serif">⚡ ढुलाई लागत व समय में भारी कमी:</text>
    <text x="35" y="220" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• बंदरगाहों पर लदान-उतरान का समय कई सप्ताह से घटकर कुछ घंटे।</text>
    <text x="35" y="240" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• माल परिवहन लागत में आश्चर्यजनक गिरावट आई।</text>
    <text x="35" y="260" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• वायु यातायात (Air Freight) से शीघ्र खराब होने वाली वस्तुएं सुलभ।</text>

    <!-- Content 3 -->
    <rect x="20" y="290" width="450" height="105" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="245" y="315" fill="#60a5fa" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      🌍 वैश्विक प्रभाव
    </text>
    <text x="35" y="340" fill="#e2e8f0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• दूर-दराज के देश भी वैश्विक सप्लाई चेन का अभिन्न हिस्सा बने।</text>
    <text x="35" y="360" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• सामान तेजी से और कम कीमत पर दुनिया भर में पहुंचाया जा सकता है।</text>
    <text x="35" y="380" fill="#38bdf8" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• अंतर्राष्ट्रीय व्यापार की मात्रा में कई गुना उछाल।</text>
  </g>

  <!-- PANEL 2: INFORMATION & COMMUNICATION TECHNOLOGY (ICT) -->
  <g transform="translate(565, 95)" filter="url(#shadowEco4_4)">
    <rect width="490" height="420" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect width="490" height="48" rx="16" fill="#065f46"/>
    <rect y="30" width="490" height="18" fill="#065f46"/>
    <text x="245" y="34" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      💻 2. सूचना एवं संचार प्रौद्योगिकी (ICT Revolution)
    </text>

    <!-- Content 1 -->
    <rect x="20" y="65" width="450" height="95" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="35" y="90" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui, sans-serif">🌐 दूरसंचार व उपग्रह संचार:</text>
    <text x="35" y="112" fill="#e2e8f0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• टेलीग्राफ, टेलीफोन, मोबाइल फोन व फैक्स का प्रसार।</text>
    <text x="35" y="132" fill="#e2e8f0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• दुनिया के किसी भी कोने में तुरंत संपर्क व वीडियो कॉन्फ्रेंसिंग।</text>
    <text x="35" y="150" fill="#6ee7b7" font-size="12" font-weight="900" font-family="system-ui, sans-serif">  (उपग्रह एवं सबमरीन ऑप्टिकल फाइबर केबल्स)</text>

    <!-- Content 2 -->
    <rect x="20" y="172" width="450" height="105" rx="10" fill="#064e3b"/>
    <text x="35" y="197" fill="#a7f3d0" font-size="14" font-weight="900" font-family="system-ui, sans-serif">⚡ कंप्यूटर, इंटरनेट एवं ई-मेल:</text>
    <text x="35" y="220" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• इंटरनेट पर सूचनाओं का पलक झपकते आदान-प्रदान।</text>
    <text x="35" y="240" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• ई-कॉमर्स व ऑनलाइन डिजिटल भुगतान (ई-बैंकिंग)।</text>
    <text x="35" y="260" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• NCERT उदाहरण: लंदन की पत्रिका का दिल्ली में डिजाइन व मुद्रण!</text>

    <!-- Content 3 -->
    <rect x="20" y="290" width="450" height="105" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="245" y="315" fill="#34d399" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      🚀 सेवाओं का वैश्वीकरण
    </text>
    <text x="35" y="340" fill="#e2e8f0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• कॉल सेंटर, सॉफ्टवेयर विकास, डेटा एंट्री, इंजीनियरिंग डिजाइन।</text>
    <text x="35" y="360" fill="#4ade80" font-size="13" font-weight="900" font-family="system-ui, sans-serif">• भारत 'विश्व का बैक-ऑफिस' और आईटी हब बनकर उभरा।</text>
    <text x="35" y="380" fill="#93c5fd" font-size="12" font-weight="900" font-family="system-ui, sans-serif">• शून्य दूरी की दुनिया (Borderless World)।</text>
  </g>

  <!-- BOTTOM TAKEAWAY BAR -->
  <g transform="translate(45, 530)" filter="url(#shadowEco4_4)">
    <rect width="1010" height="95" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="505" y="558" fill="#34d399" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      💡 सारांश: परिवहन ने 'दूरी की लागत' घटाई और ICT ने 'समय की बाधा' खत्म कर दी!
    </text>
    <text x="505" y="582" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      इन्हीं दोनों तकनीकों के संगम ने वैश्वीकरण को तीव्र गति से आगे बढ़ाया और विश्व को एक 'ग्लोबल विलेज' बना दिया।
    </text>
    <text x="505" y="605" fill="#facc15" font-size="13" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">
      (प्रौद्योगिकी वैश्वीकरण का सबसे मुख्य इंजन है)
    </text>
  </g>
</svg>