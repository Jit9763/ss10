<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgSun)"/>

  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.6: सुंदरवन राष्ट्रीय उद्यान एवं मैंग्रोव पारिस्थितिकी तंत्र (Sundarbans Delta)</text>

  <!-- Info Cards -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="50" y="115" width="530" height="530" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <text x="70" y="155" font-size="30" fill="#7dd3fc">🌊 सुंदरवन मैंग्रोव वन (Sundarbans):</text>
    <text x="70" y="195" font-size="26" fill="#ffffff">• विश्व का सबसे बड़ा डेल्टा और मैंग्रोव वन क्षेत्र।</text>
    <text x="70" y="230" font-size="26" fill="#ffffff">• गंगा-ब्रह्मपुत्र डेल्टा (पश्चिम बंगाल) में स्थित।</text>
    <text x="70" y="265" font-size="26" fill="#ffffff">• 'सुंदरी' (Sundari Tree) वृक्ष की प्रचुरता से नाम।</text>
    <text x="70" y="300" font-size="26" fill="#7dd3fc">• तटीय अपरदन व समुद्री तूफानों से प्राकृतिक सुरक्षा।</text>
    <text x="70" y="335" font-size="26" fill="#ffffff">• 1987 में UNESCO विश्व धरोहर स्थल घोषित।</text>
    <text x="70" y="370" font-size="26" fill="#fca5a5">• चक्रवातों और समुद्र स्तर वृद्धि से पारिस्थितिकी खतरा।</text>

    <rect x="620" y="115" width="530" height="530" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
    <text x="640" y="155" font-size="30" fill="#a7f3d0">🐅 रॉयल बंगाल टाइगर का प्राकृतिक घर:</text>
    <text x="640" y="195" font-size="26" fill="#ffffff">• सुंदरवन राष्ट्रीय उद्यान (1984) एवं टाइगर रिजर्व।</text>
    <text x="640" y="230" font-size="26" fill="#ffffff">• तैरने वाले बाघों (Swimming Tigers) का एकमात्र स्थान।</text>
    <text x="640" y="265" font-size="26" fill="#ffffff">• खारे पानी के मगरमच्छ, ओलिव रिडले कछुए,</text>
    <text x="658" y="290" font-size="26" fill="#ffffff">  और इरावती डॉल्फिन की मुख्य शरणस्थली।</text>
    <text x="640" y="325" font-size="26" fill="#a7f3d0">• भारत में मैंग्रोव जैव विविधता का 50% से अधिक।</text>
  </g>
</svg>
