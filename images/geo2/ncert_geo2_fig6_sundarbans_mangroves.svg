<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="1400" height="950" fill="url(#bgSun)"/>
  
  <!-- Header Title Banner -->
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#0369a1" stroke="#38bdf8" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.1: सुंदरवन राष्ट्रीय उद्यान एवं मैंग्रोव पारिस्थितिकी तंत्र</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Left Box: Mangrove Ecosystem -->
    <rect x="40" y="150" width="630" height="760" rx="20" fill="#0c4a6e" stroke="#38bdf8" stroke-width="5"/>
    <text x="355" y="215" font-size="28" fill="#7dd3fc" text-anchor="middle">🌊 सुंदरवन मैंग्रोव डेल्टा (Sundarbans)</text>

    <text x="70" y="280" font-size="23" fill="#ffffff">• विश्व का सबसे बड़ा मैंग्रोव डेल्टा</text>
    <text x="95" y="320" font-size="23" fill="#ffffff">  और प्राकृतिक आर्द्रभूमि क्षेत्र।</text>

    <text x="70" y="385" font-size="23" fill="#ffffff">• गंगा-ब्रह्मपुत्र डेल्टा (पश्चिम बंगाल)</text>
    <text x="95" y="425" font-size="23" fill="#ffffff">  तटीय सीमा में विस्तृत।</text>

    <text x="70" y="490" font-size="23" fill="#a7f3d0">• 'सुंदरी' (Sundari Tree) वृक्षों की</text>
    <text x="95" y="530" font-size="23" fill="#a7f3d0">  प्रचुरता से सुंदरवन नाम पड़ा।</text>

    <text x="70" y="595" font-size="23" fill="#ffffff">• तटीय कटाव व समुद्री तूफानों से</text>
    <text x="95" y="635" font-size="23" fill="#ffffff">  प्राकृतिक सुरक्षा प्रदान करता है।</text>

    <text x="70" y="700" font-size="23" fill="#fbbf24">• 1987 में UNESCO विश्व धरोहर</text>
    <text x="95" y="740" font-size="23" fill="#fbbf24">  (World Heritage Site) घोषित।</text>

    <text x="70" y="805" font-size="23" fill="#fca5a5">• चक्रवातों व समुद्र स्तर वृद्धि का संकट।</text>


    <!-- Right Box: Royal Bengal Tiger Habitat -->
    <rect x="730" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#34d399" stroke-width="5"/>
    <text x="1045" y="215" font-size="28" fill="#a7f3d0" text-anchor="middle">🐅 रॉयल बंगाल टाइगर का प्राकृतिक घर</text>

    <text x="760" y="280" font-size="23" fill="#ffffff">• सुंदरवन राष्ट्रीय उद्यान (1984)</text>
    <text x="785" y="320" font-size="23" fill="#ffffff">  तथा प्रसिद्ध बाघ अभयारण्य।</text>

    <text x="760" y="385" font-size="23" fill="#a7f3d0">• तैरने वाले बाघों (Swimming Tigers)</text>
    <text x="785" y="425" font-size="23" fill="#a7f3d0">  का विश्व में एकमात्र प्राकृतिक स्थान।</text>

    <text x="760" y="490" font-size="23" fill="#ffffff">• खारे पानी के मगरमच्छ, ओलिव</text>
    <text x="785" y="530" font-size="23" fill="#ffffff">  रिडले कछुए व डॉल्फिन शरणस्थली।</text>

    <text x="760" y="595" font-size="23" fill="#ffffff">• मैंग्रोव वनस्पति की 50% से अधिक</text>
    <text x="785" y="635" font-size="23" fill="#ffffff">  प्रजातियां यहाँ विद्यमान हैं।</text>

    <text x="760" y="700" font-size="23" fill="#fbbf24">• प्रोजेक्ट टाइगर के तहत विशेष</text>
    <text x="785" y="740" font-size="23" fill="#fbbf24">  राष्ट्रीय सुरक्षा व्यवस्था लागू।</text>

    <text x="760" y="805" font-size="23" fill="#a7f3d0">• जैव विविधता संरक्षण का अद्वितीय केंद्र।</text>
  </g>
</svg>