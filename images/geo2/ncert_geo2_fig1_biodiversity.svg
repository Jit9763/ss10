<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 1.3: भारत में वनस्पतिजात व प्राणीजात का वितरण</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="40" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#22c55e" stroke-width="5"/>
    <text x="355" y="220" font-size="30" fill="#86efac" text-anchor="middle">🌱 वनस्पतिजात (Flora)</text>
    <text x="70" y="300" font-size="25" fill="#ffffff">• कुल पादप प्रजातियां: ~47,000</text>
    <text x="70" y="380" font-size="25" fill="#ffffff">• फूल वाले पौधे: 15,000 प्रजातियां</text>
    <text x="95" y="430" font-size="25" fill="#a7f3d0">  (भारत में ही स्थानिक - Endemic)</text>
    <text x="70" y="510" font-size="25" fill="#ffffff">• विश्व की कुल वनस्पति का ~10%</text>
    <text x="70" y="590" font-size="25" fill="#fca5a5">• चेतावनी: 10% जंगली वनस्पतिजात</text>
    <text x="95" y="640" font-size="25" fill="#fca5a5">  वर्तमान में लुप्त होने के संकट में।</text>
    <text x="70" y="720" font-size="25" fill="#fbbf24">• उदाहरण: महुआ (wild), घास प्रजातियां।</text>

    <rect x="730" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#38bdf8" stroke-width="5"/>
    <text x="1045" y="220" font-size="30" fill="#7dd3fc" text-anchor="middle">🐾 प्राणीजात (Fauna)</text>
    <text x="760" y="300" font-size="25" fill="#ffffff">• वन्यजीव प्रजातियां: 81,000 से अधिक</text>
    <text x="760" y="380" font-size="25" fill="#ffffff">• पक्षी प्रजातियां: 2,000 से अधिक</text>
    <text x="785" y="430" font-size="25" fill="#7dd3fc">  (विश्व का 13% हिस्सा)</text>
    <text x="760" y="510" font-size="25" fill="#ffffff">• मत्स्य प्रजातियां: 2,546 (विश्व का 12%)</text>
    <text x="760" y="590" font-size="25" fill="#fca5a5">• चेतावनी: 20% स्तनधारी जीव</text>
    <text x="785" y="640" font-size="25" fill="#fca5a5">  वर्तमान में लुप्त होने की कगार पर।</text>
    <text x="760" y="720" font-size="25" fill="#fbbf24">• उदाहरण: चीता, गुलाबी सिर वाली बतख।</text>
  </g>
</svg>