<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 6.8: पवित्र उपवन एवं जनजातीय परंपराएं</text>

  <rect x="40" y="150" width="1320" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
  <text x="700" y="220" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#a7f3d0" text-anchor="middle">🌳 पवित्र उपवन (Sacred Groves / देवराई / ओरान)</text>

  <text x="80" y="295" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• पवित्र उपवन: वनों के वे अछूते भाग जिन्हें स्थानीय प्रकृति-पूजक समाजों</text>
  <text x="115" y="345" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  द्वारा देवी-देवताओं का थान मानकर पूरी तरह संरक्षित रखा जाता है।</text>

  <text x="80" y="440" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">• छोटानागपुर क्षेत्र (मुंडा व संताल जनजातियां): महुआ (Madhuca)</text>
  <text x="115" y="490" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">  और कदंब के पेड़ों की श्रद्धापूर्वक पूजा की जाती है।</text>

  <text x="80" y="585" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• ओडिशा व बिहार की जनजातियां: विवाह के पावन अवसर पर</text>
  <text x="115" y="635" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  इमली (Tamarindus) और आम के पेड़ों की पूजा की जाती है।</text>

  <text x="80" y="730" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">• पीपल व बरगद के वृक्षों को पवित्र मानकर कटाई पर पूर्ण रोक।</text>
</svg>