<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 1.1: पारिस्थितिकी तंत्र (Ecosystem) की मूलभूत अवधारणा</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="40" y="150" width="1320" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
    <text x="700" y="220" font-size="32" fill="#a7f3d0" text-anchor="middle">🌿 मानव, वनस्पति व जीवों का परस्पर पारिस्थितिकी संबंध</text>

    <text x="80" y="295" font-size="26" fill="#ffffff">1. प्राथमिक उत्पादक (Primary Producers):</text>
    <text x="115" y="345" font-size="26" fill="#a7f3d0">   वन (Forests) पारिस्थितिकी तंत्र के मुख्य उत्पादक हैं जिन पर बाकी जीव आश्रित हैं।</text>

    <text x="80" y="440" font-size="26" fill="#ffffff">2. जीवनदायी तत्वों का पुनर्सृजन:</text>
    <text x="115" y="490" font-size="26" fill="#a7f3d0">   पौधे, पशु और सूक्ष्मजीव मिलकर स्वच्छ वायु, जल व मृदा का पुनर्सृजन करते हैं।</text>

    <text x="80" y="585" font-size="26" fill="#ffffff">3. जटिल खाद्य जाल (Complex Food Web):</text>
    <text x="115" y="635" font-size="26" fill="#a7f3d0">   किसी भी एक प्रजाति के विलोप से पूरा पारिस्थितिकी संतुलन प्रभावित होता है।</text>

    <text x="80" y="730" font-size="26" fill="#fbbf24">4. मानव निर्भरता:</text>
    <text x="115" y="780" font-size="26" fill="#fbbf24">   मानव जीवन अपने अस्तित्व के लिए इस जैविक विविधता पर पूरी तरह निर्भर है।</text>
  </g>
</svg>