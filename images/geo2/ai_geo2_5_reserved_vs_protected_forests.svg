<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 4.4: आरक्षित एवं संरक्षित वनों का कानूनी ढांचा</text>

  <rect x="40" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#22c55e" stroke-width="5"/>
  <text x="355" y="215" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#86efac" text-anchor="middle">🌲 1. आरक्षित वन (Reserved)</text>
  <text x="70" y="280" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">• कुल वन क्षेत्र का 50% से अधिक हिस्सा।</text>
  <text x="70" y="340" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">• संरक्षण दृष्टि से सर्वाधिक मूल्यवान वन।</text>
  <text x="70" y="400" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">• बिना अनुमति लकड़ी कटाई व मवेशी चराना</text>
  <text x="100" y="445" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">  पूरी तरह से प्रतिबंधित रहता है।</text>
  <text x="70" y="520" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#a7f3d0">• मुख्य राज्य: जम्मू-कश्मीर, आंध्र प्रदेश,</text>
  <text x="100" y="565" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#a7f3d0">  उत्तराखंड, केरल, तमिलनाडु, महाराष्ट्र।</text>

  <rect x="730" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#eab308" stroke-width="5"/>
  <text x="1045" y="215" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#fef08a" text-anchor="middle">🛡️ 2. संरक्षित वन (Protected)</text>
  <text x="760" y="280" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">• कुल वन क्षेत्र का लगभग 33% (1/3) भाग।</text>
  <text x="760" y="340" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">• इन्हें और अधिक नष्ट होने से बचाने हेतु</text>
  <text x="790" y="385" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">  विशेष सुरक्षा दी जाती है।</text>
  <text x="760" y="460" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#ffffff">• स्थानीय लोगों को सीमित अधिकार प्राप्त।</text>
  <text x="760" y="535" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#fef08a">• मुख्य राज्य: बिहार, हरियाणा, पंजाब,</text>
  <text x="790" y="580" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#fef08a">  हिमाचल प्रदेश, राजस्थान, ओडिशा।</text>
</svg>