<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#b91c1c" stroke="#f87171" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 3.4: खनन व विकास परियोजनाओं का पर्यावरण प्रभाव</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="60" y="125" width="1080" height="510" rx="16" fill="#1e293b" stroke="#f87171" stroke-width="4"/>
    <text x="600" y="170" font-size="32" fill="#fca5a5" text-anchor="middle">⛏️ बक्सा टाइगर रिजर्व एवं डोलोमाइट खनन केस स्टडी</text>

    <text x="90" y="215" font-size="26" fill="#ffffff">• पश्चिम बंगाल में स्थित बक्सा टाइगर रिजर्व (Buxa Tiger Reserve)</text>
    <text x="115" y="243" font-size="26" fill="#ffffff">डोलोमाइट (Dolomite) के अनियंत्रित खनन से गंभीर खतरे में है।</text>

    <text x="90" y="285" font-size="26" fill="#fca5a5">• इस खनन कार्य ने एशियाई हाथियों के प्राकृतिक आवागमन मार्ग</text>
    <text x="115" y="313" font-size="26" fill="#fca5a5">(Elephant Corridors) को विखंडित और बाधित कर दिया है।</text>

    <text x="90" y="355" font-size="26" fill="#ffffff">• कृषि विस्तार: 1951 से 1980 के बीच 26,200 वर्ग किमी से</text>
    <text x="115" y="383" font-size="26" fill="#ffffff">अधिक वन क्षेत्र को कृषि भूमि में परिवर्तित किया गया।</text>

    <text x="90" y="425" font-size="26" fill="#fbbf24">• स्थानांतरित कृषि (झूम खेती): पूर्वोत्तर व मध्य भारत में</text>
    <text x="115" y="453" font-size="26" fill="#fbbf24">वनों की कटाई और भू-निम्नीकरण का बड़ा कारण है।</text>
  </g>
</svg>