<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <!-- Header Title Banner -->
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#991b1b" stroke="#f87171" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 3.4: खनन व विकास परियोजनाओं का पर्यावरण प्रभाव</text>

  <!-- Main Container Frame -->
  <rect x="40" y="150" width="1320" height="760" rx="20" fill="#1e293b" stroke="#f87171" stroke-width="5"/>
  <text x="700" y="220" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#fca5a5" text-anchor="middle">⛏️ बक्सा टाइगर रिजर्व एवं डोलोमाइट खनन केस स्टडी</text>

  <!-- Bullet 1 -->
  <text x="80" y="295" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• पश्चिम बंगाल में स्थित बक्सा टाइगर रिजर्व (Buxa Tiger Reserve)</text>
  <text x="115" y="345" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  डोलोमाइट (Dolomite) के अनियंत्रित खनन से गंभीर खतरे में है।</text>

  <!-- Bullet 2 -->
  <text x="80" y="440" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fca5a5">• इस खनन कार्य ने एशियाई हाथियों के प्राकृतिक आवागमन मार्ग</text>
  <text x="115" y="490" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fca5a5">  (Elephant Corridors) को विखंडित और बाधित कर दिया है।</text>

  <!-- Bullet 3 -->
  <text x="80" y="585" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• कृषि विस्तार: 1951 से 1980 के बीच 26,200 वर्ग किमी से</text>
  <text x="115" y="635" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  अधिक वन क्षेत्र को कृषि भूमि में परिवर्तित किया गया।</text>

  <!-- Bullet 4 -->
  <text x="80" y="730" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">• स्थानांतरित कृषि (झूम खेती): पूर्वोत्तर व मध्य भारत में</text>
  <text x="115" y="780" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">  वनों की कटाई और भू-निम्नीकरण का बड़ा कारण है।</text>
</svg>