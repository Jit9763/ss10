<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 6.4: बीज बचाओ आंदोलन एवं नवधान्य (Navdanya)</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="40" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
    <text x="355" y="220" font-size="28" fill="#a7f3d0" text-anchor="middle">🌱 1. बीज बचाओ आंदोलन (टिहरी)</text>

    <text x="70" y="285" font-size="23" fill="#ffffff">• उत्तराखंड के टिहरी के किसानों द्वारा</text>
    <text x="95" y="325" font-size="23" fill="#ffffff">  पारंपरिक बीज संरक्षण अभियान।</text>

    <text x="70" y="390" font-size="23" fill="#a7f3d0">• बिना रासायनिक उर्वरकों के देशी</text>
    <text x="95" y="430" font-size="23" fill="#a7f3d0">  बीजों से समृद्ध फसल उत्पादन।</text>

    <text x="70" y="495" font-size="23" fill="#ffffff">• पारंपरिक फसलों (मंडुआ, झंगोरा)</text>
    <text x="95" y="535" font-size="23" fill="#ffffff">  की विविधता का पुनरुद्धार।</text>

    <text x="70" y="600" font-size="23" fill="#fbbf24">• साबित किया कि आर्थिक रूप से</text>
    <text x="95" y="640" font-size="23" fill="#fbbf24">  जैविक कृषि पूरी तरह सफल है।</text>


    <rect x="730" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#38bdf8" stroke-width="5"/>
    <text x="1045" y="220" font-size="28" fill="#7dd3fc" text-anchor="middle">🌾 2. नवधान्य आंदोलन (Navdanya)</text>

    <text x="760" y="285" font-size="23" fill="#ffffff">• डॉ. वंदना शिवा द्वारा स्थापित</text>
    <text x="785" y="325" font-size="23" fill="#ffffff">  जैविक कृषि व बीज बैंक आंदोलन।</text>

    <text x="760" y="390" font-size="23" fill="#7dd3fc">• जैव विविधता व किसान अधिकारों</text>
    <text x="785" y="430" font-size="23" fill="#7dd3fc">  की रक्षा हेतु राष्ट्रीय अभियान।</text>

    <text x="760" y="495" font-size="23" fill="#ffffff">• देशी बीजों के पेटेंट (Biopiracy)</text>
    <text x="785" y="535" font-size="23" fill="#ffffff">  के खिलाफ वैश्विक कानूनी लड़ाई।</text>

    <text x="760" y="600" font-size="23" fill="#fbbf24">• मृदा उर्वरता व मानव स्वास्थ्य का</text>
    <text x="785" y="640" font-size="23" fill="#fbbf24">  सुरक्षित प्राकृतिक संवर्धन।</text>
  </g>
</svg>