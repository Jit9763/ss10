<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.2: भारत की मुख्य संकटग्रस्त प्रजातियां</text>

  <!-- 6 Grid Boxes -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Box 1 -->
    <rect x="40" y="160" width="410" height="220" rx="16" fill="#064e3b" stroke="#ef4444" stroke-width="4"/>
    <text x="245" y="215" font-size="26" fill="#fca5a5" text-anchor="middle">🐅 एशियाई बाघ</text>
    <text x="245" y="260" font-size="22" fill="#ffffff" text-anchor="middle">कॉर्बेट व सुंदरवन</text>
    <text x="245" y="300" font-size="22" fill="#a7f3d0" text-anchor="middle">अस्तित्व पर गंभीर संकट</text>

    <!-- Box 2 -->
    <rect x="495" y="160" width="410" height="220" rx="16" fill="#064e3b" stroke="#ef4444" stroke-width="4"/>
    <text x="700" y="215" font-size="26" fill="#fca5a5" text-anchor="middle">🦏 एक-सींग वाला गेंडा</text>
    <text x="700" y="260" font-size="22" fill="#ffffff" text-anchor="middle">काजीरंगा (असम)</text>
    <text x="700" y="300" font-size="22" fill="#a7f3d0" text-anchor="middle">दलदली आवास विनाश</text>

    <!-- Box 3 -->
    <rect x="950" y="160" width="410" height="220" rx="16" fill="#064e3b" stroke="#ef4444" stroke-width="4"/>
    <text x="1155" y="215" font-size="26" fill="#fca5a5" text-anchor="middle">🦁 गिर शेर</text>
    <text x="1155" y="260" font-size="22" fill="#ffffff" text-anchor="middle">गिर वन (गुजरात)</text>
    <text x="1155" y="300" font-size="22" fill="#a7f3d0" text-anchor="middle">सीमित स्थानिक आवास</text>

    <!-- Box 4 -->
    <rect x="40" y="420" width="410" height="220" rx="16" fill="#064e3b" stroke="#f59e0b" stroke-width="4"/>
    <text x="245" y="475" font-size="26" fill="#fde68a" text-anchor="middle">🦌 काला हिरण</text>
    <text x="245" y="520" font-size="22" fill="#ffffff" text-anchor="middle">बिश्नोई रक्षित क्षेत्र</text>
    <text x="245" y="560" font-size="22" fill="#a7f3d0" text-anchor="middle">अवैध शिकार संकट</text>

    <!-- Box 5 -->
    <rect x="495" y="420" width="410" height="220" rx="16" fill="#064e3b" stroke="#f59e0b" stroke-width="4"/>
    <text x="700" y="475" font-size="26" fill="#fde68a" text-anchor="middle">🐊 घड़ियाल</text>
    <text x="700" y="520" font-size="22" fill="#ffffff" text-anchor="middle">चंबल नदी प्रणाली</text>
    <text x="700" y="560" font-size="22" fill="#a7f3d0" text-anchor="middle">नदी प्रदूषण संकट</text>

    <!-- Box 6 -->
    <rect x="950" y="420" width="410" height="220" rx="16" fill="#064e3b" stroke="#f59e0b" stroke-width="4"/>
    <text x="1155" y="475" font-size="26" fill="#fde68a" text-anchor="middle">🦌 संगाई (मणिपुरी हिरण)</text>
    <text x="1155" y="520" font-size="22" fill="#ffffff" text-anchor="middle">लोकताक झील (मणिपुर)</text>
    <text x="1155" y="560" font-size="22" fill="#a7f3d0" text-anchor="middle">फुमडी आवास क्षरण</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="120" y="680" width="1160" height="150" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <text x="700" y="740" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#38bdf8" text-anchor="middle">💡 NCERT संरक्षण संदेश:</text>
  <text x="700" y="790" font-family="'Segoe UI', Devanagari, sans-serif" font-size="24" font-weight="900" fill="#a7f3d0" text-anchor="middle">इन सभी वन्यजीवों को 1972 के कानून द्वारा सर्वोच्च कानूनी सुरक्षा प्राप्त है।</text>
</svg>