<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#991b1b" stroke="#f87171" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.2: भारत की मुख्य संकटग्रस्त प्रजातियां</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="50" y="115" width="350" height="240" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="4"/>
    <text x="225" y="155" font-size="28" fill="#fca5a5" text-anchor="middle">🐅 एशियाई बाघ</text>
    <text x="70" y="195" font-size="25" fill="#ffffff">• प्रोजेक्ट टाइगर 1973 से रक्षित।</text>
    <text x="70" y="225" font-size="25" fill="#ffffff">• शिकार व आवास विखंडन से खतरा।</text>
    <text x="70" y="255" font-size="25" fill="#ffffff">• सुंदरवन, कॉर्बेट, सरिस्का आवास।</text>

    <rect x="425" y="115" width="350" height="240" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="4"/>
    <text x="600" y="155" font-size="28" fill="#fca5a5" text-anchor="middle">🦏 एक-सींग वाला गेंडा</text>
    <text x="445" y="195" font-size="25" fill="#ffffff">• काजीरंगा (असम) मुख्य आवास।</text>
    <text x="445" y="225" font-size="25" fill="#ffffff">• अवैध शिकार से संकटापन्न।</text>
    <text x="445" y="255" font-size="25" fill="#a7f3d0">• कानून द्वारा विशेष संरक्षण।</text>

    <rect x="800" y="115" width="350" height="240" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="4"/>
    <text x="975" y="155" font-size="28" fill="#fca5a5" text-anchor="middle">🦁 एशियाई शेर</text>
    <text x="820" y="195" font-size="25" fill="#ffffff">• गिर राष्ट्रीय उद्यान (गुजरात)।</text>
    <text x="820" y="225" font-size="25" fill="#ffffff">• विश्व की दुर्लभतम शेर प्रजाति।</text>
    <text x="820" y="255" font-size="25" fill="#a7f3d0">• विशेष संरक्षण परियोजना।</text>

    <rect x="50" y="380" width="350" height="250" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <text x="225" y="420" font-size="28" fill="#fde68a" text-anchor="middle">🦌 काला हिरण</text>
    <text x="70" y="460" font-size="25" fill="#ffffff">• बिश्नोई समुदाय द्वारा रक्षित।</text>
    <text x="70" y="490" font-size="25" fill="#ffffff">• शुष्क मरुस्थलीय व मैदानी क्षेत्र।</text>
    <text x="70" y="520" font-size="25" fill="#fde68a">• अनुसूची-1 कानून रक्षण।</text>

    <rect x="425" y="380" width="350" height="250" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <text x="600" y="420" font-size="28" fill="#fde68a" text-anchor="middle">🐊 मगरमच्छ व घड़ियाल</text>
    <text x="445" y="460" font-size="25" fill="#ffffff">• चंबल नदी में मुख्य रक्षण केंद्र।</text>
    <text x="445" y="490" font-size="25" fill="#ffffff">• जल प्रदूषण व बांधों से खतरा।</text>
    <text x="445" y="520" font-size="25" fill="#fde68a">• 3 प्रजातियां रक्षित।</text>

    <rect x="800" y="380" width="350" height="250" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="4"/>
    <text x="975" y="420" font-size="28" fill="#fca5a5" text-anchor="middle">🦆 बतख व चीता</text>
    <text x="820" y="460" font-size="25" fill="#ffffff">• गुलाबी सिर बतख।</text>
    <text x="820" y="490" font-size="25" fill="#ffffff">• एशियाई चीता (1952 में लुप्त)।</text>
    <text x="820" y="520" font-size="25" fill="#fca5a5">• अपूरणीय क्षति।</text>
  </g>
</svg>