<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#0369a1" stroke="#38bdf8" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 3.5: नदी घाटी परियोजनाओं का पारिस्थितिकी प्रभाव</text>

  <rect x="40" y="150" width="1320" height="760" rx="20" fill="#0c4a6e" stroke="#38bdf8" stroke-width="5"/>
  <text x="700" y="220" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#7dd3fc" text-anchor="middle">🌊 विशाल बांध एवं वनों का जलमग्न होना</text>

  <text x="80" y="295" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• 1952 से अब तक 5,000 वर्ग किमी से अधिक वन क्षेत्र</text>
  <text x="115" y="345" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  नदी घाटी परियोजनाओं के कारण नष्ट हुए हैं।</text>

  <text x="80" y="440" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#7dd3fc">• नर्मदा सागर परियोजना (मध्य प्रदेश): 40,000 हेक्टेयर</text>
  <text x="115" y="490" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#7dd3fc">  सघन वन क्षेत्र जलमग्न होने की कगार पर है।</text>

  <text x="80" y="585" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• टिहरी बांध परियोजना (उत्तराखंड): भागीरथी नदी घाटी</text>
  <text x="115" y="635" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  का विशाल वन क्षेत्र व प्राकृतिक जैविक आवास डूब गया।</text>

  <text x="80" y="730" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">• जलमग्नता से मृदा क्षरण व जलीय जैव विविधता नष्ट होती है।</text>
</svg>