<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#064e3b"/>

  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#047857" stroke="#34d399" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.5: भारत में वनों का प्रशासनिक वर्गीकरण (Classification of Forests in India)</text>

  <!-- 3 Main Forest Categories -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Reserved Forests -->
    <rect x="50" y="115" width="350" height="530" rx="16" fill="#022c22" stroke="#10b981" stroke-width="4"/>
    <circle cx="225" cy="180" r="45" fill="#059669"/>
    <text x="225" y="192" font-size="26" fill="#ffffff" text-anchor="middle">&gt;50%</text>
    <text x="225" y="260" font-size="30" fill="#a7f3d0" text-anchor="middle">1. आरक्षित वन</text>
    <text x="225" y="290" font-size="28" fill="#34d399" text-anchor="middle">(Reserved Forests)</text>
    <text x="70" y="340" font-size="26" fill="#ffffff">• देश के कुल वनों के 50%</text>
    <text x="85" y="365" font-size="26" fill="#ffffff">  से अधिक भाग पर।</text>
    <text x="70" y="400" font-size="26" fill="#a7f3d0">• सर्वाधिक मूल्यवान माने जाते हैं।</text>
    <text x="70" y="435" font-size="26" fill="#ffffff">• शिकार, चराई व कटाई पर</text>
    <text x="85" y="460" font-size="26" fill="#ffffff">  पूर्ण प्रतिबंध।</text>
    <text x="70" y="495" font-size="26" fill="#fbbf24">• राज्य: जम्मू-कश्मीर, ए.प्र.,</text>
    <text x="85" y="520" font-size="26" fill="#fbbf24">  उत्तराखंड, केरला, तमिलनाडु,</text>
    <text x="85" y="545" font-size="26" fill="#fbbf24">  पश्चिम बंगाल, महाराष्ट्र।</text>

    <!-- Protected Forests -->
    <rect x="425" y="115" width="350" height="530" rx="16" fill="#022c22" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="600" cy="180" r="45" fill="#2563eb"/>
    <text x="600" y="192" font-size="26" fill="#ffffff" text-anchor="middle">~33%</text>
    <text x="600" y="260" font-size="30" fill="#93c5fd" text-anchor="middle">2. संरक्षित वन</text>
    <text x="600" y="290" font-size="28" fill="#60a5fa" text-anchor="middle">(Protected Forests)</text>
    <text x="445" y="340" font-size="26" fill="#ffffff">• देश के कुल वन क्षेत्र का</text>
    <text x="460" y="365" font-size="26" fill="#ffffff">  लगभग एक-तिहाई भाग।</text>
    <text x="445" y="400" font-size="26" fill="#93c5fd">• वनों को और अधिक नष्ट होने</text>
    <text x="460" y="425" font-size="26" fill="#93c5fd">  से बचाने हेतु सुरक्षा।</text>
    <text x="445" y="460" font-size="26" fill="#ffffff">• स्थानीय लोगों को नियमों के</text>
    <text x="460" y="485" font-size="26" fill="#ffffff">  साथ चराई की छूट।</text>
    <text x="445" y="520" font-size="26" fill="#fbbf24">• राज्य: बिहार, हरियाणा, पंजाब,</text>
    <text x="460" y="545" font-size="26" fill="#fbbf24">  हिमाचल, राजस्थान, ओडिशा।</text>

    <!-- Unclassed Forests -->
    <rect x="800" y="115" width="350" height="530" rx="16" fill="#022c22" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="975" cy="180" r="45" fill="#d97706"/>
    <text x="975" y="192" font-size="26" fill="#ffffff" text-anchor="middle">शेष</text>
    <text x="975" y="260" font-size="30" fill="#fde68a" text-anchor="middle">3. अवर्गीकृत वन</text>
    <text x="975" y="290" font-size="28" fill="#fbbf24" text-anchor="middle">(Unclassed Forests)</text>
    <text x="820" y="340" font-size="26" fill="#ffffff">• अन्य सभी वन व बंजर भूमि</text>
    <text x="835" y="365" font-size="26" fill="#ffffff">  जो सरकार व निजी।</text>
    <text x="820" y="400" font-size="26" fill="#fde68a">• समुदायों के स्वामित्व में</text>
    <text x="835" y="425" font-size="26" fill="#fde68a">  होते हैं।</text>
    <text x="820" y="460" font-size="26" fill="#ffffff">• पूर्वोत्तर भारत एवं गुजरात</text>
    <text x="835" y="485" font-size="26" fill="#ffffff">  में अधिकांश अवर्गीकृत।</text>
    <text x="820" y="520" font-size="26" fill="#fbbf24">• स्थानीय समुदायों द्वारा</text>
    <text x="835" y="545" font-size="26" fill="#fbbf24">  स्वायत्त प्रबंधन।</text>
  </g>
</svg>
