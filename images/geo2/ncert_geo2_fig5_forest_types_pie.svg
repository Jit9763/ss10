<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <!-- Header Title Banner -->
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.5: भारत में वनों का 3-स्तरीय प्रशासनिक वर्गीकरण</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- 1. Reserved Forests Column -->
    <rect x="40" y="150" width="410" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
    <circle cx="245" cy="220" r="50" fill="#059669" stroke="#34d399" stroke-width="4"/>
    <text x="245" y="232" font-size="32" fill="#ffffff" text-anchor="middle">&gt;50%</text>

    <text x="245" y="310" font-size="28" fill="#a7f3d0" text-anchor="middle">1. आरक्षित वन</text>
    <text x="245" y="350" font-size="24" fill="#34d399" text-anchor="middle">(Reserved Forests)</text>

    <text x="65" y="415" font-size="22" fill="#ffffff">• देश के कुल वनों के 50%</text>
    <text x="85" y="455" font-size="22" fill="#ffffff">  से अधिक भाग पर स्थित।</text>

    <text x="65" y="520" font-size="22" fill="#a7f3d0">• संरक्षण दृष्टि से सर्वाधिक</text>
    <text x="85" y="560" font-size="22" fill="#a7f3d0">  मूल्यवान वन क्षेत्र।</text>

    <text x="65" y="625" font-size="22" fill="#ffffff">• शिकार, चराई व कटाई पर</text>
    <text x="85" y="665" font-size="22" fill="#ffffff">  पूर्ण कानूनी प्रतिबंध।</text>

    <text x="65" y="730" font-size="22" fill="#fbbf24">• राज्य: J&amp;K, उत्तराखंड,</text>
    <text x="85" y="770" font-size="22" fill="#fbbf24">  केरल, TN, WB, म.प्र.।</text>


    <!-- 2. Protected Forests Column -->
    <rect x="495" y="150" width="410" height="760" rx="20" fill="#064e3b" stroke="#3b82f6" stroke-width="5"/>
    <circle cx="700" cy="220" r="50" fill="#2563eb" stroke="#60a5fa" stroke-width="4"/>
    <text x="700" y="232" font-size="32" fill="#ffffff" text-anchor="middle">~33%</text>

    <text x="700" y="310" font-size="28" fill="#93c5fd" text-anchor="middle">2. संरक्षित वन</text>
    <text x="700" y="350" font-size="24" fill="#60a5fa" text-anchor="middle">(Protected Forests)</text>

    <text x="520" y="415" font-size="22" fill="#ffffff">• कुल वन क्षेत्र का लगभग</text>
    <text x="540" y="455" font-size="22" fill="#ffffff">  एक-तिहाई (1/3) भाग।</text>

    <text x="520" y="520" font-size="22" fill="#93c5fd">• वनों को और अधिक नष्ट</text>
    <text x="540" y="560" font-size="22" fill="#93c5fd">  होने से सुरक्षा प्रदान।</text>

    <text x="520" y="625" font-size="22" fill="#ffffff">• नियमों के साथ सीमित</text>
    <text x="540" y="665" font-size="22" fill="#ffffff">  चराई व उपयोग की छूट।</text>

    <text x="520" y="730" font-size="22" fill="#fbbf24">• राज्य: पंजाब, हरियाणा,</text>
    <text x="540" y="770" font-size="22" fill="#fbbf24">  राजस्थान, बिहार, ओडिशा।</text>


    <!-- 3. Unclassed Forests Column -->
    <rect x="950" y="150" width="410" height="760" rx="20" fill="#064e3b" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="1155" cy="220" r="50" fill="#d97706" stroke="#fbbf24" stroke-width="4"/>
    <text x="1155" y="232" font-size="30" fill="#ffffff" text-anchor="middle">शेष</text>

    <text x="1155" y="310" font-size="28" fill="#fde68a" text-anchor="middle">3. अवर्गीकृत वन</text>
    <text x="1155" y="350" font-size="24" fill="#fbbf24" text-anchor="middle">(Unclassed Forests)</text>

    <text x="975" y="415" font-size="22" fill="#ffffff">• अन्य सभी वन व बंजर</text>
    <text x="995" y="455" font-size="22" fill="#ffffff">  भूमि क्षेत्र शामिल।</text>

    <text x="975" y="520" font-size="22" fill="#fde68a">• सरकार, व्यक्तियों एवं</text>
    <text x="995" y="560" font-size="22" fill="#fde68a">  समुदायों का स्वामित्व।</text>

    <text x="975" y="625" font-size="22" fill="#ffffff">• पूर्वोत्तर भारत एवं गुजरात</text>
    <text x="995" y="665" font-size="22" fill="#ffffff">  में अधिकांश अवर्गीकृत।</text>

    <text x="975" y="730" font-size="22" fill="#fbbf24">• स्थानीय समुदायों द्वारा</text>
    <text x="995" y="770" font-size="22" fill="#fbbf24">  प्रबंधित व रक्षित।</text>
  </g>
</svg>