<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#d97706" stroke="#fbbf24" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 6.8: राजस्थान में बिश्नोई समाज व सोंचुरी संरक्षण</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="60" y="125" width="1080" height="510" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <text x="600" y="170" font-size="32" fill="#fde68a" text-anchor="middle">🦌 सामुदायिक स्वायत्त संरक्षण मॉडल</text>

    <text x="90" y="215" font-size="26" fill="#ffffff">• भैरोदेव डाकव 'सोंचुरी' (अलवर, राजस्थान): 5 गांवों के लोगों ने</text>
    <text x="115" y="243" font-size="26" fill="#ffffff">1,200 हेक्टेयर वन क्षेत्र को खुद का अभयारण्य घोषित किया।</text>

    <text x="90" y="285" font-size="26" fill="#fde68a">• अपने नियम: शिकार पर पूर्ण रोक और बाहरी हस्तक्षेप से रक्षा।</text>

    <text x="90" y="325" font-size="26" fill="#ffffff">• बिश्नोई समाज (राजस्थान): काले हिरण (Blackbuck), चिंकारा व मोर</text>
    <text x="115" y="353" font-size="26" fill="#ffffff">को धार्मिक रूप से पूजित व संरक्षित रखते हैं।</text>

    <text x="90" y="395" font-size="26" fill="#a7f3d0">• सरिस्का टाइगर रिजर्व: ग्रामीणों ने खनन के खिलाफ संघर्ष किया।</text>
  </g>
</svg>