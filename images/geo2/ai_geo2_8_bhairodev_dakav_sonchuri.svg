<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 6.9: बिश्नोई समाज एवं सोंचुरी संरक्षण</text>

  <rect x="40" y="150" width="1320" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
  <text x="700" y="220" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#a7f3d0" text-anchor="middle">🦌 सामुदायिक अभयारण्य की मिसालें</text>

  <text x="80" y="295" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• भैरोदेव डाकव 'सोंचुरी' (अलवर, राजस्थान): 5 गांवों के लोगों ने</text>
  <text x="115" y="345" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  1,200 हेक्टेयर वन भूमि को खुद का अभयारण्य घोषित किया।</text>

  <text x="80" y="440" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">• इस सोंचुरी में शिकार पूरी तरह वर्जित है और ग्रामीणों के अपने नियम हैं।</text>

  <text x="80" y="535" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">• राजस्थान का बिश्नोई समाज: काले हिरण (Blackbuck), चिंकारा</text>
  <text x="115" y="585" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">  तथा मोरों का परिवार के सदस्य की भांति संरक्षण किया जाता है।</text>

  <text x="80" y="680" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">• 1730 अमृता देवी बिश्नोई बलिदान: खेजड़ी वृक्षों की कटाई रोकने</text>
  <text x="115" y="730" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">  के लिए 363 बिश्नोई वीरों का ऐतिहासिक बलिदान।</text>
</svg>