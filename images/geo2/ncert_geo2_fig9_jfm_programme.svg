<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 6.3: संयुक्त वन प्रबंधन (Joint Forest Management - JFM 1988)</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="40" y="150" width="1320" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
    <text x="700" y="220" font-size="32" fill="#a7f3d0" text-anchor="middle">🤝 समुदाय एवं वन विभाग का संयुक्त रक्षण मॉडल</text>

    <text x="80" y="295" font-size="26" fill="#ffffff">1. पहला औपचारिक प्रस्ताव (1988):</text>
    <text x="115" y="345" font-size="26" fill="#a7f3d0">   ओडिशा राज्य ने सबसे पहले संयुक्त वन प्रबंधन (JFM) का पहला प्रस्ताव पास किया।</text>

    <text x="80" y="440" font-size="26" fill="#ffffff">2. ग्राम सुरक्षा समितियां (Village Committees):</text>
    <text x="115" y="490" font-size="26" fill="#a7f3d0">   गांव स्तर पर सुरक्षा संस्थाएं क्षरित (Degraded) वनों की रखवाली करती हैं।</text>

    <text x="80" y="585" font-size="26" fill="#ffffff">3. लाभ का न्यायसंगत बंटवारा (Benefit Sharing):</text>
    <text x="115" y="635" font-size="26" fill="#a7f3d0">   बदले में ग्रामीणों को गैर-इमारती वन उत्पाद (औषधि, फल) व लकड़ी में हिस्सा।</text>

    <text x="80" y="730" font-size="26" fill="#fbbf24">4. सतत आजीविका व संरक्षण का सामंजस्य:</text>
    <text x="115" y="780" font-size="26" fill="#fbbf24">   स्थानीय लोगों की आर्थिक सुरक्षा के बिना सतत वन रक्षण संभव नहीं है।</text>
  </g>
</svg>