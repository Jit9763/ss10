<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#991b1b" stroke="#f87171" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.4: लुप्त व दुर्लभ प्रजातियों का संरक्षण मॉडल</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="60" y="125" width="1080" height="510" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="4"/>
    <text x="600" y="170" font-size="32" fill="#fca5a5" text-anchor="middle">🚨 भारत में लुप्तप्राय एवं दुर्लभ वन्यजीव प्रजातियां</text>

    <text x="90" y="215" font-size="26" fill="#ffffff">• एशियाई चीता (Cheetah): शिकार व आवास विनाश के कारण</text>
    <text x="115" y="243" font-size="26" fill="#ffffff">भारत सरकार ने 1952 में इसे भारत से लुप्त घोषित कर दिया था।</text>

    <text x="90" y="285" font-size="26" fill="#fbbf24">• प्रोजेक्ट चीता (2022): 70 साल बाद सितंबर 2022 में नामीबिया व</text>
    <text x="115" y="313" font-size="26" fill="#fbbf24">दक्षिण अफ्रीका से कुनो राष्ट्रीय उद्यान (M.P.) में चीते लाए गए।</text>

    <text x="90" y="355" font-size="26" fill="#ffffff">• गुलाबी सिर वाली बतख (Pink-headed Duck):</text>
    <text x="115" y="383" font-size="26" fill="#ffffff">भारत के वनों एवं आर्द्रभूमियों से लुप्त घोषित प्रजाति।</text>

    <text x="90" y="425" font-size="26" fill="#a7f3d0">• स्थानिक प्रजातियां (Endemic Species): अंडमानी तीतर,</text>
    <text x="115" y="453" font-size="26" fill="#a7f3d0">निकोबारी कबूतर व अंडमानी जंगली सूअर केवल द्वीप समूह में मिलते हैं।</text>

    <text x="90" y="495" font-size="26" fill="#ffffff">• दुर्लभ प्रजातियां (Rare Species): हिमालयी भूरा भालू व</text>
    <text x="115" y="523" font-size="26" fill="#ffffff">जंगली एशियाई भैंसा जिनकी संख्या बहुत कम बची है।</text>
  </g>
</svg>