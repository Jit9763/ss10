<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.5: लुप्त व दुर्लभ प्रजातियों का विस्तृत रक्षण मॉडल</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="40" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#ef4444" stroke-width="5"/>
    <text x="355" y="220" font-size="28" fill="#fca5a5" text-anchor="middle">🐆 1. लुप्त प्रजातियां (Extinct Species)</text>

    <text x="70" y="285" font-size="23" fill="#ffffff">• एशियाई चीता (Cheetah): 1952 में</text>
    <text x="95" y="325" font-size="23" fill="#ffffff">  भारत में लुप्त घोषित किया गया।</text>

    <text x="70" y="390" font-size="23" fill="#fca5a5">• सितंबर 2022 में कुनो नेशनल पार्क</text>
    <text x="95" y="430" font-size="23" fill="#fca5a5">  (M.P.) में अंतर-महाद्वीपीय पुनर्वास।</text>

    <text x="70" y="495" font-size="23" fill="#ffffff">• गुलाबी सिर वाली बतख: आवास ह्रास</text>
    <text x="95" y="535" font-size="23" fill="#ffffff">  के कारण पूरी तरह विलुप्त।</text>

    <text x="70" y="600" font-size="23" fill="#fbbf24">• पहाड़ी बटेर व हुब्बर्डिया घास भी</text>
    <text x="95" y="640" font-size="23" fill="#fbbf24">  लुप्तप्राय श्रेणी में शामिल।</text>


    <rect x="730" y="150" width="630" height="760" rx="20" fill="#064e3b" stroke="#eab308" stroke-width="5"/>
    <text x="1045" y="220" font-size="28" fill="#fef08a" text-anchor="middle">🐻 2. दुर्लभ प्रजातियां (Rare Species)</text>

    <text x="760" y="285" font-size="23" fill="#ffffff">• हिमालयी भूरा भालू (Brown Bear):</text>
    <text x="785" y="325" font-size="23" fill="#ffffff">  जनसंख्या बहुत कम व सीमित।</text>

    <text x="760" y="390" font-size="23" fill="#fef08a">• जंगली एशियाई भैंसा (Wild Buffalo):</text>
    <text x="785" y="430" font-size="23" fill="#fef08a">  आवास विखंडन से संकट में।</text>

    <text x="760" y="495" font-size="23" fill="#ffffff">• रेगिस्तानी लोमड़ी व हॉर्नबिल पक्षी:</text>
    <text x="785" y="535" font-size="23" fill="#ffffff">  विशेष विषम परिस्थितियों में खतरे में।</text>

    <text x="760" y="600" font-size="23" fill="#fbbf24">• 1972 कानून के तहत अनुसूची-1 में</text>
    <text x="785" y="640" font-size="23" fill="#fbbf24">  सर्वोच्च कानूनी सुरक्षा प्रदान।</text>
  </g>
</svg>