<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#065f46" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.5: भारतीय वन्यजीव (संरक्षण) अधिनियम 1972</text>

  <rect x="40" y="150" width="1320" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
  <text x="700" y="220" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#a7f3d0" text-anchor="middle">📜 1972 कानून के 4 प्रमुख कानूनी प्रावधान</text>

  <text x="80" y="295" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">1. रक्षित प्रजातियों की राष्ट्रीय सूची:</text>
  <text x="115" y="345" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">   पूरे भारत में संकटग्रस्त जीवों की रक्षित सूची बनाकर कानूनी सुरक्षा दी गई।</text>

  <text x="80" y="440" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">2. शिकार एवं व्यापार पर पूर्ण प्रतिबंध:</text>
  <text x="115" y="490" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">   संकटग्रस्त वन्यजीवों के शिकार और उनके अंगों के व्यापार पर रोक व सख्त सजा।</text>

  <text x="80" y="585" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">3. राष्ट्रीय उद्यान व अभयारण्यों की स्थापना:</text>
  <text x="115" y="635" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">   केंद्र व राज्य सरकारों द्वारा नेशनल पार्क और वाइल्डलाइफ सेंचुरी गठित किए गए।</text>

  <text x="80" y="730" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">4. विशिष्ट वन्यजीव संरक्षण परियोजनाएं:</text>
  <text x="115" y="780" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">   बाघ, एक-सींग गेंडा, कश्मीरी हिरण (हंगुल), मगरमच्छ संरक्षण परियोजनाएं।</text>
</svg>