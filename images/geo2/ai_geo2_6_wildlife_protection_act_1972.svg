<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.5: भारतीय वन्यजीव (संरक्षण) अधिनियम 1972</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="60" y="125" width="1080" height="510" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
    <text x="600" y="170" font-size="32" fill="#93c5fd" text-anchor="middle">⚖️ वन्यजीव सुरक्षा हेतु कानूनी प्रावधान</text>

    <text x="90" y="215" font-size="26" fill="#ffffff">• 1972 में वन्यजीवों के आवासों की सुरक्षा हेतु व्यापक कानून लागू।</text>
    <text x="90" y="255" font-size="26" fill="#93c5fd">• पूरे भारत में संकटापन्न प्रजातियों की आधिकारिक सूची प्रकाशित।</text>

    <text x="90" y="295" font-size="26" fill="#ffffff">• शिकार पर पूर्ण राष्ट्रीय प्रतिबंध और वन्यजीव व्यापार पर रोक।</text>
    <text x="90" y="335" font-size="26" fill="#a7f3d0">• राष्ट्रीय उद्यानों (National Parks) एवं अभयारण्यों का गठन।</text>

    <text x="90" y="375" font-size="26" fill="#fbbf24">• विशेष संरक्षण परियोजनाएं: प्रोजेक्ट टाइगर, एक-सींग वाला गेंडा,</text>
    <text x="115" y="403" font-size="26" fill="#fbbf24">मगरमच्छ परियोजना व एशियाई शेर संरक्षण कार्यक्रम।</text>
  </g>
</svg>