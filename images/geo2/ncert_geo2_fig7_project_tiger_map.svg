<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <!-- Header Title Banner -->
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#d97706" stroke="#fbbf24" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.2: प्रोजेक्ट टाइगर (Project Tiger 1973) एवं प्रमुख टाइगर रिजर्व</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Top Box: Launch of Project Tiger -->
    <rect x="40" y="145" width="1320" height="260" rx="20" fill="#064e3b" stroke="#fbbf24" stroke-width="5"/>
    <text x="700" y="195" font-size="28" fill="#fde68a" text-anchor="middle">🐅 प्रोजेक्ट टाइगर की शुरुआत (Launch of Project Tiger 1973)</text>
    
    <text x="80" y="250" font-size="23" fill="#ffffff">• वर्ष 1973 में विश्व की सबसे महत्वपूर्ण वन्यजीव संरक्षण परियोजनाओं में से एक के रूप में शुरुआत।</text>

    <text x="80" y="305" font-size="23" fill="#fca5a5">• 1973 में बाघों की संख्या घटकर 1,827 रह गई थी (20वीं सदी की शुरुआत में 55,000 बाघ थे)।</text>

    <text x="80" y="360" font-size="23" fill="#a7f3d0">• वर्तमान में भारत में 50 से अधिक टाइगर रिजर्व 75,000 वर्ग किमी से अधिक क्षेत्र में फैले हैं।</text>


    <!-- 3 Regional Columns -->
    <!-- Column 1: North &amp; East India -->
    <rect x="40" y="425" width="410" height="485" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
    <text x="245" y="475" font-size="26" fill="#86efac" text-anchor="middle">🗺️ उत्तर व पूर्व भारत</text>

    <text x="65" y="525" font-size="22" fill="#ffffff">• कॉर्बेट राष्ट्रीय उद्यान:</text>
    <text x="85" y="560" font-size="22" fill="#a7f3d0">  उत्तराखंड (प्रथम राष्ट्रीय पार्क)</text>

    <text x="65" y="615" font-size="22" fill="#ffffff">• काजीरंगा राष्ट्रीय उद्यान:</text>
    <text x="85" y="650" font-size="22" fill="#a7f3d0">  असम (गेंडा व बाघ रक्षण)</text>

    <text x="65" y="705" font-size="22" fill="#ffffff">• मानस बाघ रिजर्व: असम</text>

    <text x="65" y="760" font-size="22" fill="#ffffff">• सुंदरवन राष्ट्रीय उद्यान:</text>
    <text x="85" y="795" font-size="22" fill="#a7f3d0">  पश्चिम बंगाल (मैंग्रोव आवास)</text>

    <text x="65" y="850" font-size="22" fill="#fbbf24">• दुधवा पार्क: उत्तर प्रदेश</text>


    <!-- Column 2: West &amp; Central India -->
    <rect x="495" y="425" width="410" height="485" rx="20" fill="#064e3b" stroke="#eab308" stroke-width="5"/>
    <text x="700" y="475" font-size="26" fill="#fef08a" text-anchor="middle">🏰 पश्चिमी व मध्य भारत</text>

    <text x="520" y="525" font-size="22" fill="#ffffff">• सरिस्का अभयारण्य:</text>
    <text x="540" y="560" font-size="22" fill="#fef08a">  राजस्थान (अलवर जिला)</text>

    <text x="520" y="615" font-size="22" fill="#ffffff">• रणथंभौर राष्ट्रीय उद्यान:</text>
    <text x="540" y="650" font-size="22" fill="#fef08a">  राजस्थान (सवाई माधोपुर)</text>

    <text x="520" y="705" font-size="22" fill="#ffffff">• बांधवगढ़ राष्ट्रीय उद्यान:</text>
    <text x="540" y="740" font-size="22" fill="#fef08a">  मध्य प्रदेश (सघन सागौन वन)</text>

    <text x="520" y="795" font-size="22" fill="#ffffff">• कान्हा व पन्ना रिजर्व:</text>
    <text x="540" y="830" font-size="22" fill="#fbbf24">  मध्य प्रदेश (टाइगर राज्य)</text>


    <!-- Column 3: South India -->
    <rect x="950" y="425" width="410" height="485" rx="20" fill="#064e3b" stroke="#3b82f6" stroke-width="5"/>
    <text x="1155" y="475" font-size="26" fill="#93c5fd" text-anchor="middle">🌴 दक्षिण भारत</text>

    <text x="975" y="525" font-size="22" fill="#ffffff">• पेरियार बाघ रिजर्व:</text>
    <text x="995" y="560" font-size="22" fill="#93c5fd">  केरल (हाथी व बाघ अभयारण्य)</text>

    <text x="975" y="615" font-size="22" fill="#ffffff">• बांदीपुर राष्ट्रीय उद्यान:</text>
    <text x="995" y="650" font-size="22" fill="#93c5fd">  कर्नाटक (नीलगिरि बायोस्फीयर)</text>

    <text x="975" y="705" font-size="22" fill="#ffffff">• नागार्जुनसागर श्रीशैलम:</text>
    <text x="995" y="740" font-size="22" fill="#93c5fd">  आंध्र प्रदेश (विशालतम क्षेत्र)</text>

    <text x="975" y="795" font-size="22" fill="#ffffff">• सत्यमंगलम बाघ रिजर्व:</text>
    <text x="995" y="830" font-size="22" fill="#fbbf24">  तमिलनाडु (पश्चिमी घाट)</text>
  </g>
</svg>