<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>

  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#d97706" stroke="#fbbf24" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.7: प्रोजेक्ट टाइगर (Project Tiger 1973) एवं प्रमुख टाइगर रिजर्व</text>

  <!-- Info Cards Grid -->
  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <!-- Main Box -->
    <rect x="50" y="115" width="1100" height="150" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <text x="70" y="150" font-size="30" fill="#fde68a">🐅 प्रोजेक्ट टाइगर की शुरुआत (Launch of Project Tiger):</text>
    <text x="70" y="185" font-size="26" fill="#ffffff">• वर्ष 1973 में विश्व की सबसे महत्वपूर्ण वन्यजीव परियोजनाओं में से एक के रूप में शुरुआत।</text>
    <text x="70" y="215" font-size="26" fill="#ffffff">• 1973 में बाघों की संख्या घटकर केवल 1,827 रह गई थी (20वीं सदी की शुरुआत में 55,000 की तुलना में)।</text>
    <text x="70" y="245" font-size="26" fill="#a7f3d0">• वर्तमान में भारत में 50 से अधिक टाइगर रिजर्व 75,000 वर्ग किमी से अधिक क्षेत्र में फैले हैं।</text>

    <!-- Key Tiger Reserves Grid -->
    <rect x="50" y="285" width="350" height="360" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>
    <text x="225" y="325" font-size="21" fill="#86efac" text-anchor="middle">🏞️ उत्तर व पूर्व भारत</text>
    <text x="70" y="365" font-size="26" fill="#ffffff">• कॉर्बेट राष्ट्रीय उद्यान:</text>
    <text x="85" y="390" font-size="25" fill="#a7f3d0">  उत्तराखंड (प्रथम राष्ट्रीय पार्क)</text>
    <text x="70" y="425" font-size="26" fill="#ffffff">• काजीरंगा राष्ट्रीय उद्यान:</text>
    <text x="85" y="450" font-size="25" fill="#a7f3d0">  असम (गेंडा व बाघ रक्षण)</text>
    <text x="70" y="485" font-size="26" fill="#ffffff">• मानस बाघ रिजर्व: असम</text>
    <text x="70" y="520" font-size="26" fill="#ffffff">• सुंदरवन राष्ट्रीय उद्यान:</text>
    <text x="85" y="545" font-size="25" fill="#a7f3d0">  पश्चिम बंगाल</text>

    <rect x="425" y="285" width="350" height="360" rx="16" fill="#1e293b" stroke="#eab308" stroke-width="4"/>
    <text x="600" y="325" font-size="21" fill="#fef08a" text-anchor="middle">🏰 पश्चिमी व मध्य भारत</text>
    <text x="445" y="365" font-size="26" fill="#ffffff">• सरिस्का अभयारण्य:</text>
    <text x="460" y="390" font-size="25" fill="#fde68a">  राजस्थान (अलवर)</text>
    <text x="445" y="425" font-size="26" fill="#ffffff">• रणथंभौर राष्ट्रीय उद्यान:</text>
    <text x="460" y="450" font-size="25" fill="#fde68a">  राजस्थान (सवाई माधोपुर)</text>
    <text x="445" y="485" font-size="26" fill="#ffffff">• बांधवगढ़ राष्ट्रीय उद्यान:</text>
    <text x="460" y="510" font-size="25" fill="#fde68a">  मध्य प्रदेश</text>
    <text x="445" y="545" font-size="26" fill="#ffffff">• पन्ना व कान्हा रिजर्व: मध्य प्रदेश</text>

    <rect x="800" y="285" width="350" height="360" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
    <text x="975" y="325" font-size="21" fill="#93c5fd" text-anchor="middle">🌴 दक्षिण भारत</text>
    <text x="820" y="365" font-size="26" fill="#ffffff">• पेरियार बाघ रिजर्व:</text>
    <text x="835" y="390" font-size="25" fill="#93c5fd">  केरल (हाथी व बाघ)</text>
    <text x="820" y="425" font-size="26" fill="#ffffff">• बांदीपुर राष्ट्रीय उद्यान:</text>
    <text x="835" y="450" font-size="25" fill="#93c5fd">  कर्नाटक</text>
    <text x="820" y="485" font-size="26" fill="#ffffff">• नागार्जुनसागर श्रीशैलम:</text>
    <text x="835" y="510" font-size="25" fill="#93c5fd">  आंध्र प्रदेश</text>
    <text x="820" y="545" font-size="26" fill="#ffffff">• सत्यमंगलम रिजर्व: तमिलनाडु</text>
  </g>
</svg>
