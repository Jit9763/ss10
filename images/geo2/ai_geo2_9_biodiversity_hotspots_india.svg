<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#064e3b"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#047857" stroke="#34d399" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.6: भारत के जैव विविधता हॉटस्पॉट (Biodiversity Hotspots)</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="60" y="125" width="1080" height="510" rx="16" fill="#022c22" stroke="#34d399" stroke-width="4"/>
    <text x="600" y="170" font-size="32" fill="#a7f3d0" text-anchor="middle">🏔️ 3 प्रमुख जैव विविधता हॉटस्पॉट क्षेत्र</text>

    <text x="90" y="215" font-size="26" fill="#86efac">• 1. पश्चिमी घाट (Western Ghats): अत्यधिक स्थानिक प्रजातियां।</text>

    <text x="90" y="255" font-size="26" fill="#93c5fd">• 2. पूर्वी हिमालय (Eastern Himalayas): दुर्लभ वनस्पति व औषधीय पौधे।</text>

    <text x="90" y="295" font-size="26" fill="#fde68a">• 3. इंडो-बर्मा क्षेत्र: पूर्वोत्तर भारत का समृद्ध वन क्षेत्र।</text>

    <text x="90" y="345" font-size="26" fill="#ffffff">• वैश्विक स्तर पर 36 हॉटस्पॉट में से 3 भारत में स्थित हैं।</text>
  </g>
</svg>