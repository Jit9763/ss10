<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.6: भारत के 3 प्रमुख जैव विविधता हॉटस्पॉट</text>

  <rect x="40" y="150" width="1320" height="760" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="5"/>
  <text x="700" y="220" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#a7f3d0" text-anchor="middle">🌏 अति-समृद्ध जैव विविधता केंद्र (Biodiversity Hotspots)</text>

  <text x="80" y="295" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">1. पश्चिमी घाट (Western Ghats):</text>
  <text x="115" y="345" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">   सघन सदाबहार वर्षावन व 15,000 से अधिक स्थानिक पादप प्रजातियां।</text>

  <text x="80" y="440" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">2. पूर्वी हिमालय (Eastern Himalayas):</text>
  <text x="115" y="490" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">   सिक्किम व पूर्वोत्तर राज्यों के दुर्लभ पर्वतीय वनस्पति व जीव।</text>

  <text x="80" y="585" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#ffffff">3. इंडो-बर्मा क्षेत्र (Indo-Burma Region):</text>
  <text x="115" y="635" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#a7f3d0">   भारत की पूर्वोत्तर सीमा से सटा समृद्ध वन्यजीव गलियारा।</text>

  <text x="80" y="730" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24">• ये तीनों क्षेत्र विश्व धरोहर एवं सर्वोच्च संरक्षण प्राथमिकता वाले स्थान हैं।</text>
</svg>