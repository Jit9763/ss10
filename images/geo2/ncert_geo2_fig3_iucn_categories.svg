<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1200" height="675" fill="#064e3b"/>
  <rect x="40" y="20" width="1120" height="75" rx="16" fill="#047857" stroke="#34d399" stroke-width="4"/>
  <text x="600" y="68" font-family="'Segoe UI', Devanagari, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.3: IUCN प्रजातियों का 6-स्तरीय वर्गीकरण</text>

  <g font-family="'Segoe UI', Devanagari, sans-serif" font-weight="900">
    <rect x="50" y="115" width="530" height="155" rx="14" fill="#022c22" stroke="#22c55e" stroke-width="4"/>
    <text x="70" y="150" font-size="19" fill="#86efac">1. सामान्य प्रजातियां (Normal Species):</text>
    <text x="70" y="182" font-size="25" fill="#ffffff">• जिनकी संख्या सामान्य मानी जाती है (मवेशी, साल, चीड़)।</text>

    <rect x="620" y="115" width="530" height="155" rx="14" fill="#022c22" stroke="#ef4444" stroke-width="4"/>
    <text x="640" y="150" font-size="19" fill="#fca5a5">2. संकटग्रस्त प्रजातियां (Endangered):</text>
    <text x="640" y="182" font-size="25" fill="#ffffff">• जिनके लुप्त होने का खतरा है (काला हिरण, गेंडा)।</text>

    <rect x="50" y="290" width="530" height="155" rx="14" fill="#022c22" stroke="#f59e0b" stroke-width="4"/>
    <text x="70" y="325" font-size="19" fill="#fde68a">3. सुभेद्य प्रजातियां (Vulnerable):</text>
    <text x="70" y="357" font-size="25" fill="#ffffff">• जिनकी संख्या घट रही है (नीली भेड़, हाथी, गंगा डॉल्फिन)।</text>

    <rect x="620" y="290" width="530" height="155" rx="14" fill="#022c22" stroke="#eab308" stroke-width="4"/>
    <text x="640" y="325" font-size="19" fill="#fef08a">4. दुर्लभ प्रजातियां (Rare Species):</text>
    <text x="640" y="357" font-size="25" fill="#ffffff">• जिनकी संख्या बहुत कम है (हिमालयी भालू, जंगली भैंसा)।</text>

    <rect x="50" y="465" width="530" height="165" rx="14" fill="#022c22" stroke="#3b82f6" stroke-width="4"/>
    <text x="70" y="500" font-size="19" fill="#93c5fd">5. स्थानिक प्रजातियां (Endemic Species):</text>
    <text x="70" y="532" font-size="25" fill="#ffffff">• विशिष्ट क्षेत्रों में पाई जाने वाली (अंडमानी तीतर)।</text>

    <rect x="620" y="465" width="530" height="165" rx="14" fill="#022c22" stroke="#dc2626" stroke-width="4"/>
    <text x="640" y="500" font-size="19" fill="#fca5a5">6. लुप्त प्रजातियां (Extinct Species):</text>
    <text x="640" y="532" font-size="25" fill="#ffffff">• जो आवासों में पूरी तरह लुप्त हो चुकी हैं (एशियाई चीता)।</text>
  </g>
</svg>