<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <!-- Header Title Banner -->
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#047857" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="88" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 2.3: IUCN प्रजातियों का 6-स्तरीय वर्गीकरण</text>

  <!-- Row 1: Box 1 &amp; Box 2 -->
  <!-- Box 1 (Normal) -->
  <rect x="40" y="150" width="630" height="230" rx="18" fill="#064e3b" stroke="#22c55e" stroke-width="5"/>
  <text x="70" y="198" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#86efac">1. सामान्य प्रजातियां (Normal Species)</text>
  <text x="70" y="248" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#ffffff">• संख्या जीवित रहने हेतु सामान्य है।</text>
  <text x="70" y="292" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#a7f3d0">  उदाहरण: साल, चीड़, मवेशी, कृंतक।</text>

  <!-- Box 2 (Endangered) -->
  <rect x="730" y="150" width="630" height="230" rx="18" fill="#064e3b" stroke="#ef4444" stroke-width="5"/>
  <text x="760" y="198" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fca5a5">2. संकटग्रस्त प्रजातियां (Endangered)</text>
  <text x="760" y="248" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#ffffff">• लुप्त होने का गंभीर खतरा बना हुआ है।</text>
  <text x="760" y="292" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#fca5a5">  उदाहरण: काला हिरण, गेंडा, मगरमच्छ।</text>

  <!-- Row 2: Box 3 &amp; Box 4 -->
  <!-- Box 3 (Vulnerable) -->
  <rect x="40" y="405" width="630" height="230" rx="18" fill="#064e3b" stroke="#f59e0b" stroke-width="5"/>
  <text x="70" y="453" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fde68a">3. सुभेद्य प्रजातियां (Vulnerable Species)</text>
  <text x="70" y="503" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#ffffff">• जिनकी संख्या लगातार घट रही है।</text>
  <text x="70" y="547" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#fde68a">  उदाहरण: नीली भेड़, हाथी, डॉल्फिन।</text>

  <!-- Box 4 (Rare) -->
  <rect x="730" y="405" width="630" height="230" rx="18" fill="#064e3b" stroke="#eab308" stroke-width="5"/>
  <text x="760" y="453" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fef08a">4. दुर्लभ प्रजातियां (Rare Species)</text>
  <text x="760" y="503" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#ffffff">• संख्या बहुत कम या विषम स्थिति में है।</text>
  <text x="760" y="547" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#fef08a">  उदाहरण: भूरा भालू, जंगली भैंसा।</text>

  <!-- Row 3: Box 5 &amp; Box 6 -->
  <!-- Box 5 (Endemic) -->
  <rect x="40" y="660" width="630" height="230" rx="18" fill="#064e3b" stroke="#3b82f6" stroke-width="5"/>
  <text x="70" y="708" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#93c5fd">5. स्थानिक प्रजातियां (Endemic Species)</text>
  <text x="70" y="758" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#ffffff">• विशिष्ट क्षेत्रों में पाई जाने वाली।</text>
  <text x="70" y="802" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#93c5fd">  उदाहरण: अंडमानी तीतर, मिथुन।</text>

  <!-- Box 6 (Extinct) -->
  <rect x="730" y="660" width="630" height="230" rx="18" fill="#064e3b" stroke="#dc2626" stroke-width="5"/>
  <text x="760" y="708" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fca5a5">6. लुप्त प्रजातियां (Extinct Species)</text>
  <text x="760" y="758" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#ffffff">• आवासों में पूरी तरह लुप्त हो चुकी हैं।</text>
  <text x="760" y="802" font-family="'Segoe UI', Devanagari, sans-serif" font-size="23" font-weight="900" fill="#fca5a5">  उदाहरण: एशियाई चीता (1952)।</text>
</svg>