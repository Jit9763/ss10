<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <rect width="1400" height="950" fill="#0f172a"/>
  
  <!-- Main Title Banner -->
  <rect x="40" y="25" width="1320" height="100" rx="20" fill="#065f46" stroke="#34d399" stroke-width="6"/>
  <text x="700" y="85" font-family="'Segoe UI', Devanagari, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">चित्र 5.3: भारतीय वन्यजीव (संरक्षण) अधिनियम 1972 - वन रेंजर व गॉर्ड सुरक्षा गश्त</text>

  <!-- Main Canvas Background (Forest & Patrol Frame) -->
  <rect x="40" y="155" width="1320" height="750" rx="20" fill="#022c22" stroke="#10b981" stroke-width="5"/>

  <!-- Forest Trees Background Backdrop -->
  <path d="M 60 700 L 140 400 L 220 700 Z M 200 700 L 280 350 L 360 700 Z M 340 700 L 440 300 L 540 700 Z M 860 700 L 960 320 L 1060 700 Z M 1040 700 L 1140 380 L 1240 700 Z M 1180 700 L 1270 420 L 1340 700 Z" fill="#064e3b" stroke="#059669" stroke-width="3"/>

  <!-- Patrol Road Path -->
  <path d="M 400 905 L 620 520 L 780 520 L 1000 905 Z" fill="#334155" stroke="#64748b" stroke-width="4"/>
  <path d="M 700 520 L 700 905" stroke="#fbbf24" stroke-width="6" stroke-dasharray="25,15"/>

  <!-- Wildlife Protection Jeep / Patrol Vehicle Graphic -->
  <rect x="520" y="620" width="360" height="180" rx="20" fill="#1e3a8a" stroke="#60a5fa" stroke-width="6"/>
  <rect x="560" y="550" width="280" height="100" rx="15" fill="#3b82f6" stroke="#93c5fd" stroke-width="4"/>
  <circle x="590" y="800" r="45" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
  <circle x="810" y="800" r="45" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
  <!-- Police/Guard Light on top of Jeep -->
  <rect x="670" y="520" width="60" height="30" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="3"/>
  <text x="700" y="615" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">FOREST PATROL</text>
  <text x="700" y="720" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fde68a" text-anchor="middle">वन विभाग सुरक्षा गश्त</text>

  <!-- Left Guard Icon / Box -->
  <rect x="80" y="200" width="400" height="280" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="5"/>
  <text x="280" y="250" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#34d399" text-anchor="middle">👮‍♂️ वन रेंजर गश्त (Forest Guard)</text>
  <text x="110" y="305" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff">• खाकी वर्दी व वॉकी-टॉकी से लैस गॉर्ड</text>
  <text x="110" y="355" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff">• अवैध शिकार (Poaching) पर पूर्ण रोक</text>
  <text x="110" y="405" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff">• 24x7 सघन पैदल व वाहन गश्त</text>
  <text x="110" y="455" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#a7f3d0">• राष्ट्रीय उद्यान सीमाओं का रक्षण</text>

  <!-- Right Legal Provisions Box (1972 Act) -->
  <rect x="920" y="200" width="400" height="280" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="5"/>
  <text x="1120" y="250" font-family="'Segoe UI', Devanagari, sans-serif" font-size="26" font-weight="900" fill="#fbbf24" text-anchor="middle">📜 1972 अधिनियम मुख्य धाराएं</text>
  <text x="950" y="305" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff">• रक्षित जीवों की राष्ट्रीय कानूनी सूची</text>
  <text x="950" y="355" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff">• शिकार पर पूर्ण राष्ट्रीय प्रतिबंध</text>
  <text x="950" y="405" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#ffffff">• व्यापार पर कानूनी नियंत्रण व सजा</text>
  <text x="950" y="455" font-family="'Segoe UI', Devanagari, sans-serif" font-size="30" font-weight="900" fill="#fde68a">• राष्ट्रीय पार्क व अभयारण्य का गठन</text>

  <!-- Bottom Badge / Banner -->
  <rect x="350" y="830" width="700" height="55" rx="12" fill="#065f46" stroke="#34d399" stroke-width="3"/>
  <text x="700" y="867" font-family="'Segoe UI', Devanagari, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">🛡️ भारतीय वन्यजीव (संरक्षण) अधिनियम 1972 का क्रियान्वयन</text>
</svg>