                        a: 'उत्तर: 1. <b>सम्पन्न किसान (पाटीदार व जाट):</b> मंदी व गिरती कीमतों से लगान देना मुश्किल हुआ। उनके लिए स्वराज का अर्थ भारी लगान के खिलाफ लड़ाई था।<br>2. <b>निर्धन किसान:</b> वे केवल लगान कमी नहीं बल्कि पट्टे के बकाया किराये की माफी (\'नो रेंट\' अभियान) चाहते थे।<br>3. <b>व्यवसायी व उद्योगपति (FICCI 1927):</b> जी.डी. बिड़ला व पुरुषोत्तमदास के नेतृत्व में औपनिवेशिक व्यापारिक पाबंदियों का विरोध किया और आंदोलन को आर्थिक सहायता दी।<br>4. <b>महिलाएं:</b> दांडी यात्रा व जुलूसों में बड़े पैमाने पर भागीदारी की, नमक बनाया, शराब की दुकानों की पिकेटिंग की और जेल गईं।'
